# Template: link  (a stated relation between two clauses: "the ferret slept because Yusra sang", "Lamine laughed, so Teodor left", "although Ottoline waited, Lamine left")
#
# A causal, concessive or adversative connective between two clauses relates two events the
# text asserts. Both clauses are parsed as usual — their events, roles and tense are stated on
# their own — and the link is one atom whose head is the connective itself, as written:
# (Because sk_sleep_1 sk_sing_1), (So sk_laugh_1 sk_leave_1), (Although sk_leave_1 sk_wait_1).
# The connective is not normalized: because, since, so, therefore and as a result stay distinct
# heads; what they have in common is a consumer's business. The first argument is the main
# clause (the clause the connective's clause attaches to), the second the connective's own
# clause; for a coordinating connective (so, but, yet, therefore) that is the text's order.

id: link
family: link
shape: link
title: A stated relation between two clauses
status: draft

trigger:
  construction: >
    Two clauses joined by a connective that states why, in spite of what, or in contrast to what:
    because, since (causal), so, therefore, thus, consequently, as a result, although, even
    though, despite (with a clause), but, yet. Each clause is parsed with its own template; the
    link instance names the two event instances — the predication instances themselves, even
    when a clause is negated or under a modal (the negation or modal instance stays over the
    clause; the link points at the event) — and the connective. The main clause comes
    first: for "X because / since / although / even though Y", X is the main clause whether it
    comes first or after a fronted Y; for "X, so / but / yet / therefore Y" and for a connective
    opening the next sentence ("… . Therefore Y."), the first clause is the main one and the
    connective's clause the second. One instance per connective.
  surface_forms:
    - "<X> because / since / although / even though <Y>"   # X is the main clause
    - "Because / Although <Y>, <X>"                        # fronted: X is still the main clause
    - "<X>, so / but / yet <Y>"                            # the first clause is the main one
    - "<X>. Therefore / As a result / Consequently, <Y>."  # across sentences: the same
  boundary:                   # looks like a link but is not one
    - >-
      a temporal connective — after, before, when, while, until, once, as soon as, then, since
      (a time): a time relation, not a reason or a contrast
    - >-
      a connective with a noun phrase, not a clause — despite the storm, because of the rain,
      due to the audit, thanks to Lamine: an oblique on the event with the phrase as its head
      (Despite, BecauseOf, DueTo, ThanksTo); the rules read a causal one as Because
    - >-
      a connective opening the text with nothing before it — "But Lamine left.": no first
      clause to relate; parse the clause and report the connective (G05)
    - >-
      a copular, locative, degree, comparative, class-statement, part-whole or measure clause as
      an endpoint — Yusra left because the gate was open, the ladder is crooked because it is
      old, Yusra left because the barn was colder than the shed: the endpoint names that
      predication instance and the program mints the state it links
    - >-
      a conditional — if Lamine sings, Yusra leaves: the conditional template; a subjunctive (if
      Lamine had sung, …): the counterfactual template; unless / if not: still unmapped (G08)
    - >-
      an exception to a generalization — ferrets sleep, but this one works: the but introduces
      a defeasible exception, a different construction; report the clause as unmapped
    - >-
      a purpose — went to the market to buy a thermos, in order to sleep: a purpose link
    - >-
      so that with a clause — left so that Yusra could sleep: a purpose with a finite clause; no
      head here; report it as unmapped
    - >-
      a bare sequence of clauses or sentences with no connective — Lamine sang. Yusra left.: no
      relation is stated; no link

slots:
  id:   {type: id, required: true, doc: "your label for the link (k1, k2 …)"}
  head: {type: enum, values: [Because, Since, So, Therefore, Thus, Consequently, AsAResult, Although, EvenThough, Despite, But, Yet], required: true,
         doc: "the connective as written, one word in CamelCase: as a result → AsAResult, even though → EvenThough; since only in its causal sense"}
  main: {type: filler, class: Event, required: true,
         doc: "the main clause's event: the id of its PREDICATION instance (an activity, a motion, an attitude …) — never the id of a negation or modal instance over it, even when the clause is negated — the clause the connective's clause attaches to (X in 'X because Y', even when Y is fronted), or the first clause for so / but / yet / therefore"}
  sub:  {type: filler, class: Event, required: true,
         doc: "the connective's own clause's event: the id of its predication instance (never of a negation or modal over it): Y in 'X because Y', the second clause for so / but / yet / therefore"}

emits:
  - atom: "({head} {main} {sub})"

notes:
  - >-
    Both events are asserted on their own; the link adds the stated relation and nothing else.
    It is a definitional record of what the text said, at full confidence, not a causal claim
    the parse vouches for.
  - >-
    An endpoint may be any instance that mints an event — an activity, a transfer, a motion, a
    change of state, a psych state, an attitude (thought the ferret was tired, so he left: the
    thinking is the endpoint, its content stays sealed) — whatever scope it sits in; the link
    atom stays at the top level.

depends_on: [activity, motion, psych, attitude, negation]
composes_with: [negation, modal, time, location]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: the main clause first, the connective's clause second; both events asserted
      text: "The ferret slept because Yusra sang."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true, span: "The ferret"}
        - {t: named-entity, id: n1, name: "Yusra", span: "Yusra"}
        - {t: activity, id: v1, verb: sleep, actor: "@x1", tense: past, span: "The ferret slept"}
        - {t: activity, id: v2, verb: sing, actor: "@n1", tense: past, span: "Yusra sang"}
        - {t: link, id: k1, head: Because, main: "@v1", sub: "@v2", span: "because"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Member sk_ferret_1 ferret)"
        - "(Name sk_yusra_1 \"Yusra\")"
        - "(Member sk_sleep_1 sleep)"
        - "(Agent sk_sleep_1 sk_ferret_1)"
        - "(Past sk_sleep_1)"
        - "(Member sk_sing_1 sing)"
        - "(Agent sk_sing_1 sk_yusra_1)"
        - "(Past sk_sing_1)"
        - "(Because sk_sleep_1 sk_sing_1)"
      declarations:
        - "(: ferret Class)"
        - "(: sing Class)"
        - "(: sk_ferret_1 Entity)"
        - "(: sk_sing_1 Event)"
        - "(: sk_sleep_1 Event)"
        - "(: sk_yusra_1 Entity)"
        - "(: sleep Class)"
    - category: positive
      note: a coordinating connective — the first clause is the main one
      text: "Lamine laughed, so Teodor left."
      instances:
        - {t: named-entity, id: n1, name: "Lamine", span: "Lamine"}
        - {t: named-entity, id: n2, name: "Teodor", span: "Teodor"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: past, span: "Lamine laughed"}
        - {t: motion, id: m1, verb: leave, mover: "@n2", tense: past, span: "Teodor left"}
        - {t: link, id: k1, head: So, main: "@v1", sub: "@m1", span: "so"}
    - category: positive
      note: a fronted concessive — the main clause is still first
      text: "Although Ottoline waited, Lamine left."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline", span: "Ottoline"}
        - {t: named-entity, id: n2, name: "Lamine", span: "Lamine"}
        - {t: activity, id: v1, verb: wait, actor: "@n1", tense: past, span: "Ottoline waited"}
        - {t: motion, id: m1, verb: leave, mover: "@n2", tense: past, span: "Lamine left"}
        - {t: link, id: k1, head: Although, main: "@m1", sub: "@v1", span: "Although"}
    - category: abstain
      text: "Yusra laughed after Lamine sang."
      expected: {abstain: true, template: time-relation}              # a temporal connective
    - category: abstain
      text: "But Lamine left."
      expected: {abstain: true, gap: G05, span: "But"}               # a connective opening the text

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      text: "Teodor left because Yusra laughed."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past}
        - {t: activity, id: v1, verb: laugh, actor: "@n2", tense: past}
        - {t: link, id: k1, head: Because, main: "@m1", sub: "@v1"}
    - category: positive
      note: causal since, fronted — the main clause first
      text: "Since the ferret slept, Yusra sang."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: activity, id: v1, verb: sleep, actor: "@x1", tense: past}
        - {t: activity, id: v2, verb: sing, actor: "@n1", tense: past}
        - {t: link, id: k1, head: Since, main: "@v2", sub: "@v1"}
    - category: positive
      note: but — the first clause is the main one
      text: "Ottoline waited, but Teodor left."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: named-entity, id: n2, name: "Teodor"}
        - {t: activity, id: v1, verb: wait, actor: "@n1", tense: past}
        - {t: motion, id: m1, verb: leave, mover: "@n2", tense: past}
        - {t: link, id: k1, head: But, main: "@v1", sub: "@m1"}
    - category: positive
      text: "Lamine sang, yet Yusra left."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: past}
        - {t: motion, id: m1, verb: leave, mover: "@n2", tense: past}
        - {t: link, id: k1, head: Yet, main: "@v1", sub: "@m1"}
    - category: positive
      note: a connective opening the next sentence — the previous sentence's event is the main one
      text: "The ferret slept. Therefore Yusra sang."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: activity, id: v1, verb: sleep, actor: "@x1", tense: past}
        - {t: activity, id: v2, verb: sing, actor: "@n1", tense: past}
        - {t: link, id: k1, head: Therefore, main: "@v1", sub: "@v2"}
    - category: positive
      note: a multi-word connective
      text: "Lamine laughed. As a result, Yusra sang."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: past}
        - {t: activity, id: v2, verb: sing, actor: "@n2", tense: past}
        - {t: link, id: k1, head: AsAResult, main: "@v1", sub: "@v2"}
    - category: positive
      text: "Even though Lamine waited, Teodor left."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Teodor"}
        - {t: activity, id: v1, verb: wait, actor: "@n1", tense: past}
        - {t: motion, id: m1, verb: leave, mover: "@n2", tense: past}
        - {t: link, id: k1, head: EvenThough, main: "@m1", sub: "@v1"}
    - category: positive
      note: an attitude as the endpoint — the thinking is linked, its content stays sealed
      text: "Teodor believed that Yusra sang, so Lamine left."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: named-entity, id: n3, name: "Lamine"}
        - {t: activity, id: v1, verb: sing, actor: "@n2", tense: past}
        - {t: attitude, id: a1, verb: believe, holder: "@n1", content: ["@v1"], factive: false, tense: past}
        - {t: motion, id: m1, verb: leave, mover: "@n3", tense: past}
        - {t: link, id: k1, head: So, main: "@a1", sub: "@m1"}
    - category: scoped
      note: a denied main clause — the clause is negated as usual, the link stays at the top level
      text: "Because Lamine sang, the ferret did not sleep."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: past}
        - {t: activity, id: v2, verb: sleep, actor: "@x1", tense: past}
        - {t: negation, id: s1, over: ["@v2"]}
        - {t: link, id: k1, head: Because, main: "@v2", sub: "@v1"}
    - category: optional
      note: two links in one text
      text: "Lamine sang because Yusra laughed, so Teodor left."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: named-entity, id: n3, name: "Teodor"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: past}
        - {t: activity, id: v2, verb: laugh, actor: "@n2", tense: past}
        - {t: motion, id: m1, verb: leave, mover: "@n3", tense: past}
        - {t: link, id: k1, head: Because, main: "@v1", sub: "@v2"}
        - {t: link, id: k2, head: So, main: "@v1", sub: "@m1"}
    - category: positive
      note: a copular clause as the connective's clause — the state of the gate being open is the link's endpoint
      text: "Yusra left because the gate was open."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: gate, definite: true}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past}
        - {t: copular, id: c1, subject: "@x1", predicate: open, form: adjective, tense: past}
        - {t: link, id: k1, head: Because, main: "@m1", sub: "@c1"}
    - category: abstain
      text: "Yusra laughed because of the rain."
      expected: {abstain: true, template: oblique}                    # a noun phrase, not a clause: an oblique (BecauseOf)
    - category: abstain
      text: "Lamine waited while Yusra sang."
      expected: {abstain: true, template: time-relation}              # a temporal connective
    - category: abstain
      text: "If Lamine sings, Yusra leaves."
      expected: {abstain: true, template: conditional}                # a conditional
    - category: abstain
      text: "Yusra went to the market to buy a thermos."
      expected: {abstain: true, template: purpose}                   # a purpose
    - category: positive
      note: a comparison as the because-clause — the state of the ordering holding is the link's endpoint
      text: "Yusra left because the barn was colder than the shed."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past}
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: witness, id: x2, class: shed, definite: true}
        - {t: comparative, id: c1, subject: "@x1", standard: "@x2", scale: cold, relation: more, tense: past}
        - {t: link, id: k1, head: Because, main: "@m1", sub: "@c1"}
    - category: positive
      note: a measure clause as the because-clause — the state of the measure holding is the endpoint
      text: "Teodor rested because the sack weighed 40 kilograms."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: activity, id: v1, verb: rest, actor: "@n1", tense: past}
        - {t: witness, id: x1, class: sack, definite: true}
        - {t: measure, id: m1, bearer: "@x1", head: Measure, dimension: weight, magnitude: 40, unit: kilogram, tense: past}
        - {t: link, id: k1, head: Because, main: "@v1", sub: "@m1"}
