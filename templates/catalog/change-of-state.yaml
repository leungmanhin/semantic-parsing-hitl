# Template: change-of-state  (something comes to be in a new state: by itself or brought about)
#
# The thing that changes is the Patient, whether it changes on its own (the ladder broke, the
# price fell, the audit began) or someone brings the change about (Yusra broke the ladder:
# Agent beside the Patient). When the text names the state the thing comes to be in — became a
# locksmith, got wet, turned red — the result is the term the change event is linked to by
# (Result event outcome); that the outcome holds afterwards is a background rule (the seeded
# rules beside the catalog), not part of the parse. A change of place is a motion; a thing
# coming into being is a creation.

id: change-of-state
family: predication
shape: verb-class
title: A change of state, by itself or brought about
status: draft

trigger:
  construction: >
    A verbal clause whose verb denotes that its subject or its object comes to be in a new
    state: on its own — break, melt, crack, dry, freeze, burn, collapse, grow, shrink, expand,
    fade, wither, improve, recover, die, open, close, begin, end, start, stop (the audit began),
    fall and rise of a value (the price fell) — or brought about by someone — Yusra broke the
    ladder, Lamine melted the wax. Become, turn, get and go with a predicate (became a locksmith,
    turned red, got wet, went bad) name the state the subject comes to be in: record it as the
    result. Make with a predicate on its object (made the wax soft, made Yusra uncomfortable)
    names the state the object comes to be in: the maker is the agent, the object the
    undergoer, the predicate the result.
  verbs: [break, melt, crack, dry, freeze, burn, collapse, grow, shrink, expand, fade, wither,
          improve, recover, die, open, close, begin, end, start, stop, continue, resume, cease, fall, rise, become, turn,
          get, go, make]
  verbs_note: >
    Intransitive continue, resume and cease with an event-noun subject (the fighting continued,
    the audit resumed) are changes of state of that event noun; with a verbal complement they are
    aspectuals. The list anchors the class; an unlisted verb that denotes a change of state belongs here
    (record its lemma as usual). Fall, rise, go and get are of this class only in the
    change-of-state sense (a value fell, went bad, got wet); a physical fall is a motion, and
    get with an object acquired is an acquisition. Make is of this class only with a predicate on
    its object (made the wax soft); making a thing is a creation.
  surface_forms:
    - "<undergoer> V"                                # the ladder broke; the price fell
    - "<agent> V <undergoer>"                        # Yusra broke the ladder
    - "<undergoer> became / turned / got <N or ADJ>" # became a locksmith; got wet
    - "<agent> made <undergoer> <N or ADJ>"          # made the wax soft
    - "<undergoer> was V-ed by <agent>"              # passive: the roles do not change
  boundary:                   # looks like a change of state but is not one
    - >-
      a change of place — the ladder fell off the shelf, went to the market: a motion
    - >-
      a thing coming into being — built a shed, baked a loaf, wrote a letter: a creation
    - >-
      a change of hands — gave, took, bought: a transfer or an acquisition
    - >-
      an action that leaves its object as it was — read the letter, helped Lamine: an activity
    - >-
      begin, stop, keep, continue with a verbal complement — stopped working, began to sing:
      an aspectual over the action
    - >-
      get or come with a clause or an infinitive — got Lamine to send the quilt: a causative;
      came to like the quilt: an aspectual (the inchoative come_to)
    - >-
      light-verb constructions — made a change, took a turn: the noun carries the event

slots:
  id:        {type: id, required: true, doc: "your label for the change event"}
  verb:      {type: lemma, class: Class, required: true, doc: "the verb lemma"}
  agent:     {type: filler, class: Entity, role: Agent, required: false,
              doc: "who or what brings the change about: the subject of a transitive use (Yusra broke the ladder), or the by-phrase of a passive"}
  undergoer: {type: filler, class: Entity, role: Patient, required: true,
              doc: "the thing that comes to be in the new state: the subject of an intransitive use, the object of a transitive one"}
  result:    {type: lemma, class: Class, required: false,
              doc: "the state the undergoer comes to be in, when the text names it: a class (became a locksmith → locksmith) or a property (got wet → wet, turned red → red)"}
  tense:     {type: enum, values: [past, present, future], required: true,
              doc: "the clause's tense; present is recorded, not inferred"}
  aspect:    {type: enum, values: [simple, progressive, perfect, perfect_progressive, about_to, due_to, would, going_to], required: false, default: simple,
             doc: "simple; progressive for be V-ing; perfect for have V-ed; perfect_progressive for have been V-ing; about_to for be about to V / on the point of V-ing and due_to for be due to V / be to V / be set to V — the PROSPECTIVE aspect, the event upcoming at the clause's time, the word kept as the value (be going to V is the future tense, not a prospective); would for a future seen from a past moment (said the barn would flood, hoped the bridge would hold) and going_to for was / were going to V — the same PROSPECTIVE, with tense past; a would that tells what then happened (would later marry) is the plain past, and a would with no if-clause and no past moment is the modal's Would"}

mints: {id: Event}

emits:
  - atom: "(Member @id {verb})"
  - atom: "(Agent @id {agent})"
    if_filled: agent
  - atom: "(Patient @id {undergoer})"
  - atom: "(Result @id (Member {undergoer} {result}))"          # the change, linked to its outcome
    if_filled: result
  - atom: "(Past @id)"
    when: "tense == past or aspect == perfect or aspect == perfect_progressive"
  - atom: "(Future @id)"
    when: "tense == future"
  - atom: "(Ongoing @id)"
    when: "aspect == progressive or aspect == perfect_progressive"
  - atom: "(Prospective @id)"
    when: "aspect == about_to or aspect == due_to or aspect == would or aspect == going_to"

notes:
  - >-
    The undergoer is the Patient in both uses: the role says what happens to it, and the
    presence of an Agent says whether someone did it. The causative / inchoative contrast pair
    (Lamine melted the wax / the wax melted) is the test.
  - >-
    A named result is the term the change event is linked to; the parse does not assert the
    outcome as a standing fact. "Became a locksmith" says what the change was into, not that
    it still holds: that the outcome holds afterwards is a background rule at confidence 0.9,
    revisable by a later change, as the completions of a transfer or a motion are.

depends_on: [named-entity, witness, group]
composes_with: [negation, modal, time, location]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: a change on its own
      text: "The thermos cracked."
      instances:
        - {t: witness, id: x1, class: thermos, definite: true, span: "The thermos"}
        - {t: change-of-state, id: c1, verb: crack, undergoer: "@x1", tense: past, span: "The thermos cracked"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Member sk_thermos_1 thermos)"
        - "(Member sk_crack_1 crack)"
        - "(Patient sk_crack_1 sk_thermos_1)"
        - "(Past sk_crack_1)"
      declarations:
        - "(: crack Class)"
        - "(: sk_crack_1 Event)"
        - "(: sk_thermos_1 Entity)"
        - "(: thermos Class)"
    - category: positive
      note: becoming — the result is named
      text: "Teodor became a locksmith."
      instances:
        - {t: named-entity, id: n1, name: "Teodor", span: "Teodor"}
        - {t: change-of-state, id: c1, verb: become, undergoer: "@n1", result: locksmith, tense: past, span: "Teodor became a locksmith"}
    - category: positive
      note: brought about by someone
      text: "Yusra broke the ladder."
      instances:
        - {t: named-entity, id: n1, name: "Yusra", span: "Yusra"}
        - {t: witness, id: x1, class: ladder, definite: true, span: "the ladder"}
        - {t: change-of-state, id: c1, verb: break, agent: "@n1", undergoer: "@x1", tense: past, span: "Yusra broke the ladder"}
    - category: abstain
      text: "Yusra went to the market."
      expected: {abstain: true, template: motion}                     # a change of place
    - category: abstain
      text: "Lamine baked a loaf."
      expected: {abstain: true, template: creation}                   # a thing coming into being

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      text: "The ladder broke."
      instances:
        - {t: witness, id: x1, class: ladder, definite: true}
        - {t: change-of-state, id: c1, verb: break, undergoer: "@x1", tense: past}
    - category: positive
      note: a figurative fall is a change of state
      text: "The price fell."
      instances:
        - {t: witness, id: x1, class: price, definite: true}
        - {t: change-of-state, id: c1, verb: fall, undergoer: "@x1", tense: past}
    - category: positive
      text: "Lamine melted the wax."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: wax, definite: true}
        - {t: change-of-state, id: c1, verb: melt, agent: "@n1", undergoer: "@x1", tense: past}
    - category: contrast
      note: the same change on its own — the instance must differ in the agent only
      text: "The wax melted."
      instances:
        - {t: witness, id: x1, class: wax, definite: true}
        - {t: change-of-state, id: c1, verb: melt, undergoer: "@x1", tense: past}
    - category: positive
      note: get with a property as the result
      text: "The ladder got wet."
      instances:
        - {t: witness, id: x1, class: ladder, definite: true}
        - {t: change-of-state, id: c1, verb: get, undergoer: "@x1", result: wet, tense: past}
    - category: positive
      note: get with a property as the result, on a name
      text: "Yusra got tired."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: change-of-state, id: c1, verb: get, undergoer: "@n1", result: tired, tense: past}
    - category: positive
      note: turn with a property as the result
      text: "The quilt turned red."
      instances:
        - {t: witness, id: x1, class: quilt, definite: true}
        - {t: change-of-state, id: c1, verb: turn, undergoer: "@x1", result: red, tense: past}
    - category: positive
      note: make with a predicate on its object — the maker is the agent, the predicate the result
      text: "Lamine made the wax soft."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: wax, definite: true}
        - {t: change-of-state, id: c1, verb: make, agent: "@n1", undergoer: "@x1", result: soft, tense: past}
    - category: positive
      note: an event noun beginning
      text: "The audit began."
      instances:
        - {t: witness, id: x1, class: audit, definite: true}
        - {t: change-of-state, id: c1, verb: begin, undergoer: "@x1", tense: past}
    - category: scoped
      note: under clausal negation
      text: "The ladder did not break."
      instances:
        - {t: witness, id: x1, class: ladder, definite: true}
        - {t: change-of-state, id: c1, verb: break, undergoer: "@x1", tense: past}
        - {t: negation, id: s1, over: ["@c1"]}
    - category: scoped
      note: under a modal
      text: "The thermos might crack."
      instances:
        - {t: witness, id: x1, class: thermos, definite: true}
        - {t: change-of-state, id: c1, verb: crack, undergoer: "@x1", tense: present}
        - {t: modal, id: s1, over: ["@c1"], head: Might, surface: might}
    - category: optional
      note: perfect aspect
      text: "The wax has melted."
      instances:
        - {t: witness, id: x1, class: wax, definite: true}
        - {t: change-of-state, id: c1, verb: melt, undergoer: "@x1", tense: present, aspect: perfect}
    - category: abstain
      text: "Teodor built a shed."
      expected: {abstain: true, template: creation}                   # a thing coming into being
    - category: abstain
      text: "Yusra stopped working."
      expected: {abstain: true, template: aspectual}                  # a phase of the action
    - category: abstain
      text: "The ladder fell."
      expected: {abstain: true, template: motion}                     # a physical fall
    - category: abstain
      text: "Ottoline helped Lamine."
      expected: {abstain: true, template: activity}                   # the object is left as it was
    - category: positive
      note: about to on a change of state
      text: "The price is about to fall."
      instances:
        - {t: witness, id: x1, class: price, definite: true}
        - {t: change-of-state, id: e1, verb: fall, undergoer: "@x1", tense: present, aspect: about_to}
    - category: positive
      note: due to on an event noun's start, with a deictic time
      text: "The audit is due to start tomorrow."
      instances:
        - {t: witness, id: x1, class: audit, definite: true, eventive: true}
        - {t: change-of-state, id: e1, verb: start, undergoer: "@x1", tense: present, aspect: due_to}
        - {t: time, id: t1, event: "@e1", deictic: tomorrow, anchor: "@now"}
    - category: positive
      note: intransitive continue with an event-noun subject — a change of state of the event noun
      text: "The audit continued."
      instances:
        - {t: witness, id: x1, class: audit, definite: true, eventive: true}
        - {t: change-of-state, id: e1, verb: continue, undergoer: "@x1", tense: past}
    - category: positive
      note: whose — the noun the possessor of what follows
      text: "The man whose ladder broke left."
      instances:
        - {t: witness, id: x1, class: man, definite: true}
        - {t: witness, id: x2, class: ladder, possessor: "@x1"}
        - {t: change-of-state, id: c1, verb: break, undergoer: "@x2", tense: past}
        - {t: motion, id: m1, verb: leave, mover: "@x1", tense: past}
