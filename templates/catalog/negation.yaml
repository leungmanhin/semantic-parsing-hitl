# Template: negation  (stub for review: clausal negation as a scope over the negated content)

id: negation
family: scope
shape: scope
title: Clausal negation
status: stub

trigger:
  construction: >
    A clause negated by not / n't / never / no (as a sentential negator). The negated content is
    the whole predication the negator attaches to, with its tense and its own attachments; a
    witness introduced inside the negated clause belongs to the negation's scope. Would not as
    a refusal in a past narrative — the lid would not budge — is this negation over the clause
    in the past tense; the refusal has no head of its own.
  surface_forms:
    - "<S> did not <V> …"
    - "<S> is not <Adj>"
    - "<S> never <V> …"
    - "<S> would not <V> … (a refusal)"            # the lid would not budge: the clause past
  boundary:
    - >-
      not only — the negation scopes over the FOCUS instance ("not only Yusra laughed" denies
      the exclusivity, the clause stays asserted); "only … not", "not even", "not … either"
      scope over the clause, with the focus atom outside
    - >-
      no as a quantifier — no clerk arrived: a quantified statement at strength 0, not a scope
    - >-
      must not / may not / cannot / need not / is not allowed to — a negated deontic is the norm
      template's prohibition or exemption, with no negation instance; can't / might not keep a
      negation instance under or over the modal

slots:
  id:   {type: id, required: true}
  over: {type: refs, class: Proposition, required: true, doc: "the predication(s) negated"}

truth: {inherit: over}         # the atom carries the negated statement's own truth value

emits:
  - atom: "(Not {over})"

examples:
  shown:
    - category: positive
      text: "Teodor did not send the quilt."
      instances:
        - {t: named-entity, id: n1, name: "Teodor", span: "Teodor"}
        - {t: witness, id: x1, class: quilt, definite: true, span: "the quilt"}
        - {t: transfer, id: e1, verb: send, giver: "@n1", object: "@x1", tense: past, span: "Teodor did not send the quilt"}
        - {t: negation, id: s1, over: ["@e1"], span: "did not"}
  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: never — a sentential negator over a habitual present
      text: "Yusra never laughs."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: present}
        - {t: negation, id: s1, over: ["@v1"]}
    - category: positive
      note: would not as a refusal in a past narrative — the negation over the past clause, no modal
      text: "The gate would not open."
      instances:
        - {t: witness, id: x1, class: gate, definite: true}
        - {t: change-of-state, id: c1, verb: open, undergoer: "@x1", tense: past}
        - {t: negation, id: s1, over: ["@c1"]}
    - category: positive
      note: a relative clause on an indefinite under the negation — listed under the same scope
      text: "Teodor did not meet a weaver who sang."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: weaver}
        - {t: activity, id: v1, verb: meet, actor: "@n1", patient: "@x1", tense: past}
        - {t: activity, id: v2, verb: sing, actor: "@x1", tense: past}
        - {t: negation, id: s1, over: ["@v1", "@v2"]}
