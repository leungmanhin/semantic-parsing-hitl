# Template: negation  (stub for review: clausal negation as a scope over the negated content)

id: negation
family: scope
shape: scope
title: Clausal negation
status: stub

trigger:
  construction: >
    A clause negated by not / n't / never / no (as a sentential negator). The negated content is
    the whole predication the negator attaches to, with its tense and its own attachments; a
    witness introduced inside the negated clause belongs to the negation's scope.
  surface_forms:
    - "<S> did not <V> …"
    - "<S> is not <Adj>"
    - "<S> never <V> …"
  boundary:
    - >-
      not only — the negation scopes over the FOCUS instance ("not only Yusra laughed" denies
      the exclusivity, the clause stays asserted); "only … not", "not even", "not … either"
      scope over the clause, with the focus atom outside
    - >-
      no as a quantifier — no clerk arrived: a quantified statement at strength 0, not a scope
    - >-
      must not / may not / need not — the modal template decides the scope order; this template
      provides the negation instance it scopes over or under

slots:
  id:   {type: id, required: true}
  over: {type: refs, class: Proposition, required: true, doc: "the predication(s) negated"}

truth: {inherit: over}         # the atom carries the negated statement's own truth value

emits:
  - atom: "(Not {over})"

examples:
  shown:
    - category: positive
      text: "Teodor did not send the quilt."
      instances:
        - {t: named-entity, id: n1, name: "Teodor", span: "Teodor"}
        - {t: witness, id: x1, class: quilt, definite: true, span: "the quilt"}
        - {t: transfer, id: e1, verb: send, giver: "@n1", object: "@x1", tense: past, span: "Teodor did not send the quilt"}
        - {t: negation, id: s1, over: ["@e1"], span: "did not"}
  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: never — a sentential negator over a habitual present
      text: "Yusra never laughs."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: present}
        - {t: negation, id: s1, over: ["@v1"]}
