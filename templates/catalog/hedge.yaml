# Template: hedge  (the speaker's qualified commitment to a clause: "Yusra probably left", "The gate is apparently open", "Yusra is likely to win", "The mill is said to be haunted", "It is believed that Yusra left")
#
# A hedge word — probably, likely, presumably, apparently, supposedly, certainly, definitely,
# a raising adjective with a to-infinitive (likely / unlikely / bound / certain / sure to), or
# an IMPERSONAL REPORT with no source (is said / believed / thought / reported / expected /
# known to be, is considered a weaver, it is believed that P, they say that P) —
# says how far the sentence commits to its clause. It is not an operator and not a fact about
# the world: the clause's own statements are emitted at a truth value the word sets, on the one
# dial the catalog uses for commitment — a weak hedge (probably, likely, apparently …) 0.9 at
# confidence 0.7, unlikely 0.1 at 0.7, a strong one (certainly, definitely, bound to …) 1.0 at
# 0.9, a report with no source (said, believed, thought …) 0.9 at 0.7 like its adverbs, known
# 1.0 at 0.9 — and the word stays in the instance record as the provenance of that value. No
# atom is added and no holder, speaker or attitude event is minted. A possibility word (might,
# may, perhaps, maybe, possibly) is the modal's Might, an appearance verb (seems, looks) the
# evidential's head, a report with a named source the source's attitude or communication, an
# attribution (according to X) still unmapped, and a hedge on a number the measure's own slot.

id: hedge
family: scope
shape: scope
title: The speaker's qualified commitment to a clause

trigger:
  construction: >
    A clause qualified by a HEDGE: a sentence adverb of likelihood or commitment — probably,
    likely, presumably, apparently, seemingly, supposedly, reportedly, allegedly, evidently,
    certainly, surely, definitely, undoubtedly, clearly, obviously — or a RAISING adjective with
    a to-infinitive — is likely / unlikely / bound / certain / sure to V, where the subject acts
    in the infinitive's clause (tense present) — or an IMPERSONAL REPORT, a claim whose source
    is nobody in particular: a passive raising verb of saying, believing, expecting or knowing
    (X is said / believed / thought / reported / rumoured / alleged / claimed / presumed /
    assumed / understood / supposed / expected / estimated / reputed / known to be … or to V; X
    is considered / regarded as / deemed a N or ADJ), the impersonal extraposition (it is said /
    believed / thought / reported / known that P: "it" is no referent), or an impersonal active
    (they say that P, people think / believe that P). The clause is parsed with its own
    templates — a copular for "to be a weaver" or "considered a glazier", a locative for "to be
    in Calderwick", a verb's template for "to win" — with the matrix verb's tense (is said to
    be → present, was believed to be → past; a perfect infinitive, is said to have left, is
    past; is expected to win stays present, as likely to does); the hedge instance names its
    predication (or the negation, modal, norm or rule over it) in `over` and the word in `word`
    (the participle or verb lemmatized: said, believed, considered, say). The program sets the
    clause's truth value from the word; nothing else changes, no atom is added and no holder or
    attitude event is minted. One instance per hedge word.
  surface_forms:
    - "<S> probably / apparently / certainly <V> …"        # a sentence adverb: the clause at the word's dial
    - "Probably / Presumably, <clause>"                    # the same, fronted
    - "<S> is likely / unlikely / bound / certain / sure to <V> …"   # a raising adjective: the subject acts in the clause
    - "<S> is said / believed / thought / reported / expected / known to be … / to <V>"   # an impersonal report: the clause at the hearsay dial, the participle the word
    - "<S> is considered / regarded as / deemed <N or ADJ>"   # the same, over a copular clause (considered a glazier)
    - "It is said / believed / thought / known that <clause>"  # the impersonal extraposition: no referent for it
    - "They say / people think that <clause>"                 # an impersonal active: the verb lemmatized (say, think)
  boundary:                   # looks like a hedge but is not one
    - >-
      a possibility — might, may, could, perhaps, maybe, possibly: the modal template (Might),
      with the word in its surface; an epistemic inference — must be tired, must have left: the
      modal template (Must)
    - >-
      an appearance stated by a verb — seems tired, looks tired: the evidential template
    - >-
      a report with a NAMED or quantified source — Lamine says that P, Teodor believes that P,
      some people think that P, everyone says that P: that holder's attitude or communication,
      not an impersonal report; an attribution — according to Lamine, P: no template yet, and
      the claim is not asserted, so report the whole clause as unmapped (G00)
    - >-
      supposed to as a duty or an expectation of conduct — is supposed to wait, is supposed to
      lock the shed: the norm template's weak obligation; only a report about a fact (is
      supposed to be rich) is a hedge
    - >-
      a generality adverb on a report — widely / generally / commonly believed: nothing changes
      on the dial; report the adverb as unmapped (G02)
    - >-
      a stance of the subject — is sure that P, is afraid that P, is confident that P: the
      subject's attitude, the attitude template; a hedge is the speaker's, not the subject's
    - >-
      imminence or a schedule — is about to leave, is due to arrive: not a commitment; no
      template, report the predicate as unmapped; due to X as a cause likewise
    - >-
      a hedge on a number — about 40 years old, roughly 3 metres: the measure template's own
      hedge slot, the number kept
    - >-
      an evaluation — unfortunately, luckily, sadly: the speaker's feeling about the clause, not
      a commitment to it; keep the clause and report the adverb as unmapped (G02)
    - >-
      a frequency adverb — usually, often, sometimes: the frequency template; a degree adverb —
      very, almost, barely: a degree or an extent

slots:
  id:   {type: id, required: true, doc: "your label for the hedge (s1, s2 …)"}
  over: {type: refs, class: Proposition, required: true,
         doc: "the clause the hedge qualifies: the id of its predication, or of the negation, modal, norm or rule over it (probably did not leave: the negation instance); for a raising adjective, the infinitive's predication with the subject as its actor"}
  word: {type: enum, values: [probably, likely, presumably, apparently, seemingly, supposedly, reportedly, allegedly, evidently, unlikely, certainly, surely, definitely, undoubtedly, clearly, obviously, bound, certain, sure,
                              said, believed, thought, reported, rumoured, rumored, alleged, claimed, presumed, assumed, understood, supposed, expected, estimated, reputed, considered, regarded, deemed, known, say, think, believe], required: true,
         doc: "the hedge word as written, lowercase (is likely to → likely, is bound to → bound); for an impersonal report the participle (is said to → said, is regarded as → regarded, it is believed that → believed) or the verb lemmatized (they say → say, people think → think); the program sets the dial from it"}

truth:                            # the clause's own commitment, set by the word on the one dial
  strength:
    - {slot: word, values: {probably: 0.9, likely: 0.9, presumably: 0.9, apparently: 0.9, seemingly: 0.9, supposedly: 0.9, reportedly: 0.9, allegedly: 0.9, evidently: 0.9, unlikely: 0.1, certainly: 1.0, surely: 1.0, definitely: 1.0, undoubtedly: 1.0, clearly: 1.0, obviously: 1.0, bound: 1.0, certain: 1.0, sure: 1.0,
                            said: 0.9, believed: 0.9, thought: 0.9, reported: 0.9, rumoured: 0.9, rumored: 0.9, alleged: 0.9, claimed: 0.9, presumed: 0.9, assumed: 0.9, understood: 0.9, supposed: 0.9, expected: 0.9, estimated: 0.9, reputed: 0.9, considered: 0.9, regarded: 0.9, deemed: 0.9, known: 1.0, say: 0.9, think: 0.9, believe: 0.9}}
    - 1.0
  confidence:
    - {slot: word, values: {probably: 0.7, likely: 0.7, presumably: 0.7, apparently: 0.7, seemingly: 0.7, supposedly: 0.7, reportedly: 0.7, allegedly: 0.7, evidently: 0.7, unlikely: 0.7, certainly: 0.9, surely: 0.9, definitely: 0.9, undoubtedly: 0.9, clearly: 0.9, obviously: 0.9, bound: 0.9, certain: 0.9, sure: 0.9,
                            said: 0.7, believed: 0.7, thought: 0.7, reported: 0.7, rumoured: 0.7, rumored: 0.7, alleged: 0.7, claimed: 0.7, presumed: 0.7, assumed: 0.7, understood: 0.7, supposed: 0.7, expected: 0.7, estimated: 0.7, reputed: 0.7, considered: 0.7, regarded: 0.7, deemed: 0.7, known: 0.9, say: 0.7, think: 0.7, believe: 0.7}}
    - 0.99

emits:
  - atom: "{over}"                 # the clause's own statements, one per conjunct, at the hedge's truth value
    each: over

notes:
  - >-
    The hedge is the one template that sets a clause's truth value from a word instead of
    wrapping the clause in an operator. "Yusra probably left" states the leaving at strength
    0.9 and confidence 0.7 — the sentence's commitment, which a consumer reads with a band
    query — and the word probably is provenance in the instance; "unlikely" states the clause
    at strength 0.1, a weak denial with no Not; "certainly" keeps the strength at 1.0 and the
    confidence below a plain fact's. The dial is the program's: the parser only records the
    word.
  - >-
    A hedge over a negation hedges the denial ("probably did not leave": the Not statement at
    0.9 / 0.7); over a generalization it hedges the rule. The modal's Might stays an operator,
    since a possibility is a different claim from a weak assertion: "might have left" says the
    leaving is possible, "probably left" that it is likely.
  - >-
    An impersonal report — is said / believed / thought to be, is considered a glazier, it is
    believed that P, they say that P — is a hedge, not an attitude or a communication: no
    holder is stated, so no attitude event is minted and nothing is sealed; the clause is
    stated at the hearsay dial, 0.9 at 0.7, as under reportedly or supposedly, with the
    participle as the provenance; "known to be" is established, 1.0 at 0.9, as certainly is. A
    report with a source — Lamine says that P, according to Lamine — is that source's claim,
    and the sentence commits to nothing: the attitude or communication templates seal it, and
    the according-to attribution stays unmapped until it has a template.

depends_on: []
composes_with: [negation, modal, generic, attitude, copular, locative]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: a sentence adverb — the clause's own atoms at the hedge's truth value, no operator
      text: "Teodor probably locked the shed."
      instances:
        - {t: named-entity, id: n1, name: "Teodor", span: "Teodor"}
        - {t: witness, id: x1, class: shed, definite: true, span: "the shed"}
        - {t: activity, id: v1, verb: lock, actor: "@n1", patient: "@x1", tense: past, span: "Teodor probably locked the shed"}
        - {t: hedge, id: s1, over: ["@v1"], word: probably, span: "probably"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_teodor_1 \"Teodor\")"
        - "(Member sk_shed_1 shed)"
        - "(Member sk_lock_1 lock)"
        - "(Agent sk_lock_1 sk_teodor_1)"
        - "(Patient sk_lock_1 sk_shed_1)"
        - "(Past sk_lock_1)"
      declarations:
        - "(: lock Class)"
        - "(: shed Class)"
        - "(: sk_lock_1 Event)"
        - "(: sk_shed_1 Entity)"
        - "(: sk_teodor_1 Entity)"
    - category: positive
      note: a hedge on a copular clause
      text: "The gate is apparently open."
      instances:
        - {t: witness, id: x1, class: gate, definite: true, span: "The gate"}
        - {t: copular, id: c1, subject: "@x1", predicate: open, form: adjective, tense: present, span: "The gate is apparently open"}
        - {t: hedge, id: s1, over: ["@c1"], word: apparently, span: "apparently"}
    - category: positive
      note: an impersonal report — the copular clause at the hearsay dial, the participle the word, no holder, nothing sealed
      text: "The mill is said to be haunted."
      instances:
        - {t: witness, id: x1, class: mill, definite: true, span: "The mill"}
        - {t: copular, id: c1, subject: "@x1", predicate: haunted, form: adjective, tense: present, span: "The mill is said to be haunted"}
        - {t: hedge, id: s1, over: ["@c1"], word: said, span: "is said to"}
    - category: positive
      note: the impersonal extraposition — "it" is no referent; the clause at the dial
      text: "It is believed that Yusra left."
      instances:
        - {t: named-entity, id: n1, name: "Yusra", span: "Yusra"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past, span: "Yusra left"}
        - {t: hedge, id: s1, over: ["@m1"], word: believed, span: "It is believed that"}
    - category: abstain
      text: "Yusra must be tired."
      expected: {abstain: true, template: modal}                      # an epistemic inference
    - category: abstain
      text: "The ferret looks tired."
      expected: {abstain: true, template: evidential}                 # an appearance stated by a verb

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      text: "Yusra probably left."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past}
        - {t: hedge, id: s1, over: ["@m1"], word: probably}
    - category: positive
      note: a raising adjective — the subject acts in the infinitive's clause
      text: "Yusra is likely to win."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: activity, id: v1, verb: win, actor: "@n1", tense: present}
        - {t: hedge, id: s1, over: ["@v1"], word: likely}
    - category: positive
      note: unlikely — the clause at strength 0.1, no negation
      text: "Lamine is unlikely to sing."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: present}
        - {t: hedge, id: s1, over: ["@v1"], word: unlikely}
    - category: positive
      note: a strong hedge — strength 1.0, the confidence below a plain fact's
      text: "Ottoline will certainly leave."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: future}
        - {t: hedge, id: s1, over: ["@m1"], word: certainly}
    - category: positive
      note: bound to — a strong raising adjective over a copular clause
      text: "Teodor is bound to be late."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: copular, id: c1, subject: "@n1", predicate: late, form: adjective, tense: present}
        - {t: hedge, id: s1, over: ["@c1"], word: bound}
    - category: positive
      note: a hearsay adverb — a weak commitment, the source unnamed
      text: "Yusra is supposedly a weaver."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: copular, id: c1, subject: "@n1", predicate: weaver, form: noun, tense: present}
        - {t: hedge, id: s1, over: ["@c1"], word: supposedly}
    - category: positive
      note: fronted
      text: "Presumably, Teodor locked the shed."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: shed, definite: true}
        - {t: activity, id: v1, verb: lock, actor: "@n1", patient: "@x1", tense: past}
        - {t: hedge, id: s1, over: ["@v1"], word: presumably}
    - category: scoped
      note: a hedge over a negation — the denial at the hedge's truth value
      text: "Lamine probably did not leave."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past}
        - {t: negation, id: s1, over: ["@m1"]}
        - {t: hedge, id: s2, over: ["@s1"], word: probably}
    - category: scoped
      note: a hedge over a generalization — the rule at the hedge's truth value
      text: "Herons probably eat frogs."
      instances:
        - {t: range, id: q1, class: heron}
        - {t: activity, id: v1, verb: eat, actor: "@q1", patient: frog, tense: present}
        - {t: generic, id: r1, ranges: ["@q1"], over: ["@v1"]}
        - {t: hedge, id: s1, over: ["@r1"], word: probably}
    - category: abstain
      text: "Perhaps Yusra left."
      expected: {abstain: true, template: modal}                      # a possibility: Might
    - category: abstain
      text: "Teodor might be tired."
      expected: {abstain: true, template: modal}                      # a possibility
    - category: abstain
      text: "Yusra is about to leave."
      expected: {abstain: true, gap: G00, span: "about to leave"}     # imminence, not a commitment
    - category: abstain
      text: "Ottoline is about 40 years old."
      expected: {abstain: true, template: measure}                    # a hedge on a number
    - category: abstain
      text: "Lamine is sure that Yusra left."
      expected: {abstain: true, template: attitude}                   # the subject's stance
    - category: abstain
      text: "Lamine often laughed."
      expected: {abstain: true, template: frequency}                  # a frequency adverb
    - category: abstain
      text: "Unfortunately, Yusra left."
      expected: {abstain: true, gap: G02, span: "Unfortunately"}      # an evaluation: the adverb reported, the clause kept
    - category: positive
      note: a report over a locative clause — the matrix present, the clause present
      text: "Teodor is believed to be in Calderwick."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Calderwick"}
        - {t: locative, id: l1, thing: "@n1", place: "@n2", head: LocatedIn, preposition: in, tense: present}
        - {t: hedge, id: s1, over: ["@l1"], word: believed}
    - category: positive
      note: the extraposition with thought
      text: "It is thought that Lamine left."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past}
        - {t: hedge, id: s1, over: ["@m1"], word: thought}
    - category: positive
      note: reported to be
      text: "The bridge is reported to be unsafe."
      instances:
        - {t: witness, id: x1, class: bridge, definite: true}
        - {t: copular, id: c1, subject: "@x1", predicate: unsafe, form: adjective, tense: present}
        - {t: hedge, id: s1, over: ["@c1"], word: reported}
    - category: positive
      note: a raising verb of expectation — the clause present, as under likely to
      text: "Ottoline is expected to win."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: activity, id: v1, verb: win, actor: "@n1", tense: present}
        - {t: hedge, id: s1, over: ["@v1"], word: expected}
    - category: positive
      note: known to be — established, strength 1.0 at 0.9
      text: "Lamine is known to be a weaver."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: copular, id: c1, subject: "@n1", predicate: weaver, form: noun, tense: present}
        - {t: hedge, id: s1, over: ["@c1"], word: known}
    - category: positive
      note: rumoured to be
      text: "The shed is rumoured to be empty."
      instances:
        - {t: witness, id: x1, class: shed, definite: true}
        - {t: copular, id: c1, subject: "@x1", predicate: empty, form: adjective, tense: present}
        - {t: hedge, id: s1, over: ["@c1"], word: rumoured}
    - category: positive
      note: a perfect infinitive — the clause past
      text: "Teodor is alleged to have left."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past}
        - {t: hedge, id: s1, over: ["@m1"], word: alleged}
    - category: positive
      note: considered with a bare noun predicate — a copular clause under the report
      text: "Yusra is considered a glazier."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: copular, id: c1, subject: "@n1", predicate: glazier, form: noun, tense: present}
        - {t: hedge, id: s1, over: ["@c1"], word: considered}
    - category: positive
      note: regarded as
      text: "The quilt is regarded as valuable."
      instances:
        - {t: witness, id: x1, class: quilt, definite: true}
        - {t: copular, id: c1, subject: "@x1", predicate: valuable, form: adjective, tense: present}
        - {t: hedge, id: s1, over: ["@c1"], word: regarded}
    - category: positive
      note: a past matrix — the clause takes its tense
      text: "Lamine was believed to be a weaver."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: copular, id: c1, subject: "@n1", predicate: weaver, form: noun, tense: past}
        - {t: hedge, id: s1, over: ["@c1"], word: believed}
    - category: positive
      note: supposed to about a fact — hearsay, not a duty
      text: "Yusra is supposed to be rich."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: copular, id: c1, subject: "@n1", predicate: rich, form: adjective, tense: present}
        - {t: hedge, id: s1, over: ["@c1"], word: supposed}
    - category: positive
      note: an impersonal active — they say, the verb lemmatized
      text: "They say that Teodor is a glazier."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: copular, id: c1, subject: "@n1", predicate: glazier, form: noun, tense: present}
        - {t: hedge, id: s1, over: ["@c1"], word: say}
    - category: abstain
      text: "Teodor believes that Lamine did not sell the spindle."
      expected: {abstain: true, template: attitude}                   # a named holder: the subject's attitude
    - category: abstain
      text: "Teodor is supposed to wait."
      expected: {abstain: true, template: norm}                       # supposed to as a duty
    - category: abstain
      text: "According to Lamine, the gate is open."
      expected: {abstain: true, gap: G00, span: "According to Lamine, the gate is open"}   # an attribution: no template yet, the claim not asserted
