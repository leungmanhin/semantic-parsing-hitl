# Template: mention  (an anaphoric mention: a pronoun or a demonstrative standing for an earlier referent)
#
# A pronoun is a referent of its own — sk_he_1, sk_it_1 — that fills the slots of the clause it
# appears in; which earlier referent it stands for is stated separately by a coref instance, with
# the certainty the text gives. Nothing is folded silently: the roles stay on the mention, the
# identity is a link that can be checked and revised downstream. A gendered pronoun states the
# gender of what it stands for — he, him, his, himself: (Member sk_he_1 male); she, her, hers,
# herself: (Member sk_she_1 female) — the text's own word, which the coref rules carry to the
# antecedent (decided with the owner 2026-11-09: gender only from the text's words, never from a
# name). Any other mention emits no atom of its own; the link says who it is.

id: mention
family: referent
shape: referent
title: A pronoun or a demonstrative standing for an earlier referent
status: draft

trigger:
  construction: >
    A pronoun or a demonstrative used as a noun phrase that stands for something already in the
    text: he, she, it, they, him, her, them, his, its, their, himself, herself, themselves, this,
    that ("that surprised Marisol"). One instance per occurrence; the word is recorded. The mention
    fills the slot a name or a witness would fill (the actor, the patient, the possessor of a
    witness), and a coref instance links it to the referent's first instance. A repeated name
    (Marisol … Marisol) is a second named-entity instance, and an anaphoric definite (a sluice … the
    sluice) a second witness, each with its own coref instance: they are not mentions.
  surface_forms:
    - "<pronoun>"                       # he laughed; Marisol saw him
    - "<possessive pronoun> <N>"        # her bobbin: the pronoun is the witness's possessor
    - "<demonstrative> as a noun phrase" # that surprised Marisol
  boundary:                   # looks like a mention but is not one
    - >-
      a relative pronoun opening a relative clause — the stork that ate the frog, the lantern
      that Joost mended: no mention; the noun fills the clause's role directly (relative clauses)
    - >-
      an expletive — it rained, it is clear that: no referent, no mention
    - >-
      a generic or impersonal pronoun — one never knows, you cannot be sure: no referent,
      reported as unmapped; they say that P, people think that P: no referent either, and the
      clause goes under the hedge template
    - >-
      a pronoun whose antecedent is a bare-plural or mass class filler — collects stamps and trades
      them: no referent to link; the pronoun's slot takes the same bare lemma (stamp), no mention
      and no coref
    - >-
      first- and second-person pronouns in quoted speech (I, you, we) — mentions whose antecedent
      is the speaker or the addressee, outside the text: a mention with no coref; a vocative name
      after you ("…you, Violet"): a named-entity with no role, linked to the you by a coref
    - >-
      a pronoun whose antecedent is not in the text (a text beginning "He laughed."): still a
      mention, but with no coref instance to state

slots:
  id:   {type: id, required: true, doc: "your label for the mention (m1, m2 …)"}
  word: {type: string, required: true, doc: "the pronoun or demonstrative as written, lowercase (he, her, it, that)"}

mints: {id: Entity, stem: word}          # sk_he_1, sk_it_1

presupposed: [word]                      # anaphoric: never introduced inside a scope

lexicon:                                 # the pronouns whose word states a gender (the program applies it; the parser records the word)
  masculine: [he, him, his, himself]
  feminine: [she, her, hers, herself]

emits:
  - atom: "(Member @id male)"            # the gender the pronoun's word states, carried to the antecedent by the coref rules
    when: "word in masculine"
    declare: {male: Class}
  - atom: "(Member @id female)"
    when: "word in feminine"
    declare: {female: Class}

notes:
  - >-
    The mention has no other atom of its own: the clause's roles say what it does, the coref link
    says who it is. A downstream reasoner carries the roles across the link at the link's strength
    (the seeded congruence rules), so nothing is lost and the identity stays revisable.
  - >-
    A gendered pronoun's gender is the word's, said of the mention and carried to the antecedent
    by coref_member: "Stanley … his daughter" makes Stanley male at the link's strength. It is the
    only gender a person gets from a pronoun; a gendered noun (son, sister, uncle) gives its own
    through the kinship rules, and a name gives none.

depends_on: []
composes_with: [coref]

examples:                    # a mention appears with its coref instance: see the coref template
  shown: []
  held_out: []
