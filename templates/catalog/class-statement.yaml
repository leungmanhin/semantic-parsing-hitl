# Template: class-statement  (a class is a class or has a property: "Ferrets are mustelids")
#
# A statement about a class as such, with no quantifier word: a bare plural (ferrets), a mass
# noun (granite) or a generic indefinite singular (a spindle is a tool). The atom is
# (Inheritance <class> <predicate>) with the confidence dial of the substrate: 0.99 for a
# definitional or taxonomic claim, 0.9 for an empirical generalization with an explicit quantifier
# word, 0.7 for a bare empirical one (which states no proportion); a quantifier word (all,
# most, few, no) sets the strength and is kept in a companion record. Tense, negation and
# modality are operators over the atom. A time relation, a date, a link or a particle on the
# statement as such names it as its event and the program mints the state of the statement
# holding — (Holds sk_cheap_1 (Inheritance spindle cheap)) — with the attachment on it; a
# recurring or conditional restriction is a conditional property instead.

id: class-statement
family: predication
shape: copular
title: A class is a class or has a property
status: draft

trigger:
  construction: >
    A clause with "be" as its main verb whose subject names a class rather than an individual —
    a bare plural (ferrets, herons), a mass noun (granite) or a generic indefinite singular
    (a spindle is a tool) — and whose predicate is an indefinite noun phrase or an adjective.
    The statement is definitional when it states what the class is by definition or taxonomy
    (ferrets are mustelids, a spindle is a tool) and empirical when it generalizes over the
    class's members (ferrets are curious). A quantifier word on the subject (all, every, most,
    many, few, no) belongs to the statement: record it as written; the program sets the
    strength from it and keeps the word beside the statement. A time relation, a date or a
    deictic time, a link or a focus particle on the statement as such (spindles were cheap
    until 1900) names this instance as its event, and the program mints the state of the
    statement holding.
  surface_forms:
    - "<class>s are <N>s"                       # ferrets are mustelids
    - "<class>s are <ADJ>"                      # ferrets are curious
    - "<mass noun> is a <N>"                   # granite is a rock
    - "a <class> is a <N>"                      # a spindle is a tool (generic indefinite)
    - "all / most / few / no <class>s are <N or ADJ>"   # the quantifier word is recorded
  boundary:                   # looks like a class statement but is not one
    - >-
      an individual as the subject — Teodor is a locksmith, the ladder is crooked: a
      predication about one individual
    - >-
      a definite plural — the ferrets are curious: a specific group of individuals, not the class
    - >-
      a property of the class as a whole that no member holds — ferrets are widespread, the
      dodo is extinct, herons are common: a class-level property, not a generalization
    - >-
      a property under a condition — clay is soft when wet, ferrets are tame in Calderwick,
      herons are patient in winter: a conditional property, a rule over the members; a
      class-level property restricted to a place or a time — otters are rare in Norfolk: a
      class-level property; a time relation or a date bounding the statement itself — spindles
      were cheap until 1900: this template, the relation naming the instance as its event
    - >-
      a copular verb other than be — herons seem patient: the evidential template over this
      template's instance; ferrets became popular: a change of state

slots:
  id:           {type: id, required: true, doc: "your label for the statement"}
  subject:      {type: lemma, class: Class, required: true, doc: "the class, lemmatized to the singular (ferret, granite, spindle)"}
  predicate:    {type: lemma, class: Class, required: true, doc: "the class (mustelid) or the property (curious), lemmatized"}
  form:         {type: enum, values: [noun, adjective], required: true,
                 doc: "noun for a class predicate, adjective for a property"}
  definitional: {type: bool, required: true,
                 doc: "true for a definitional or taxonomic claim (ferrets are mustelids), false for an empirical generalization (ferrets are curious)"}
  quantifier:   {type: string, required: false,
                 doc: "the quantifier word on the subject as written (all, every, most, many, few, no, none); absent for a bare class statement"}
  tense:        {type: enum, values: [past, present, future], required: true,
                 doc: "the clause's tense; present is recorded, not inferred"}
  aspect:       {type: enum, values: [simple, progressive, perfect], required: false, default: simple}

truth:
  strength:                    # the quantifier word first; a bare statement by its class
    - {slot: quantifier, values: {all: 1.0, every: 1.0, each: 1.0, most: 0.9, many: 0.7, few: 0.1, "no": 0.0, none: 0.0}}
    - {slot: definitional, values: {"true": 1.0, "false": 0.9}}
    - 0.9
  confidence:                  # definitional 0.99; an explicit quantifier word 0.9; a bare empirical statement 0.7
    - {slot: definitional, values: {"true": 0.99}}
    - {slot: quantifier, values: {all: 0.9, every: 0.9, each: 0.9, most: 0.9, many: 0.9, few: 0.9, "no": 0.9, none: 0.9}}
    - 0.7

mints: {id: Event, stem: predicate, on_demand: true}      # the state of the statement holding, only when something attaches to it

emits:
  - atom: "(Inheritance {subject} {predicate})"
    when: "tense == present and aspect != perfect and aspect != progressive"
  - atom: "(Past (Inheritance {subject} {predicate}))"
    when: "tense == past or aspect == perfect"
  - atom: "(Future (Inheritance {subject} {predicate}))"
    when: "tense == future"
  - atom: "(Ongoing (Inheritance {subject} {predicate}))"
    when: "aspect == progressive"
  # an anchored statement: the state of the statement holding, minted only when something
  # attaches to this instance (a time relation, a date, a link, a focus); its tense beside it
  - atom: "(Holds @id (Inheritance {subject} {predicate}))"
    if_minted: true
    state: true
  - atom: "(Past @id)"
    if_minted: true
    when: "tense == past or aspect == perfect"
  - atom: "(Future @id)"
    if_minted: true
    when: "tense == future"

notes:
  - >-
    The parser records two things and the program sets the truth value: definitional claims
    hold by definition (confidence 0.99), empirical ones admit exceptions (0.9 with an explicit
    quantifier word, 0.7 for a bare statement, which states no proportion); a bare
    empirical statement has strength 0.9, and a quantifier word sets it (all 1.0, most 0.9,
    many 0.7, few 0.1, no 0.0). "No" as a quantifier is a strength-0 generalization, not a
    negation operator. The word itself stays in the instance record as the provenance of the
    strength; it is not an atom.
  - >-
    Class-level properties that no member holds (extinct, widespread, common) are not
    generalizations over members and would be wrong as Inheritance; they have their own
    template (class-property). A property under a condition is a rule over the members
    (conditional-property), since the flat atom could not carry the condition.
  - >-
    A statement bounded in time as such — spindles were cheap until 1900 — keeps its flat atom
    and gains, from the program, the state of the statement holding, with the clause's tense on
    the state and the relation on it; the parser only names this instance in the relation's
    event slot. A restriction that recurs or conditions the members (herons are patient in
    winter) is not a bound on the statement but a conditional property.

depends_on: []
composes_with: [negation, modal, norm, time-relation, time, link, focus]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: definitional
      text: "Ferrets are mustelids."
      instances:
        - {t: class-statement, id: k1, subject: ferret, predicate: mustelid, form: noun,
           definitional: true, tense: present, span: "Ferrets are mustelids"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Inheritance ferret mustelid)"
      declarations:
        - "(: ferret Class)"
        - "(: mustelid Class)"
    - category: positive
      note: empirical and bare — the program lowers the confidence to 0.7
      text: "Ferrets are curious."
      instances:
        - {t: class-statement, id: k1, subject: ferret, predicate: curious, form: adjective,
           definitional: false, tense: present, span: "Ferrets are curious"}
    - category: abstain
      text: "Teodor is a locksmith."
      expected: {abstain: true, template: copular}                     # an individual as the subject
    - category: positive
      note: a quantifier word — strength 1.0 at empirical confidence, the word kept
      text: "All ferrets are curious."
      instances:
        - {t: class-statement, id: k1, subject: ferret, predicate: curious, form: adjective,
           definitional: false, quantifier: all, tense: present, span: "All ferrets are curious"}

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: definitional
      text: "Herons are birds."
      instances:
        - {t: class-statement, id: k1, subject: heron, predicate: bird, form: noun,
           definitional: true, tense: present}
    - category: contrast
      note: the confidence dial — an empirical generalization about the same class
      text: "Herons are patient."
      instances:
        - {t: class-statement, id: k1, subject: heron, predicate: patient, form: adjective,
           definitional: false, tense: present}
    - category: positive
      note: a mass noun
      text: "Granite is a rock."
      instances:
        - {t: class-statement, id: k1, subject: granite, predicate: rock, form: noun,
           definitional: true, tense: present}
    - category: positive
      note: a generic indefinite singular
      text: "A spindle is a tool."
      instances:
        - {t: class-statement, id: k1, subject: spindle, predicate: tool, form: noun,
           definitional: true, tense: present}
    - category: positive
      note: past tense
      text: "Dinosaurs were reptiles."
      instances:
        - {t: class-statement, id: k1, subject: dinosaur, predicate: reptile, form: noun,
           definitional: true, tense: past}
    - category: scoped
      note: under clausal negation
      text: "Ferrets are not rodents."
      instances:
        - {t: class-statement, id: k1, subject: ferret, predicate: rodent, form: noun,
           definitional: true, tense: present}
        - {t: negation, id: s1, over: ["@k1"]}
    - category: scoped
      note: under a modal, empirical
      text: "Herons might be migratory."
      instances:
        - {t: class-statement, id: k1, subject: heron, predicate: migratory, form: adjective,
           definitional: false, tense: present}
        - {t: modal, id: s1, over: ["@k1"], head: Might, surface: might}
    - category: positive
      note: a graded quantifier
      text: "Most herons are patient."
      instances:
        - {t: class-statement, id: k1, subject: heron, predicate: patient, form: adjective,
           definitional: false, quantifier: most, tense: present}
    - category: positive
      note: the negative universal — strength 0, definitional confidence, the word kept
      text: "No ferret is a rodent."
      instances:
        - {t: class-statement, id: k1, subject: ferret, predicate: rodent, form: noun,
           definitional: true, quantifier: "no", tense: present}
    - category: abstain
      text: "The ferrets are curious."
      expected: {abstain: true, template: group}                       # a definite plural
    - category: abstain
      text: "Yusra is a weaver."
      expected: {abstain: true, template: copular}                     # an individual as the subject
    - category: abstain
      text: "Ferrets are widespread."
      expected: {abstain: true, template: class-property}                # a class-level property
    - category: abstain
      text: "Wax is soft when warm."
      expected: {abstain: true, template: conditional-property}         # a property under a condition
