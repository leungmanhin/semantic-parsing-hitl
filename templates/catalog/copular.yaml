# Template: copular  (an individual is a class or has a property: "X is a N", "X is ADJ")
#
# The predication is the flat atom (Member <subject> <predicate>); tense, negation and modality
# are operators over it ((Past (Member …)), (Not (Member …)), (Might (Member …))). No state
# eventuality is minted for a plain copular clause; when a time, a place, a duration, a relation,
# a link or a focus names the predication, the state of the fact holding is minted on demand —
# (Holds sk_crooked_1 (Member sk_ladder_1 crooked)) — and the attachment hangs on it. The subject
# is a referent instance (a name,
# a witness, a resolved pronoun); the predicate is a class or a property lemma. A bare-plural or
# mass-noun subject makes a class statement, not this template.

id: copular
family: predication
shape: copular
title: An individual is a class or has a property
status: draft

trigger:
  construction: >
    A clause with "be" as its main verb whose subject is a referent instance — a name, a
    witness, a group (the ferrets), a resolved pronoun, or a range inside a rule (the
    arbitrary member of a conditional property or a generic's condition) — and whose predicate
    is an indefinite noun phrase (is a locksmith) or an adjective (is crooked). A group as the subject takes the
    predicate as a group; whether it also holds of each member is the distribution template's
    business. The
    predicate's head is the class or the property; an adjective inside a predicate noun phrase
    (is a careful weaver) is a second copular instance with the adjective as its predicate,
    and a noun, a name or a year before the predicate noun (is a harbour pilot) is its `mods`;
    former, ex- or retired before it (is a former weaver) sets `former`: the subject was one and
    is not now.
    Tense is the clause's; present is recorded and emits nothing. A time, a place, a duration,
    a time relation, a link or a focus particle on the clause names this instance as its event,
    as it would a verb's: the program mints the state of the fact holding and attaches to it.
  surface_forms:
    - "<subject> is a <N>"                     # Teodor is a locksmith
    - "<subject> is <ADJ>"                     # the ladder is crooked
    - "<subject> was / will be <N or ADJ>"     # the tense wraps the atom
  boundary:                   # looks like a copular clause but is not one
    - >-
      a class as the subject — ferrets are mustelids, granite is a rock, a spindle is a tool:
      a statement about a class, not an individual (a range instance, "@q1", is not a class: it
      is the member a rule ranges over, and takes this template)
    - >-
      a quantifier word on the subject — all ferrets are curious, most herons are patient:
      a quantified generalization
    - >-
      a copular verb other than be — seems tired, looks tired, tastes salty: the evidential
      template, over this template's instance; feels tired with an animate subject: a
      sensation; remains open: an aspectual verb; became a locksmith, got tired: a change of
      state
    - >-
      a relational adjective or noun with its complement — married to Lamine, similar to
      Teodor, a cousin of Yusra, Lamine's cousin, friends with Ottoline: a stative relation
      between the two; a quality adjective with a complement — afraid of the ferret, fond of
      Lamine, full of water, good at chess: the adjective-complement template, a state of the
      subject with its complement
    - >-
      a definite or a name as the predicate — is the locksmith, is Teodor: an identity
      statement, not a class or a property (a possessed relational noun — is Lamine's cousin —
      is a stative relation)
    - >-
      an alleged or so-called predicate — an alleged thief: the adjective does not hold of the
      individual on its own and has no slot yet; report it as unmapped (former, ex- and retired
      are `former`)
    - >-
      "there is / there are" — there is a thermos: an existential, which is the referent alone
    - >-
      an adjective with a degree word — is very crooked, was almost full, is tall for a weaver:
      a degree predication, which decides itself whether the property is asserted
    - >-
      about to be, due to be — is about to be a father, is due to be in Calderwick: a prospective
      state, no form yet; report the predicate as unmapped (on a verb the clause's own template
      takes the aspect about_to / due_to)
    - >-
      a definite role title with an of-phrase — Ottoline is the warden of the mill, he is the
      president of the guild: a relational noun, the stative-relation template, not an identity

slots:
  id:        {type: id, required: true, doc: "your label for the predication"}
  subject:   {type: filler, class: Entity, required: true,
              doc: "the subject: a referent id (a name, a witness, a group, a resolved pronoun)"}
  predicate: {type: lemma, class: Class, required: true, narrowed_by: mods,
              doc: "the class (locksmith) or the property (crooked), lemmatized"}
  former:    {type: bool, required: false, doc: "with form noun, true when former, ex-, one-time or retired makes the noun something the referent was and no longer is (is a former weaver)"}
  mods:      {type: list, class: Class, ids: [named-entity, time], required: false,
              doc: "with form noun, the nouns, names and years before the head noun that narrow its class (Nouns before nouns): a lemma for a noun (a harbour pilot: harbour; a sea salt grinder: sea_salt), the id of a named-entity instance for a name (a Calderwick quilt), of a time instance for a year, a decade or a century (a 1904 almanac); never an adjective"}
  form:      {type: enum, values: [noun, adjective], required: true,
              doc: "noun for a class (is a locksmith), adjective for a property (is crooked)"}
  tense:     {type: enum, values: [past, present, future], required: true,
              doc: "the clause's tense; present is recorded, not inferred"}
  aspect:    {type: enum, values: [simple, progressive, perfect], required: false, default: simple}

mints: {id: Event, stem: predicate, on_demand: true}      # the state of the fact holding, only when something attaches to the predication

emits:
  - atom: "(Member {subject} {predicate|mod})"
    with_head: predicate
    when: "not former and tense == present and aspect != perfect and aspect != progressive"
  - atom: "(Past (Member {subject} {predicate|mod}))"
    with_head: predicate
    when: "not former and tense == past or not former and aspect == perfect"
  - atom: "(Future (Member {subject} {predicate|mod}))"
    with_head: predicate
    when: "not former and tense == future"
  # an anchored predication: the state of the fact holding, minted only when something attaches
  # to this instance (a time, a place, a duration, a relation, a link, a focus); its tense beside it
  - atom: "(Holds @id (Member {subject} {predicate|mod}))"
    with_head: predicate
    if_minted: true
    state: true
  - atom: "(Past @id)"
    if_minted: true
    when: "tense == past or aspect == perfect"
  - atom: "(Future @id)"
    if_minted: true
    when: "tense == future"
  - atom: "(Ongoing (Member {subject} {predicate|mod}))"
    with_head: predicate
    when: "not former and aspect == progressive"
  # former: the subject was one (the head beside) and is not one now (the noun's own class only)
  - atom: "(Past (Member {subject} {predicate|mod}))"
    with_head: predicate
    when: "former"
  - atom: "(Not (Member {subject} {predicate|mod}))"
    when: "former"

notes:
  - >-
    The flat atom is the representation; tense and the scope operators wrap it. A state
    eventuality for a copular clause is minted only when something must attach to it (a time,
    a duration, a place), which is a matter for the attachment templates.
  - >-
    A class and a property take the same atom, as the substrate treats properties as classes;
    the form slot records which the text used, for later normalization.
  - >-
    An anchored copular clause — "Yusra was tired yesterday", "the ladder was crooked until
    Monday", "Lamine was happy in Calderwick", "only the ladder is crooked" — keeps its flat
    atom as the assertion and gains, from the emitter, the state of that fact holding: (Holds
    sk_tired_1 (Member sk_yusra_1 tired)) with the clause's tense on the state, (Past sk_tired_1),
    and the time, place, duration, relation, link or focus on the state. The parser only names
    this instance in the attachment's event slot; a plain clause mints no state.

depends_on: [named-entity, witness]
composes_with: [negation, modal, norm, time]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: a class
      text: "Teodor is a locksmith."
      instances:
        - {t: named-entity, id: n1, name: "Teodor", span: "Teodor"}
        - {t: copular, id: c1, subject: "@n1", predicate: locksmith, form: noun, tense: present, span: "Teodor is a locksmith"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_teodor_1 \"Teodor\")"
        - "(Member sk_teodor_1 locksmith)"
      declarations:
        - "(: locksmith Class)"
        - "(: sk_teodor_1 Entity)"
    - category: positive
      note: a property, past tense — the tense wraps the atom
      text: "The audit was difficult."
      instances:
        - {t: witness, id: x1, class: audit, definite: true, span: "The audit"}
        - {t: copular, id: c1, subject: "@x1", predicate: difficult, form: adjective, tense: past, span: "The audit was difficult"}
    - category: abstain
      text: "Ferrets are mustelids."
      expected: {abstain: true, template: class-statement}             # a class as the subject
    - category: abstain
      text: "Teodor became a locksmith."
      expected: {abstain: true, template: change-of-state}            # a change of state
    - category: abstain
      text: "The thermos was almost full."
      expected: {abstain: true, template: degree}                     # an adjective with a degree word

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: the property itself — no feeling, no appearance
      text: "Yusra is tired."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: copular, id: c1, subject: "@n1", predicate: tired, form: adjective, tense: present}
    - category: positive
      text: "Yusra is a weaver."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: copular, id: c1, subject: "@n1", predicate: weaver, form: noun, tense: present}
    - category: positive
      note: a legal status predicated of a thing — a property, since no action is in the text
      text: "This spindle is illegal."
      instances:
        - {t: witness, id: x1, class: spindle, definite: true}
        - {t: copular, id: c1, subject: "@x1", predicate: illegal, form: adjective, tense: present}
    - category: contrast
      note: tense marker — the instance must differ in tense only
      text: "Yusra was a weaver."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: copular, id: c1, subject: "@n1", predicate: weaver, form: noun, tense: past}
    - category: positive
      note: a property of a witness
      text: "The ladder is crooked."
      instances:
        - {t: witness, id: x1, class: ladder, definite: true}
        - {t: copular, id: c1, subject: "@x1", predicate: crooked, form: adjective, tense: present}
    - category: positive
      note: future
      text: "Lamine will be a glazier."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: copular, id: c1, subject: "@n1", predicate: glazier, form: noun, tense: future}
    - category: positive
      note: an adjective inside the predicate noun phrase is a second instance
      text: "Ottoline is a careful weaver."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: copular, id: c1, subject: "@n1", predicate: weaver, form: noun, tense: present}
        - {t: copular, id: c2, subject: "@n1", predicate: careful, form: adjective, tense: present}
    - category: scoped
      note: under clausal negation
      text: "Teodor is not a locksmith."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: copular, id: c1, subject: "@n1", predicate: locksmith, form: noun, tense: present}
        - {t: negation, id: s1, over: ["@c1"]}
    - category: scoped
      note: under a modal
      text: "The ladder might be crooked."
      instances:
        - {t: witness, id: x1, class: ladder, definite: true}
        - {t: copular, id: c1, subject: "@x1", predicate: crooked, form: adjective, tense: present}
        - {t: modal, id: s1, over: ["@c1"], head: Might, surface: might}
    - category: scoped
      note: negation over a past predication — the negation wraps the tensed atom
      text: "The audit was not difficult."
      instances:
        - {t: witness, id: x1, class: audit, definite: true}
        - {t: copular, id: c1, subject: "@x1", predicate: difficult, form: adjective, tense: past}
        - {t: negation, id: s1, over: ["@c1"]}
    - category: optional
      note: perfect aspect
      text: "Yusra has been a weaver."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: copular, id: c1, subject: "@n1", predicate: weaver, form: noun, tense: present,
           aspect: perfect}
    - category: abstain
      text: "Herons are birds."
      expected: {abstain: true, template: class-statement}             # a class as the subject
    - category: scoped
      note: under an evidential verb — the copular is the sealed claim, not asserted
      text: "Teodor seems tired."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: copular, id: c1, subject: "@n1", predicate: tired, form: adjective, tense: present}
        - {t: evidential, id: s1, over: ["@c1"], head: Seem}
    - category: abstain
      text: "Lamine is fond of Yusra."
      expected: {abstain: true, template: adjective-complement}         # an adjective with a complement
    - category: abstain
      text: "Teodor is the locksmith."
      expected: {abstain: true, gap: G00, span: "is the locksmith"}   # an identity statement
    - category: abstain
      text: "Teodor is extremely tired."
      expected: {abstain: true, template: degree}                     # an adjective with a degree word
    - category: positive
      note: a noun before the predicate noun — its mods; the program keeps the head beside
      text: "Bram is a river guide."
      instances:
        - {t: named-entity, id: n1, name: "Bram"}
        - {t: copular, id: c1, subject: "@n1", predicate: guide, form: noun, tense: present, mods: [river]}
    - category: positive
      note: former — the subject was one and is not one now
      text: "Teodor is a former locksmith."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: copular, id: c1, subject: "@n1", predicate: locksmith, form: noun, tense: present, former: true}
