# Template: psych  (an emotional or evaluative state of an experiencer towards a stimulus)
#
# Two syntactic classes share one meaning shape. Fear-type verbs put the experiencer in subject
# position (Yusra fears the ferret); frighten-type verbs put it in object position (The ferret
# frightens Yusra). The slots are named by ROLE, not by position, so both classes fill the same
# instance; the surface forms below say which is which. The stimulus is a thing or a named
# individual; a clause as the object of a psych verb is an attitude, not this template.

id: psych
family: predication
shape: verb-class
title: An emotional or evaluative state towards a stimulus
status: draft

trigger:
  construction: >
    A verbal clause whose verb denotes an emotional or evaluative state that an experiencer
    holds towards a stimulus: liking, disliking, fear, trust, admiration, envy, enjoyment,
    dread. With a fear-type verb the subject is the experiencer and the object the stimulus
    (fears the ferret); with a frighten-type verb the subject is the stimulus and the object
    the experiencer (the ferret frightens Yusra). The stimulus is a noun phrase — a thing, a
    named individual or an event named by a noun (dreaded the audit) — or an action the
    experiencer likes, enjoys, hates, prefers or fears doing (likes to send quilts, enjoys
    sending quilts): then the stimulus is a clause, parsed with the experiencer as its actor
    and tense present, and sealed. A WISH for a thing with would — would like a cup, would love
    a ride — is want in the present tense with the words in `word`; a thing wanted that is not
    a particular one is a bare lemma (wants a ladder: ladder), never a witness.
  verbs: [like, dislike, love, hate, adore, despise, fear, dread, trust, distrust, admire, want,
          respect, envy, resent, miss, enjoy, prefer, pity,
          frighten, scare, worry, annoy, bother, please, delight, amuse, surprise, upset,
          disappoint, impress]
  verbs_note: >
    The first line is the fear-type class (experiencer as subject), the second the frighten-type
    class (experiencer as object). An unlisted verb that denotes such a state belongs here, with
    the roles assigned by meaning: who feels, and what the feeling is about.
  surface_forms:
    - "<experiencer> V <stimulus>"              # fear-type: Yusra fears the ferret
    - "<stimulus> V <experiencer>"              # frighten-type: the ferret frightens Yusra
    - "<experiencer> was V-ed by <stimulus>"    # frighten-type passive: the roles do not change
    - "<experiencer> was V-ed"                  # frighten-type passive, stimulus unstated
    - "<experiencer> would like / love <thing>"  # a wish: want, present, the words in `word`
  boundary:                   # looks like a psych state but is not one
    - >-
      feel with a property — feels tired, felt guilty: a felt state of the subject, the
      sensation template; no stimulus
    - >-
      a relation that is not a feeling — needs a ladder, resembles Lamine, depends on the pump,
      deserves a prize: a stative relation
    - >-
      a clause as the object — fears that P, hopes that P, likes that P: an attitude towards a
      proposition; nothing is felt about a thing
    - >-
      an adjectival state with a complement — is afraid of the ferret, is fond of Lamine, is
      worried about the audit: the adjective-complement template; a bare one — is angry: a
      copular property; neither is a verb of this class
    - >-
      perception — saw the ferret, heard the news: perceiving something, not feeling something
      about it
    - >-
      a degree adverb on the verb (deeply distrusts, really likes): the state is parsed and the
      adverb is an extent attachment on it — a manner adverb is a manner attachment

slots:
  id:          {type: id, required: true, doc: "your label for the state"}
  verb:        {type: lemma, class: Class, required: true, doc: "the verb lemma"}
  experiencer: {type: filler, class: Entity, role: Experiencer, required: true,
                doc: "who holds the state: the subject of a fear-type verb, the object of a frighten-type verb"}
  stimulus:    {type: filler, class: Entity, role: Stimulus, required: false,
                doc: "what the state is about, as a thing (a bare lemma for a thing wanted that is not a particular one): the object of a fear-type verb, the subject (or by-phrase) of a frighten-type verb; absent in an agentless passive, and when the stimulus is a clause"}
  complement:  {type: refs, class: Proposition, required: false,
                doc: "what the state is about, as an action: the ids of the instances that state it (its predication, with the experiencer as its actor); never together with stimulus; the referents it mentions are not listed"}
  tense:       {type: enum, values: [past, present, future], required: true,
                doc: "the clause's tense; present is recorded, not inferred"}
  word:    {type: string, required: false,
            doc: "the words as written when the verb is a wish with would: would like, would love (want); would rather, would prefer (prefer); absent otherwise"}
  aspect:      {type: enum, values: [simple, progressive, perfect, perfect_progressive, about_to, due_to, would, going_to], required: false, default: simple,
               doc: "simple; progressive for be V-ing; perfect for have V-ed; perfect_progressive for have been V-ing; about_to for be about to V / on the point of V-ing and due_to for be due to V / be to V / be set to V — the PROSPECTIVE aspect, the event upcoming at the clause's time, the word kept as the value (be going to V is the future tense, not a prospective); would for a future seen from a past moment (said the barn would flood, hoped the bridge would hold) and going_to for was / were going to V — the same PROSPECTIVE, with tense past; a would that tells what then happened (would later marry) is the plain past, and a would with no if-clause and no past moment is the modal's Would"}

mints: {id: Event}

emits:
  - atom: "(Member @id {verb})"
  - atom: "(Experiencer @id {experiencer})"
  - atom: "(Stimulus @id {stimulus})"
    if_filled: stimulus
  - atom: "(Stimulus @id {complement})"    # an action as the stimulus, sealed as one term
    if_filled: complement
  - atom: "(Past @id)"
    when: "tense == past or aspect == perfect or aspect == perfect_progressive"
  - atom: "(Future @id)"
    when: "tense == future"
  - atom: "(Ongoing @id)"
    when: "aspect == progressive or aspect == perfect_progressive"
  - atom: "(Prospective @id)"
    when: "aspect == about_to or aspect == due_to or aspect == would or aspect == going_to"

notes:
  - >-
    One shape for both syntactic classes: the verb lemma records which class the text used, and
    the roles record who feels what. The class contrast pair in the held-out suite (fears /
    frightens) is the sensitivity test for the role mapping.
  - >-
    A degree adverb ("deeply", "really") is an extent attachment on the state and a manner
    adverb a manner attachment: the state is parsed either way, the adverb beside it.

depends_on: [named-entity, witness]
composes_with: [negation, modal, time, extent]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: fear-type, experiencer as subject
      text: "Yusra distrusts Lamine."
      instances:
        - {t: named-entity, id: n1, name: "Yusra", span: "Yusra"}
        - {t: named-entity, id: n2, name: "Lamine", span: "Lamine"}
        - {t: psych, id: p1, verb: distrust, experiencer: "@n1", stimulus: "@n2", tense: present, span: "Yusra distrusts Lamine"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_yusra_1 \"Yusra\")"
        - "(Name sk_lamine_1 \"Lamine\")"
        - "(Member sk_distrust_1 distrust)"
        - "(Experiencer sk_distrust_1 sk_yusra_1)"
        - "(Stimulus sk_distrust_1 sk_lamine_1)"
      declarations:
        - "(: distrust Class)"
        - "(: sk_distrust_1 Event)"
        - "(: sk_lamine_1 Entity)"
        - "(: sk_yusra_1 Entity)"
    - category: positive
      note: frighten-type, experiencer as object — the same roles
      text: "The ferret frightens Teodor."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true, span: "The ferret"}
        - {t: named-entity, id: n1, name: "Teodor", span: "Teodor"}
        - {t: psych, id: p1, verb: frighten, experiencer: "@n1", stimulus: "@x1", tense: present, span: "The ferret frightens Teodor"}
    - category: abstain
      text: "Teodor saw the ferret."
      expected: {abstain: true, template: perception}                 # perception, not a feeling
    - category: positive
      note: an action as the stimulus — the clause is sealed, the experiencer acts in it
      text: "Yusra likes to send quilts."
      instances:
        - {t: named-entity, id: n1, name: "Yusra", span: "Yusra"}
        - {t: transfer, id: e1, verb: send, giver: "@n1", object: quilt, tense: present, span: "to send quilts"}
        - {t: psych, id: p1, verb: like, experiencer: "@n1", complement: ["@e1"], tense: present, span: "Yusra likes to send quilts"}

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      text: "Lamine admires Ottoline."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Ottoline"}
        - {t: psych, id: p1, verb: admire, experiencer: "@n1", stimulus: "@n2", tense: present}
    - category: contrast
      note: role reversal — the instance must differ in experiencer and stimulus only
      text: "Ottoline admires Lamine."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: psych, id: p1, verb: admire, experiencer: "@n1", stimulus: "@n2", tense: present}
    - category: positive
      text: "Yusra fears the ferret."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: psych, id: p1, verb: fear, experiencer: "@n1", stimulus: "@x1", tense: present}
    - category: contrast
      note: class flip — subject and object swap positions, the roles do not; only the verb differs
      text: "The ferret frightens Yusra."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: psych, id: p1, verb: frighten, experiencer: "@n1", stimulus: "@x1", tense: present}
    - category: positive
      note: an event named by a noun as the stimulus; past tense
      text: "Teodor dreaded the audit."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: audit, definite: true}
        - {t: psych, id: p1, verb: dread, experiencer: "@n1", stimulus: "@x1", tense: past}
    - category: scoped
      note: under clausal negation
      text: "Yusra does not trust Lamine."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: psych, id: p1, verb: trust, experiencer: "@n1", stimulus: "@n2", tense: present}
        - {t: negation, id: s1, over: ["@p1"]}
    - category: scoped
      note: under a modal
      text: "Ottoline might like the quilt."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: witness, id: x1, class: quilt, definite: true}
        - {t: psych, id: p1, verb: like, experiencer: "@n1", stimulus: "@x1", tense: present}
        - {t: modal, id: s1, over: ["@p1"], head: Might, surface: might}
    - category: optional
      note: frighten-type agentless passive — no stimulus
      text: "Teodor was frightened."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: psych, id: p1, verb: frighten, experiencer: "@n1", tense: past}
    - category: positive
      note: a degree adverb — the state is parsed, the adverb attaches to it as an extent
      text: "Yusra deeply distrusts Lamine."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: psych, id: p1, verb: distrust, experiencer: "@n1", stimulus: "@n2", tense: present}
        - {t: extent, id: a1, event: "@p1", level: deeply}
    - category: abstain
      text: "Yusra fears that Lamine sold the spindle."
      expected: {abstain: true, template: attitude}                   # a clause as the object
    - category: abstain
      text: "Teodor heard the news."
      expected: {abstain: true, template: perception}
    - category: abstain
      text: "Ottoline is afraid of the ferret."
      expected: {abstain: true, template: adjective-complement}         # an adjectival state with a complement
    - category: positive
      note: a gerund as the stimulus
      text: "Lamine enjoys sending quilts."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: transfer, id: e1, verb: send, giver: "@n1", object: quilt, tense: present}
        - {t: psych, id: p1, verb: enjoy, experiencer: "@n1", complement: ["@e1"], tense: present}
    - category: positive
      note: a pronoun whose antecedent is a bare class filler — the same lemma again, no mention, no coref
      text: "Lamine likes quilts and sells them."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: psych, id: p1, verb: like, experiencer: "@n1", stimulus: quilt, tense: present}
        - {t: transfer, id: e1, verb: sell, giver: "@n1", object: quilt, tense: present}
        - {t: habitual, id: h1, event: "@e1"}
    - category: positive
      note: would like with a thing — want in the present, a thing that is not a particular one as a bare lemma, the words recorded
      text: "Ottoline would like a lantern."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: psych, id: p1, verb: want, experiencer: "@n1", stimulus: lantern, tense: present, word: "would like"}
