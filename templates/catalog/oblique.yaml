        - {t: witness, id: x1, class: rule, definite: true}
        - {t: activity, id: v1, verb: comply, actor: "@n1", tense: past}
        - {t: oblique, id: a1, event: "@v1", head: With, object: "@x1"}
    - category: positive
      note: a prepositional passive with no by-phrase — no actor; the oblique carries the verb's object
      text: "The leak was dealt with."
      instances:
        - {t: witness, id: x1, class: leak, definite: true}
        - {t: activity, id: v1, verb: deal, tense: past}
        - {t: oblique, id: a1, event: "@v1", head: With, object: "@x1"}
    - category: positive
      note: past as a path on a motion — the head Past, emitted PastPlace
