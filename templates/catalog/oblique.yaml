# Template: oblique  (a prepositional phrase on a clause, by its own preposition: "talked about the audit", "waited for Teodor", "worked as a weaver", "left without the quilt")
#
# A prepositional phrase on a clause that says what the action is about, directed at, done
# against, done without, done as, done like, or in what respect attaches to the clause's event
# under a head named after the preposition itself, capitalized: (About sk_talk_1 sk_audit_1),
# (For sk_wait_1 sk_teodor_1), (As sk_work_1 weaver). The preposition is never normalized and
# never promoted into a relation of its own: the word actually used is the head. This includes
# the object of a prepositional verb (wait for, look at, depend on, refer to, deal with), which is
# never a direct-object role. Where, when, whence, whither, by what means, with whom, for whose
# benefit and how have their own templates (location, time, motion, adjunct, manner); this
# template takes the rest. A multi-word preposition keeps its words as the head, CamelCased —
# (BecauseOf sk_laugh_1 sk_rain_1), (DueTo sk_delay_1 sk_rain_1), (InSpiteOf sk_sing_1 sk_rain_1)
# —, and the background rules read each causal one (because of, due to, owing to, thanks to, on
# account of) as Because. A GERUND CLAUSE as the object (left without waving, accused of hiding the
# quilt) is sealed as one term under the preposition, as an adjective's or a psych verb's gerund
# complement is: (Without sk_leave_1 (And (Member sk_wave_1 wave) (Agent sk_wave_1 sk_lamine_1))).
# Whether the action happened is not stated by the parse — by V-ing says it did, without V-ing that
# it did not, accused of V-ing neither —: the preposition is kept, and the reading is a background
# matter per preposition.

id: oblique
family: attachment
shape: attachment
title: A prepositional phrase on a clause, by its own preposition
status: draft

trigger:
  construction: >
    A prepositional phrase on a clause whose preposition is neither a place, a time, a
    destination or origin, a means, a companion, a beneficiary nor a manner: what the action is
    about or directed at (talked about the inspection, waited for Pieter, voted against the plan,
    argued over the blanket, complained about the barrow, dealt with the inspection), in what capacity
    or likeness (worked as a weaver, sang like a bird), without what (left without the blanket),
    despite what (sang despite the hail), through or along what path (walked through the granary,
    ran across the field), among, amid or between what (sat among the badgers, paced amid the rubble; chose between the
    barrow and the blanket, mediated between Femke and Ludo: head Between, the second in
    `object2`; between two places is a location), and a cause or a
    concession stated by a MULTI-WORD preposition (laughed because of the hail, waited owing to
    the hail, slept on account of the flood, sang thanks to Odile, danced in spite of the hail:
    the phrase CamelCased is the head — BecauseOf, DueTo, OwingTo, ThanksTo, OnAccountOf,
    InSpiteOf). The event is parsed with its own template; the oblique names the event, the
    preposition as written (capitalized) and the object. A phrase predicated of an EVENT NOUN by
    be (the closure was due to the hail) attaches to that eventive witness, with the clause's
    tense in `tense`. One instance per phrase. Decide by the question the phrase answers: where,
    when, whence, whither, by what means, with whom, for whose benefit and how go to the
    templates that own them; everything else comes here. A GERUND CLAUSE as the object — left
    without locking the hatch, mended the barrow by replacing the wheel, was accused of
    stealing the trowel, decided against selling the granary, complained about waiting — is
    parsed with its own template, its actor the one the phrase is about (the clause's subject;
    the object of a verb of accusing, charging, blaming or thanking: accused Pieter of stealing
    → Pieter; none when the text names no one), tense present, and listed in `complement`,
    sealed as one term under the preposition, with no `object`: the parse does not say whether
    the action happened (by replacing the wheel: it did; without locking the hatch: it did not;
    accused of stealing: neither) — the preposition and the verb are the record. A BARE-LEMMA
    OBJECT keeps the words that narrow it: its adjectives in `object_props`, the nouns before it
    in `object_mods` (argued about wet weather: weather, object_props [wet]; dealt with harbour
    pilots: pilot, object_mods [harbour]). A PREPOSITIONAL PASSIVE — the hatch was looked into,
    the rules were complied with by Pieter — is the active's phrase: the verb's own template
    with no stated actor or the by-phrase as its actor, and this instance with the subject as
    the object, the stranded preposition the head.
  surface_forms:
    - "<clause> about / against / over / on <object>"   # talked about the inspection; voted against the plan
    - "<clause> for / at / to / with <object>"          # waited for Pieter; dealt with the inspection: a prepositional verb's object
    - "<clause> as / like <object>"                     # worked as a weaver; sang like a bird
    - "<clause> without / despite <object>"             # left without the blanket; sang despite the hail
    - "<clause> through / across / along <object>"      # walked through the granary: a path
    - "<clause> because of / due to / owing to / thanks to / on account of <object>"   # a cause stated by a preposition: BecauseOf, DueTo … the head; the rules read it as Because
    - "<clause> in spite of <object>"                   # a concession: InSpiteOf, beside Despite
    - "<clause> amid <object>"                          # stumbled amid the rubble: Amid, as written, beside Among
    - "<clause> before <person or body>"                # spoke before the council: Before, in whose presence; before a time or an event is a time relation
    - "<event noun> was due to <object>"                # predicated of an event noun by be: on the eventive witness, the clause's tense recorded
    - "<clause> without / by / of / against / about <V>-ing …"   # left without locking the hatch: the gerund's clause sealed in `complement`, no object
    - "<clause> <preposition> <adjective> <noun>"       # argued about wet weather: the bare lemma, object_props [wet]
    - "<subject> was V-ed <preposition> (by <actor>)"   # the rules were complied with: a prepositional passive, the subject the object
  boundary:                   # looks like an oblique but is not one
    - >-
      where the event takes place — in the granary, at the bazaar, on the roof, near the hut: a
      location; where a thing is — the key is under the blanket: a locative
    - >-
      a destination or an origin — went to the bazaar, came from the granary, into the hut, out of
      the granary: the motion's goal or source; the source of a transfer or an acquisition
    - >-
      when — in 2019, on Monday, at noon: a time; after / before / during / until / since an
      event or a time: a time relation
    - >-
      a means, a companion or a beneficiary — with a knife, by train, with Marisol, for Pieter's
      benefit: an adjunct; the by-phrase of a passive — washed by Marisol: the clause's own actor
    - >-
      how — with care, in a hurry: a manner
    - >-
      the prepositional object of a stative relation verb — depends on the pump, differs from
      Odile, relies on the stream, applies to visitors: the relation's own object, the
      stative-relation template
    - >-
      a verb's particle — gave up, set off, broke down: part of the verb's lemma (give_up), no
      phrase
    - >-
      a prepositional phrase inside a noun phrase — the man with the beret, a book about badgers:
      a postmodifier of that noun, not an attachment to the event
    - >-
      a comparison — taller than Marisol, as tall as Pieter: the comparative template; a than-phrase
      is never an oblique
    - >-
      a gerund after a temporal preposition — after leaving, before eating: a time relation, its
      clause one of its own; a gerund as the direct object of a verb no template takes it with —
      justified closing the granary, ruled out selling the barrow — or as the subject of a clause
      — selling the barrow saved the farm: no slot yet; report the gerund clause as unmapped (G00)
    - >-
      a multi-word preposition that is neither a cause nor a concession nor a place — instead of
      Odile, on behalf of Marisol: no head yet; report the phrase as unmapped (in front of and next
      to name places: the location or the locative template)
    - >-
      due to with a verb — is due to arrive: the clause's prospective aspect (due_to), not a
      cause
    - >-
      the price or the exchange of a transfer — sold the bobbin for forty florins: a measure, no
      slot here; report the phrase as unmapped
    - >-
      a phrase on a predicative noun or a superlative — is the first move toward the fair, the best
      choice for the hut: no event to attach to; report the phrase as unmapped (G00)

slots:
  id:     {type: id, required: true, doc: "your label for the attachment (a1, a2 …)"}
  event:  {type: filler, class: Event, attaches: true, required: true,
           doc: "the predication the phrase attaches to: the id of the clause's event instance, or of an eventive witness or group when the phrase is predicated of an event noun by be (the closure was due to the hail: the delay)"}
  head:   {type: enum, values: [About, Above, Across, Against, Along, Amid, Among, Around, As, At, Before, Behind, Below, Beneath, Beside, Besides, Between, Beyond, By, Concerning, Despite, Down, Except, For, From, In, Inside, Into, Like, Near, Of, "Off", "On", Onto, Opposite, Out, Outside, Over, Past, Per, Regarding, Round, Through, To, Toward, Towards, Under, Underneath, Unlike, Up, Upon, Via, With, Within, Without,
                         BecauseOf, DueTo, OwingTo, ThanksTo, OnAccountOf, InSpiteOf], emit_as: {Past: PastPlace},
           required: true, doc: "the preposition as written, capitalized (about → About, without → Without), a multi-word one CamelCased (because of → BecauseOf, due to → DueTo, owing to → OwingTo, thanks to → ThanksTo, on account of → OnAccountOf, in spite of → InSpiteOf); never a synonym"}
  object2: {type: filler, class: Entity, required: false, only_when: "head == Between",
           doc: "with head Between only, the second of the two (mediated between Femke and Ludo: Ludo); the order as written"}
  object: {type: filler, class: Entity, required: false, narrowed_by: [object_props, object_mods],
           doc: "the phrase's object: a referent id (a witness, a name) for a specific thing, or a bare lemma for a non-specific or class-level one (as a weaver → weaver, without a blanket → blanket, like a bird → bird); absent when the object is a gerund clause (complement)"}
  object_props: {type: list, class: Class, restriction: Member, required: false,
           doc: "with a bare-lemma object, the adjectives on it (argued about wet weather: wet)"}
  object_mods: {type: list, class: Class, ids: [named-entity, time], required: false,
           doc: "with a bare-lemma object, the nouns before it (dealt with harbour pilots: harbour), as the mods of Nouns before nouns"}
  complement: {type: refs, class: Proposition, required: false, bare_content: true,
           doc: "a GERUND CLAUSE as the object (without locking the hatch, by replacing the wheel, accused of stealing the trowel): the id of its predication, parsed with its own template — its actor the clause's subject, or the object of a verb of accusing, charging, blaming or thanking, or none when the text names no one —, tense present; sealed under the preposition, never together with object; the referents it mentions are not listed"}
  tense:  {type: enum, values: [past, present, future], required: false,
           doc: "only when the phrase is predicated of an event noun by be (the closure was due to the hail): the clause's tense; otherwise absent, the event's own template records it"}

one_of: [[object, complement]]

emits:
  - atom: "({head} {event} {object|mod} {object2|opt})"
    if_filled: object
    with_head: object                         # argued about wet weather: about weather too
  - atom: "({head} {event} {complement})"     # a gerund clause as the object, sealed as one term
    if_filled: complement
  - atom: "(Past {event})"                  # predicated of an event noun by be: the clause's tense on that event
    when: "tense == past"
  - atom: "(Future {event})"
    when: "tense == future"

notes:
  - >-
    The head is the surface preposition because there is no closed lexicon of these relations:
    "about", "over" and "on" in "argued about / over / on the quilt" stay three records, and
    whether they coincide is a consumer's business. The one rule is that the word used is the
    head.
  - >-
    An attachment has no symbol of its own: its atom is rendered wherever its event is rendered,
    inside a negation, a modal or a rule over the clause.
  - >-
    A multi-word preposition keeps its words as the head (BecauseOf, DueTo, OwingTo, ThanksTo,
    OnAccountOf, InSpiteOf), as despite is Despite; the background rules read each causal one as
    Because, so a why-question worded with Because finds a cause stated by a connective or by a
    preposition alike, while in spite of stays a concession beside Despite.

depends_on: []
composes_with: [negation, modal, generic, location, time, manner, adjunct]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: what the action is about — the preposition is the head
      text: "Marisol talked about the inspection."
      instances:
        - {t: named-entity, id: n1, name: "Marisol", span: "Marisol"}
        - {t: witness, id: x1, class: inspection, definite: true, span: "the inspection"}
        - {t: activity, id: v1, verb: talk, actor: "@n1", tense: past, span: "Marisol talked"}
        - {t: oblique, id: a1, event: "@v1", head: About, object: "@x1", span: "about the inspection"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_marisol_1 \"Marisol\")"
        - "(Member sk_inspection_1 inspection)"
        - "(Member sk_talk_1 talk)"
        - "(Agent sk_talk_1 sk_marisol_1)"
        - "(Past sk_talk_1)"
        - "(About sk_talk_1 sk_inspection_1)"
      declarations:
        - "(: inspection Class)"
        - "(: sk_inspection_1 Entity)"
        - "(: sk_marisol_1 Entity)"
        - "(: sk_talk_1 Event)"
        - "(: talk Class)"
    - category: positive
      note: a prepositional verb's object — not a beneficiary, not a direct object
      text: "Odile waited for Pieter."
      instances:
        - {t: named-entity, id: n1, name: "Odile", span: "Odile"}
        - {t: named-entity, id: n2, name: "Pieter", span: "Pieter"}
        - {t: activity, id: v1, verb: wait, actor: "@n1", tense: past, span: "Odile waited"}
        - {t: oblique, id: a1, event: "@v1", head: For, object: "@n2", span: "for Pieter"}
    - category: positive
      note: a capacity — the object is a bare lemma
      text: "Pieter worked as a weaver."
      instances:
        - {t: named-entity, id: n1, name: "Pieter", span: "Pieter"}
        - {t: activity, id: v1, verb: work, actor: "@n1", tense: past, span: "Pieter worked"}
        - {t: oblique, id: a1, event: "@v1", head: As, object: weaver, span: "as a weaver"}
    - category: positive
      note: a gerund clause as the object — its actor the clause's subject, sealed under the preposition; no object
      text: "Odile left without locking the hatch."
      instances:
        - {t: named-entity, id: n1, name: "Odile", span: "Odile"}
        - {t: witness, id: x1, class: hatch, definite: true, span: "the hatch"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past, span: "Odile left"}
        - {t: activity, id: v1, verb: lock, actor: "@n1", patient: "@x1", tense: present, span: "locking the hatch"}
        - {t: oblique, id: a1, event: "@m1", head: Without, complement: ["@v1"], span: "without locking the hatch"}
    - category: abstain
      text: "Marisol laughed in the granary."
      expected: {abstain: true, template: location}                   # where
    - category: abstain
      text: "Odile cut the bun with a knife."
      expected: {abstain: true, template: adjunct}                    # a means

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: a direction word with an object is the preposition as written, not a direction
      text: "The ferret ran around the hut."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: witness, id: x2, class: hut, definite: true}
        - {t: motion, id: m1, verb: run, mover: "@x1", tense: past}
        - {t: oblique, id: a1, event: "@m1", head: Around, object: "@x2"}
    - category: positive
      text: "Teodor voted against the plan."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: plan, definite: true}
        - {t: activity, id: v1, verb: vote, actor: "@n1", tense: past}
        - {t: oblique, id: a1, event: "@v1", head: Against, object: "@x1"}
    - category: positive
      text: "Lamine argued over the quilt."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: quilt, definite: true}
        - {t: activity, id: v1, verb: argue, actor: "@n1", tense: past}
        - {t: oblique, id: a1, event: "@v1", head: Over, object: "@x1"}
    - category: positive
      note: without — on a motion
      text: "Teodor left without the quilt."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: quilt, definite: true}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past}
        - {t: oblique, id: a1, event: "@m1", head: Without, object: "@x1"}
    - category: positive
      note: a likeness — the object is class-level, a bare lemma
      text: "Yusra sang like a bird."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: past}
        - {t: oblique, id: a1, event: "@v1", head: Like, object: bird}
    - category: positive
      note: a path phrase on a motion
      text: "Lamine walked through the barn."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: motion, id: m1, verb: walk, mover: "@n1", tense: past}
        - {t: oblique, id: a1, event: "@m1", head: Through, object: "@x1"}
    - category: positive
      note: a path phrase on a motion
      text: "Teodor ran across the field."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: field, definite: true}
        - {t: motion, id: m1, verb: run, mover: "@n1", tense: past}
        - {t: oblique, id: a1, event: "@m1", head: Across, object: "@x1"}
    - category: positive
      note: a prepositional verb with a definite object
      text: "Teodor dealt with the audit."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: audit, definite: true}
        - {t: activity, id: v1, verb: deal, actor: "@n1", tense: past}
        - {t: oblique, id: a1, event: "@v1", head: With, object: "@x1"}
    - category: positive
      note: despite with a noun phrase
      text: "Yusra sang despite the rain."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: rain, definite: true}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: past}
        - {t: oblique, id: a1, event: "@v1", head: Despite, object: "@x1"}
    - category: scoped
      note: under clausal negation — the phrase is denied with the event
      text: "Yusra did not talk about the audit."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: audit, definite: true}
        - {t: activity, id: v1, verb: talk, actor: "@n1", tense: past}
        - {t: oblique, id: a1, event: "@v1", head: About, object: "@x1"}
        - {t: negation, id: s1, over: ["@v1"]}
    - category: scoped
      note: under clausal negation with an indefinite object — the object is bound inside
      text: "Lamine did not argue over a quilt."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: quilt}
        - {t: activity, id: v1, verb: argue, actor: "@n1", tense: past}
        - {t: oblique, id: a1, event: "@v1", head: Over, object: "@x1"}
        - {t: negation, id: s1, over: ["@v1"]}
    - category: scoped
      note: under a modal
      text: "Lamine might wait for Teodor."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Teodor"}
        - {t: activity, id: v1, verb: wait, actor: "@n1", tense: present}
        - {t: oblique, id: a1, event: "@v1", head: For, object: "@n2"}
        - {t: modal, id: s1, over: ["@v1"], head: Might, surface: might}
    - category: scoped
      note: inside a generalization — without any quilt, so the object is a bare lemma
      text: "Every ferret slept without a quilt."
      instances:
        - {t: range, id: q1, class: ferret, quantifier: every, predicate: sleep}
        - {t: activity, id: v1, verb: sleep, actor: "@q1", tense: past}
        - {t: oblique, id: a1, event: "@v1", head: Without, object: quilt}
        - {t: generic, id: r1, ranges: ["@q1"], over: ["@v1"]}
    - category: optional
      note: two phrases on one event
      text: "Teodor voted against the plan despite the rain."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: plan, definite: true}
        - {t: witness, id: x2, class: rain, definite: true}
        - {t: activity, id: v1, verb: vote, actor: "@n1", tense: past}
        - {t: oblique, id: a1, event: "@v1", head: Against, object: "@x1"}
        - {t: oblique, id: a2, event: "@v1", head: Despite, object: "@x2"}
    - category: abstain
      text: "Lamine entered the shed."
      expected: {abstain: true, template: motion}                     # the object of enter is the goal
    - category: abstain
      text: "Teodor arrived in 2019."
      expected: {abstain: true, template: time}                       # when
    - category: abstain
      text: "The quilt was washed by Yusra."
      expected: {abstain: true, template: activity}                   # the by-phrase of a passive
    - category: abstain
      text: "Yusra left after the audit."
      expected: {abstain: true, template: time-relation}              # a time relation
    - category: positive
      note: a gerund clause as the object — the clause's subject its actor, sealed under Without
      text: "Lamine left without waving."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past}
        - {t: activity, id: v1, verb: wave, actor: "@n1", tense: present}
        - {t: oblique, id: a1, event: "@m1", head: Without, complement: ["@v1"]}
    - category: positive
      note: a means stated by a gerund — sealed under By like any gerund object; the parse does not assert the sweeping
      text: "Teodor cleaned the barn by sweeping the floor."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: witness, id: x2, class: floor, definite: true}
        - {t: activity, id: v1, verb: clean, actor: "@n1", patient: "@x1", tense: past}
        - {t: activity, id: v2, verb: sweep, actor: "@n1", patient: "@x2", tense: present}
        - {t: oblique, id: a1, event: "@v1", head: By, complement: ["@v2"]}
    - category: positive
