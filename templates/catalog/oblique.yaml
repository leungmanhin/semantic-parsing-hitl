        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: activity, id: v1, verb: punish, patient: "@n1", tense: past}
        - {t: activity, id: v2, verb: hide, actor: "@n1", patient: "@x1", tense: present}
        - {t: oblique, id: a1, event: "@v1", head: For, complement: ["@v2"]}
    - category: positive
