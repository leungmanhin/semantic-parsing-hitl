# Template: superlative  (the top of a class on a scale, or a rank in it: "the tallest weaver", "one of the oldest glaziers", "the first to arrive", "the third ferret")
#
# A superlative places one thing at the top of a class on the scale an adjective names: (Most
# tall sk_yusra_1 weaver) says Yusra exceeds every other weaver on the scale tall; "one of the
# ADJ-est" puts it in the top stratum, (AmongMost old x glazier); an ordinal gives its rank on an
# ordering, (Ordinal x 3 tall) for the third tallest, (Ordinal x 1 arrive) for the first to
# arrive, (Ordinal x 3 ferret) for the third ferret counted as the text counts them, last for the
# last. The scale is the adjective's lemma (tallest → tall, best → good), the verb's for "the
# first to V", the class itself for a plain ordinal. The predicative form (Yusra is the tallest
# weaver) also asserts the membership, (Member sk_yusra_1 weaver), as a presupposition that
# survives a negation; inside a noun phrase (the tallest weaver left) the witness carries the
# class and the instance adds the superlative. No comparison asserts the positive property. A
# class the noun phrase narrows — the oldest mill in the valley, her second novel, the largest
# walled town — is a COMPARISON CLASS the program builds from the phrase: (Most old sk_mill_1
# (Narrow mill (LocatedIn sk_valley_1))) and a rule that defines its members, so the comparison
# stays inside it.

id: superlative
family: predication
shape: copular
title: The top of a class on a scale, or a rank in it

trigger:
  construction: >
    A superlative or an ordinal with its class stated: X is the ADJ-est / the most ADJ N; X is one
    of the ADJ-est Ns; X is the n-th ADJ-est N; X is the first / second / last to V; the n-th N
    (the third ferret); and the same forms inside a noun phrase (the tallest weaver left, bought
    the most expensive quilt). The subject is a referent — a name, or the witness whose phrase
    holds the superlative — and the instance names it, the scale (tallest → tall, most careful →
    careful, best → good, worst → bad; the verb for the first to V: arrive; the class for a plain
    ordinal: ferret), the class (weaver, glazier, quilt — the noun of the phrase, or the of-phrase:
    the tallest of the weavers), the kind (most, among, ordinal) and, for an ordinal, the rank or
    last. Predicated of the subject by "be" (Yusra is the tallest weaver, Teodor was the first to
    arrive), the instance stands in place of the copular predication: set `predicative: true` and
    the clause's tense, and the membership in the class is asserted too. Inside a noun phrase, the
    witness is parsed as usual (the tallest weaver: a definite witness of class weaver) and the
    instance adds the superlative with no tense and no `predicative`. The span is the whole clause
    for the predicative form and the superlative phrase for the attributive one. A CLASS THE
    PHRASE NARROWS is compared within as narrowed: the witness's own props, mods and possessor
    narrow it by themselves (the largest walled town, the oldest market town, her second novel); a
    place, an author or a whole is
    parsed as its own instance on the subject — the locative (the oldest mill in the valley), the
    postmodifier (the first poem by Bram), the part-whole (the fourth stanza of the hymn), the relation a
    relational class noun states (the first warden of the mill, Bram's second husband: the
    stative-relation, the witness its bearer), the time of a dated period (of the 18th century:
    a time instance with no event), a relative clause on the noun (the oldest bell that still rings,
    the first ship that reached the bay: the clause's own instance) — and listed in `within`; in the predicative form the locative is written on the subject (Bram's
    town in the valley: the town located in the valley, the clause's tense), the adjectives on
    the class noun go to `props` and the nouns, names and years before it to `mods`. The program
    builds the comparison class from all of them.
  surface_forms:
    - "<X> is the ADJ-est / the most ADJ <N>"             # Lamine is the oldest glazier: kind most, predicative
    - "<X> is one of the ADJ-est <N>s"                    # Ottoline is one of the oldest glaziers: kind among
    - "<X> is the <n-th> ADJ-est <N>"                     # Teodor is the second tallest locksmith: kind ordinal, rank 2, scale tall
    - "<X> was the first / last to V"                     # Teodor was the first to arrive: kind ordinal, rank 1, scale arrive
    - "the ADJ-est <N> V-ed … / V-ed the ADJ-est <N>"     # the tallest weaver left; bought the most expensive quilt: attributive
    - "the <n-th> <N> …"                                  # the third ferret slept: kind ordinal, rank 3, scale ferret
    - "the ADJ-est <N> in <place> / the <n-th> <N> by <author> / of <whole>"   # a narrowed class: the instance in `within`
    - "<possessor>'s <n-th> <N> / the ADJ-est <ADJ2> <N> / the ADJ-est <N1> <N2>"   # the witness's possessor, props and mods narrow it
  boundary:                   # looks like a superlative but is not one
    - >-
      a comparative with a standard — taller than Yusra, as tall as Teodor: the comparative
      template
    - >-
      most as a quantifier — most students, most of the ferrets: a range of a generalization, or
      a portion of a group; not a superlative
    - >-
      a bare superlative with no class stated anywhere — Teodor is the tallest, this one is the
      best: no class to fill; report the superlative as unmapped
    - >-
      an adverbial superlative — Yusra runs fastest, Lamine ate the most: a comparison of events,
      with no template yet; report the phrase as unmapped
    - >-
      least — the least patient glazier: the opposite pole, with no head yet; report the phrase
      as unmapped
    - >-
      a degree word — very tall, too tall: a degree
    - >-
      a date or a numbered item — the third of May, page 34, chapter two: a time or a name, not
      a rank in a class
    - >-
      an era or a field as the domain — the busiest potter of his generation, the best singer
      in the history of the choir, of the century with no number, a negated relative clause (the
      oldest mill that never flooded): no restriction the parse can state; write no superlative instance and report the superlative phrase as unmapped (G00),
      the rest of the clause parsed as usual (a dated period — of the 18th century, of the
      1880s, of 1999 — is a time instance in `within`)
    - >-
      a phrase that narrows nothing — the tallest tower ever, of all time, in the world, on
      record: the superlative over the class itself; report the phrase as unmapped (ever: G02,
      a phrase: G00)

slots:
  id:          {type: id, required: true, doc: "your label for the superlative (s1, s2 …)"}
  subject:     {type: filler, class: Entity, required: true,
                doc: "the thing at the top or at the rank: the subject's referent id for the predicative form, the witness whose phrase holds the superlative for the attributive one"}
  scale:       {type: lemma, class: Class, required: true,
                doc: "what orders the class: the adjective lemmatized (tallest → tall, most careful → careful, best → good, worst → bad), the verb of the first / last to V (arrive, speak), or the class itself for a plain ordinal (the third ferret → ferret)"}
  class:       {type: lemma, class: Class, required: false, narrowed_by: mods,
                doc: "the class compared within, lemmatized to the singular: the noun of the phrase (weaver, quilt) or of the of-phrase (the tallest of the weavers → weaver); absent only for the first / last to V; the noun alone: what narrows it is the subject's own phrase (its props, its mods, its possessor), `props`, `mods` and `within`"}
  kind:        {type: enum, values: [most, among, ordinal], required: true,
                doc: "most for the ADJ-est / the most ADJ (the unique top); among for one of the ADJ-est; ordinal for a rank: the n-th, the n-th ADJ-est, the first / last to V"}
  rank:        {type: number, required: false, doc: "the rank of an ordinal: first → 1, second → 2, third → 3; empty for last"}
  last:        {type: bool, required: false, doc: "true for the last (the last to speak); absent otherwise"}
  predicative: {type: bool, required: false,
                doc: "true when the superlative is predicated of the subject by be (Yusra is the tallest weaver; Teodor was the first to arrive): the membership is asserted and the tense recorded; absent inside a noun phrase"}
  tense:       {type: enum, values: [past, present, future], required: false, default: present,
                doc: "the copular clause's tense for the predicative form (is / was / will be the tallest); omit inside a noun phrase"}
  props:       {type: list, class: Class, required: false,
                doc: "in the predicative form, the adjectives on the class noun, each a lemma (Bram's town is the largest walled town: walled); inside a noun phrase the witness's own props narrow the class instead"}
  mods:        {type: list, class: Class, ids: [named-entity, time], required: false,
                doc: "in the predicative form, the nouns, names and years before the class noun (Calderwick is the largest market town: market), as the mods of Nouns before nouns; inside a noun phrase the witness's own mods narrow the class instead"}
  within:      {type: list, class: Proposition, required: false,
                doc: "the ids of the instances that narrow the class, each describing the subject: the locative that places it, the postmodifier that attributes it (by Bram), the part-whole that attaches it (of the hymn), the stative-relation a relational class noun states (the first warden of the mill), the time instance of a dated period (of the 18th century), the instance of a relative clause on the noun (the first ship that reached the bay); never a negated clause"}

narrowing:                     # the comparison class: the class as the noun phrase narrows it
  class: class
  scale: scale
  subject: subject
  props: props
  within: within

emits:
  # the superlative: the unique top of the class on the scale
  - atom: "(Most {scale} {subject} {class|narrowed})"
    when: "kind == most and tense != past and tense != future"
  - atom: "(Past (Most {scale} {subject} {class|narrowed}))"
    when: "kind == most and tense == past"
  - atom: "(Future (Most {scale} {subject} {class|narrowed}))"
    when: "kind == most and tense == future"
  # the top stratum: one of the ADJ-est
  - atom: "(AmongMost {scale} {subject} {class|narrowed})"
    when: "kind == among and tense != past and tense != future"
  - atom: "(Past (AmongMost {scale} {subject} {class|narrowed}))"
    when: "kind == among and tense == past"
  - atom: "(Future (AmongMost {scale} {subject} {class|narrowed}))"
    when: "kind == among and tense == future"
  # the rank: the n-th, the first to V, the last
  - atom: "(Ordinal {subject} {rank} {scale|narrowed} {class|narrowed})"
    if_filled: rank
    when: "kind == ordinal and not last and tense != past and tense != future"
  - atom: "(Past (Ordinal {subject} {rank} {scale|narrowed} {class|narrowed}))"
    if_filled: rank
    when: "kind == ordinal and not last and tense == past"
  - atom: "(Future (Ordinal {subject} {rank} {scale|narrowed} {class|narrowed}))"
    if_filled: rank
    when: "kind == ordinal and not last and tense == future"
  - atom: "(Ordinal {subject} last {scale|narrowed} {class|narrowed})"
    when: "kind == ordinal and last and tense != past and tense != future"
    declare: {last: Class}
  - atom: "(Past (Ordinal {subject} last {scale|narrowed} {class|narrowed}))"
    when: "kind == ordinal and last and tense == past"
    declare: {last: Class}
  - atom: "(Future (Ordinal {subject} last {scale|narrowed} {class|narrowed}))"
    when: "kind == ordinal and last and tense == future"
    declare: {last: Class}
  # the membership the predicative form asserts (a presupposition: it projects through a negation)
  - atom: "(Member {subject} {class|mod})"
    with_head: class
    if_filled: class
    when: "predicative and tense != past and tense != future"
    project: true
  - atom: "(Past (Member {subject} {class|mod}))"
    with_head: class
    if_filled: class
    when: "predicative and tense == past"
    project: true
  - atom: "(Future (Member {subject} {class|mod}))"
    with_head: class
    if_filled: class
    when: "predicative and tense == future"
    project: true
  # the predicative form's modifiers on the class noun: presupposed like the membership
  - atom: "(Member {subject} {props})"
    each: props
    when: "predicative and tense != past and tense != future"
    project: true
  - atom: "(Past (Member {subject} {props}))"
    each: props
    when: "predicative and tense == past"
    project: true
  - atom: "(Future (Member {subject} {props}))"
    each: props
    when: "predicative and tense == future"
    project: true
  # the comparison class: what makes a thing one of its members (once per text and class) —
  # or, when no atom of a member could show it (a dated period), the subject's own membership
  - atom: "(Implication {class|narrowing} (Member $y {class|narrowed}))"
    if_narrowed: defined
    project: true
  - atom: "(Member {subject} {class|narrowed})"
    if_narrowed: opaque
    project: true

notes:
  - >-
    A superlative asserts a place in the class on the scale and nothing about the positive
    property: the tallest weaver need not be tall. The scale is the adjective's own lemma, as a
    comparative's is, so that the two kinds of comparison share one scale; the class is the one
    the text states, never a default.
  - >-
    The predicative form asserts the membership too — Yusra is a weaver — as a presupposition:
    it is rendered at the top level whatever scope the superlative sits in, so "Yusra is not the
    tallest weaver" denies the top place and keeps her a weaver. Inside a noun phrase the witness
    already carries the class, and the instance adds only the superlative.
  - >-
    An ordinal's ordering is what the text gives: the adjective for the n-th ADJ-est, the verb for
    the first to V (the first arrival is Teodor's), the class itself when the text merely counts
    (the third ferret). "Last" is a rank with no number and keeps its word. Its last argument is
    the class ranked within — the class, the comparison class, or for the first to V the verb
    itself (those who did); the rule rank_orders compares two ranks on one scale in one class.
  - >-
    A comparison class is named by what it says, never numbered: two texts that both say "the
    largest town in the valley" give the same term and the same defining rule, so their
    superlatives and ranks compare (most_exceeds, most_bounds, rank_orders) without any record
    of what other texts built. A relational class noun narrows by its relation, (Narrow mayor
    (Relation mayor sk_calderwick_1)), and the rule tests the relation state alone — a mayor known
    only as "the mayor of Calderwick" carries no class atom. A dated period narrows by its
    description, (Narrow glazier (Within (Century 18))); no atom shows that another glazier belongs
    to the period, so that class has no rule and its subject's membership is stated, and two texts
    naming the same period still compare. A relative clause narrows by what it says: a copular one
    by its property, an eventive one as (Event <verb> <the subject's role> (<role> <filler>) …) —
    an indefinite filler as (Some <class>), so "the first ship that reached a bay" in two texts is one
    class; the clause's tense stays out of it. An era or a field narrows in a way no atom states yet:
    those superlatives stay unmapped.

depends_on: [named-entity, witness, activity, motion]
composes_with: [negation, modal, time, location]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: the predicative superlative — the top of the class, and the membership as a presupposition
      text: "Lamine is the oldest glazier."
      instances:
        - {t: named-entity, id: n1, name: "Lamine", span: "Lamine"}
        - {t: superlative, id: s1, subject: "@n1", scale: old, class: glazier, kind: most, predicative: true, tense: present, span: "Lamine is the oldest glazier"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_lamine_1 \"Lamine\")"
        - "(Most old sk_lamine_1 glazier)"
        - "(Member sk_lamine_1 glazier)"
      declarations:
        - "(: glazier Class)"
        - "(: old Class)"
        - "(: sk_lamine_1 Entity)"
    - category: positive
      note: an ordinal with an event — the first arrival is Teodor's
      text: "Teodor was the first to arrive."
      instances:
        - {t: named-entity, id: n1, name: "Teodor", span: "Teodor"}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: past, span: "Teodor was the first to arrive"}
        - {t: superlative, id: s1, subject: "@n1", scale: arrive, kind: ordinal, rank: 1, predicative: true, tense: past, span: "the first to arrive"}
    - category: positive
      note: attributive — the witness carries the class, the instance adds the superlative
      text: "The tallest weaver left."
      instances:
        - {t: witness, id: x1, class: weaver, definite: true, span: "The tallest weaver"}
        - {t: superlative, id: s1, subject: "@x1", scale: tall, class: weaver, kind: most, span: "The tallest weaver"}
        - {t: motion, id: m1, verb: leave, mover: "@x1", tense: past, span: "The tallest weaver left"}
    - category: abstain
      text: "Most students laugh."
      expected: {abstain: true, template: generic}                    # most as a quantifier
    - category: abstain
      text: "Lamine is older than Ottoline."
      expected: {abstain: true, template: comparative}                # a comparative with a standard

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: the predicative superlative
      text: "Yusra is the tallest weaver."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: superlative, id: s1, subject: "@n1", scale: tall, class: weaver, kind: most, predicative: true, tense: present}
    - category: positive
      note: one of the ADJ-est — the top stratum
      text: "Ottoline is one of the oldest glaziers."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: superlative, id: s1, subject: "@n1", scale: old, class: glazier, kind: among, predicative: true, tense: present}
    - category: positive
      note: an ordinal on a scale
      text: "Teodor is the second tallest locksmith."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: superlative, id: s1, subject: "@n1", scale: tall, class: locksmith, kind: ordinal, rank: 2, predicative: true, tense: present}
    - category: positive
      note: the last to V
      text: "Lamine was the last to speak."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: activity, id: v1, verb: speak, actor: "@n1", tense: past}
        - {t: superlative, id: s1, subject: "@n1", scale: speak, kind: ordinal, last: true, predicative: true, tense: past}
    - category: positive
      note: a plain ordinal inside a noun phrase — the class is the ordering
      text: "The third ferret slept."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: superlative, id: s1, subject: "@x1", scale: ferret, class: ferret, kind: ordinal, rank: 3}
        - {t: activity, id: v1, verb: sleep, actor: "@x1", tense: past}
    - category: positive
      note: attributive inside an object — the most ADJ
      text: "Yusra bought the most expensive quilt."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: quilt, definite: true}
        - {t: superlative, id: s1, subject: "@x1", scale: expensive, class: quilt, kind: most}
        - {t: acquisition, id: e1, verb: buy, acquirer: "@n1", object: "@x1", tense: past}
    - category: positive
      note: a periphrastic superlative
      text: "Lamine is the most careful glazier."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: superlative, id: s1, subject: "@n1", scale: careful, class: glazier, kind: most, predicative: true, tense: present}
    - category: positive
      note: best is good, in the past
      text: "Ottoline was the best weaver."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: superlative, id: s1, subject: "@n1", scale: good, class: weaver, kind: most, predicative: true, tense: past}
    - category: positive
      note: the class from an of-phrase
      text: "Teodor is the oldest of the locksmiths."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: superlative, id: s1, subject: "@n1", scale: old, class: locksmith, kind: most, predicative: true, tense: present}
    - category: scoped
      note: under negation — the top place is denied, the membership survives
      text: "Yusra is not the tallest weaver."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: superlative, id: s1, subject: "@n1", scale: tall, class: weaver, kind: most, predicative: true, tense: present}
        - {t: negation, id: s2, over: ["@s1"]}
    - category: scoped
      note: under a modal
      text: "Lamine might be the oldest glazier."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: superlative, id: s1, subject: "@n1", scale: old, class: glazier, kind: most, predicative: true, tense: present}
        - {t: modal, id: s2, over: ["@s1"], head: Might, surface: might}
    - category: abstain
      text: "Teodor is taller than Yusra."
      expected: {abstain: true, template: comparative}                # a comparative with a standard
    - category: abstain
      text: "Most ferrets slept."
      expected: {abstain: true, template: generic}                    # most as a quantifier
    - category: abstain
      text: "Teodor is the tallest."
      expected: {abstain: true, gap: G00, span: "the tallest"}        # no class stated
    - category: abstain
      text: "Yusra runs fastest."
      expected: {abstain: true, gap: G00, span: "fastest"}            # an adverbial superlative
    - category: positive
      note: a place narrows the class — the locative on the subject, listed in within; the comparison class
      text: "Lamine is the oldest locksmith in Calderwick."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Calderwick"}
        - {t: locative, id: l1, thing: "@n1", place: "@n2", head: LocatedIn, preposition: in, tense: present}
        - {t: superlative, id: s1, subject: "@n1", scale: old, class: locksmith, kind: most, predicative: true, tense: present, within: ["@l1"]}
    - category: positive
      note: a modifier inside the phrase narrows the class — the witness's props
      text: "Yusra bought the cheapest woollen quilt."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: quilt, definite: true, props: [woollen]}
        - {t: acquisition, id: e1, verb: buy, acquirer: "@n1", object: "@x1", tense: past}
        - {t: superlative, id: s1, subject: "@x1", scale: cheap, class: quilt, kind: most}
    - category: positive
      note: a possessor narrows a counted ordinal — the ordering and the class are the comparison class
      text: "Teodor bought Ottoline's second album."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Ottoline"}
        - {t: witness, id: x1, class: album, possessor: "@n2"}
        - {t: acquisition, id: e1, verb: buy, acquirer: "@n1", object: "@x1", tense: past}
        - {t: superlative, id: s1, subject: "@x1", scale: album, class: album, kind: ordinal, rank: 2}
    - category: positive
      note: an author narrows the class — the postmodifier, listed in within
      text: "Yusra sang the first song by Lamine."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: witness, id: x1, class: song, definite: true}
        - {t: postmodifier, id: a1, noun: "@x1", head: By, object: "@n2"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", patient: "@x1", tense: past}
        - {t: superlative, id: s1, subject: "@x1", scale: song, class: song, kind: ordinal, rank: 1, within: ["@a1"]}
    - category: positive
      note: a whole narrows the class — the part-whole, listed in within
      text: "Teodor wrote the third chapter of the ledger."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: chapter, definite: true}
        - {t: witness, id: x2, class: ledger, definite: true}
        - {t: part-whole, id: w1, part: "@x1", whole: "@x2", word: of, tense: present}
        - {t: creation, id: e1, verb: write, creator: "@n1", product: "@x1", tense: past}
        - {t: superlative, id: s1, subject: "@x1", scale: chapter, class: chapter, kind: ordinal, rank: 3, within: ["@w1"]}
    - category: positive
      note: a rank on a scale in a place — the ordering the adjective, the class the comparison class
      text: "Ottoline is the second tallest weaver in Calderwick."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
