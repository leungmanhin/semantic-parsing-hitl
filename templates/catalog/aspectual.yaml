# Template: aspectual  (a phase of an action: "began to sing", "stopped working", "kept reading the letter", "came to like the quilt"; a continuation of a state: "remained closed")
#
# An aspectual verb says that an action started, went on, resumed or ended; the action is the
# complement, parsed with its own template with the sentence's subject as its actor (or
# undergoer: the price started to fall), and sealed as the phase event's Theme. The phase verb
# has no role of its own: the subject belongs to the action. Whatever the phase, the action was
# underway — began to sing is singing, stopped working was working — so the phase event is
# marked (Entails e) and a background rule derives the action at the phase event's tense; the
# parse asserts nothing about it. The phase itself (begin, continue, stop, finish) is the verb
# lemma; when an action started relative to when it ended is a matter for the consumer. A
# CONTINUATION OF A STATE — remain, stay, keep with a property or a place (the mill remained
# closed) — seals the state in the clause's own tense, as a copular or locative clause of its own,
# (Theme sk_remain_1 (Past (Member sk_mill_1 closed))), and the program marks it (Continues e)
# instead of (Entails e): a background rule derives the state as sealed, the catalog's own form
# for "the mill was closed".

id: aspectual
family: predication
shape: verb-class
title: A phase of an action
status: draft

trigger:
  construction: >
    A verbal clause whose verb names a phase of the action its complement states: begin, start,
    commence, continue, keep, go on, carry on, resume, stop, cease, quit, finish with a
    to-infinitive or a gerund (began to sing, kept reading the postcard, stopped working, finished
    washing the blanket); and come to V, the inchoative (came to like the blanket), with the lemma
    come_to. Parse the action with the template its verb takes, its actor or undergoer the
    sentence's subject and its tense present; then write the aspectual instance naming the phase
    verb and the action. A CONTINUATION OF A STATE — remain, stay, keep or continue to be with a
    property, a noun or a place (the gate remained shut, Pieter stayed in the granary, Odile kept
    silent, the hatch remains a hazard) — is the same construction over a STATE: parse the state
    with its own template (a copular instance for a property or a noun, a locative for a place),
    the sentence's subject its subject, and with THE CLAUSE'S TENSE (remained shut: the copular
    in the past; remains a hazard: present), unlike an action; the aspectual instance names the
    phase verb (remain, stay, keep, continue) and the state, and the program marks the
    continuation.
  verbs: [begin, start, commence, continue, keep, go_on, carry_on, resume, stop, cease, quit,
          finish, come_to, remain, stay]
  verbs_note: >
    These verbs belong here only with a verbal complement, or, for remain, stay, keep and
    continue to be, with a property, a noun or a place (a state). Without one they are a change of
    state (the inspection began, the price stopped) or an ordinary action on an object (started a
    business, finished the postcard, kept the postcard); stop / keep X from V-ing is a causative.
  surface_forms:
    - "<subject> began / started / continued to <V2> …"   # Pieter began to sing
    - "<subject> kept / stopped / finished <V2>-ing …"    # Marisol stopped working
    - "<subject> came to <V2> …"                          # Marisol came to like the blanket
    - "<subject> remained / stayed / kept <ADJ, N or place>"   # the gate remained shut: the state in the clause's tense, a continuation
  boundary:                   # looks like an aspectual but is not one
    - >-
      a phase verb without a verbal complement — the inspection began, the price stopped, the storm
      ceased: a change of state of the subject
    - >-
      keep with an object and a property — kept the hatch open, kept Pieter awake: a causer keeping
      another thing in a state; no template yet, report the clause as unmapped (G09)
    - >-
      a phase verb with a noun object — started a business, finished the postcard, kept the
      postcard, continued the inspection: an action on a thing, parsed by that action's template
    - >-
      stop, keep or prevent with an object and a verb — stopped Pieter from leaving, kept Odile
      from leaving: a causative
    - >-
      no longer V-s, V-s again, still V-s: a different construction, and the words change the
      claim (no longer works does not say works); report the whole clause as unmapped
    - >-
      used to V — Odile used to sing: a past habit, the habitual template
    - >-
      begin or start as the motion of setting off — started for the bazaar: a motion

slots:
  id:         {type: id, required: true, doc: "your label for the phase event"}
  verb:       {type: lemma, class: Class, required: true, doc: "the phase verb lemma (begin, start, continue, keep, stop, finish, come_to …)"}
  complement: {type: refs, class: Proposition, required: true,
               doc: "the action: the ids of the instances that state it (its predication, with the sentence's subject as its actor or undergoer, tense present); for a continuation of a state, the id of the copular or locative instance that states it, with the sentence's subject and THE CLAUSE'S TENSE; the referents it mentions are not listed"}
  tense:      {type: enum, values: [past, present, future], required: true,
               doc: "the clause's tense; present is recorded, not inferred"}
  aspect:     {type: enum, values: [simple, progressive, perfect, perfect_progressive, about_to, due_to, would, going_to], required: false, default: simple,
              doc: "simple; progressive for be V-ing; perfect for have V-ed; perfect_progressive for have been V-ing; about_to for be about to V / on the point of V-ing and due_to for be due to V / be to V / be set to V — the PROSPECTIVE aspect, the event upcoming at the clause's time, the word kept as the value (be going to V is the future tense, not a prospective); would for a future seen from a past moment (said the granary would flood, hoped the bridge would hold) and going_to for was / were going to V — the same PROSPECTIVE, with tense past; a would that tells what then happened (would later marry) is the plain past, and a would with no if-clause and no past moment is the modal's Would"}

mints: {id: Event}

emits:
  - atom: "(Member @id {verb})"
  - atom: "(Theme @id {complement})"        # the action, sealed as one term
  - atom: "(Entails @id)"                   # the action was underway: a background rule derives it at this event's tense
    unless_stative: complement
  - atom: "(Continues @id)"                 # a state that went on: a background rule derives it in the tense it is sealed in
    if_stative: complement
  - atom: "(Past @id)"
    when: "tense == past or aspect == perfect or aspect == perfect_progressive"
  - atom: "(Future @id)"
    when: "tense == future"
  - atom: "(Ongoing @id)"
    when: "aspect == progressive or aspect == perfect_progressive"
  - atom: "(Prospective @id)"
    when: "aspect == about_to or aspect == due_to or aspect == would or aspect == going_to"

notes:
  - >-
    No Agent on the phase event: the subject of "Yusra stopped working" is the one who worked,
    not a doer of a stopping; the price in "the price started to fall" undergoes the falling.
    The action's atoms carry the subject.
  - >-
    The marker sits inside whatever scope the phase event sits in, as a control verb's is: "did
    not stop working" denies the bundle and the background rule derives no working.
  - >-
    A continuation of a state is marked (Continues e), not (Entails e): a copular or a locative
    clause has no event to carry a tense, so the state is sealed in its own tense — (Past (Member
    sk_mill_1 closed)) — and the background rule derives it as sealed; the program picks the mark
    from the complement's template, the parser only names the state. "did not remain closed"
    denies the bundle and derives nothing.

depends_on: [named-entity, witness, activity, change-of-state, psych, negation, copular, locative]
composes_with: [negation, modal, time]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: the phase event has no role of its own; the action is sealed as its Theme and marked as entailed
      text: "Pieter began to sing."
      instances:
        - {t: named-entity, id: n1, name: "Pieter", span: "Pieter"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: present, span: "to sing"}
        - {t: aspectual, id: e1, verb: begin, complement: ["@v1"], tense: past, span: "Pieter began to sing"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_pieter_1 \"Pieter\")"
        - "(Member sk_begin_1 begin)"
        - "(Theme sk_begin_1 (And (Member sk_sing_1 sing) (Agent sk_sing_1 sk_pieter_1)))"
        - "(Entails sk_begin_1)"
        - "(Past sk_begin_1)"
      declarations:
        - "(: begin Class)"
        - "(: sing Class)"
        - "(: sk_begin_1 Event)"
        - "(: sk_pieter_1 Entity)"
        - "(: sk_sing_1 Event)"
    - category: positive
      note: the subject undergoes the action — no agent anywhere
      text: "The price started to fall."
      instances:
        - {t: witness, id: x1, class: price, definite: true, span: "The price"}
        - {t: change-of-state, id: c1, verb: fall, undergoer: "@x1", tense: present, span: "to fall"}
        - {t: aspectual, id: e1, verb: start, complement: ["@c1"], tense: past, span: "The price started to fall"}
    - category: positive
      note: a continuation of a state — the state in the clause's tense, sealed; the program marks it Continues
      text: "The hatch stayed open."
      instances:
        - {t: witness, id: x1, class: hatch, definite: true, span: "The hatch"}
        - {t: copular, id: c1, subject: "@x1", predicate: open, form: adjective, tense: past, span: "open"}
        - {t: aspectual, id: e1, verb: stay, complement: ["@c1"], tense: past, span: "The hatch stayed open"}
    - category: abstain
      text: "Marisol tried to sleep."
      expected: {abstain: true, template: control}                    # an effort, not a phase
    - category: abstain
      text: "Odile prevented Pieter from leaving."
      expected: {abstain: true, template: causative}                  # a causer and a different actor

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: a gerund complement
      text: "Yusra stopped working."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: activity, id: v1, verb: work, actor: "@n1", tense: present}
        - {t: aspectual, id: e1, verb: stop, complement: ["@v1"], tense: past}
    - category: positive
      note: the inchoative come to — the lemma is come_to
      text: "Yusra came to like the quilt."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: quilt, definite: true}
        - {t: psych, id: p1, verb: like, experiencer: "@n1", stimulus: "@x1", tense: present}
        - {t: aspectual, id: e1, verb: come_to, complement: ["@p1"], tense: past}
    - category: positive
      note: keep V-ing
      text: "Lamine kept reading the letter."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: letter, definite: true}
        - {t: activity, id: v1, verb: read, actor: "@n1", patient: "@x1", tense: present}
        - {t: aspectual, id: e1, verb: keep, complement: ["@v1"], tense: past}
    - category: positive
      text: "Ottoline continued to wait."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: activity, id: v1, verb: wait, actor: "@n1", tense: present}
        - {t: aspectual, id: e1, verb: continue, complement: ["@v1"], tense: past}
    - category: positive
      text: "Yusra finished washing the quilt."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: quilt, definite: true}
        - {t: activity, id: v1, verb: wash, actor: "@n1", patient: "@x1", tense: present}
        - {t: aspectual, id: e1, verb: finish, complement: ["@v1"], tense: past}
    - category: scoped
      note: under clausal negation
      text: "Yusra did not stop working."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: activity, id: v1, verb: work, actor: "@n1", tense: present}
        - {t: aspectual, id: e1, verb: stop, complement: ["@v1"], tense: past}
        - {t: negation, id: s1, over: ["@e1"]}
    - category: scoped
      note: under a modal
      text: "Teodor might begin to sing."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: present}
        - {t: aspectual, id: e1, verb: begin, complement: ["@v1"], tense: present}
        - {t: modal, id: s1, over: ["@e1"], head: Might, surface: might}
    - category: optional
      text: "Teodor quit singing."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: present}
        - {t: aspectual, id: e1, verb: quit, complement: ["@v1"], tense: past}
    - category: abstain
      text: "The audit began."
      expected: {abstain: true, template: change-of-state}            # no verbal complement
    - category: abstain
      text: "Lamine kept Teodor from leaving."
      expected: {abstain: true, template: causative}                  # a causer and a different actor
    - category: abstain
      text: "Yusra no longer works."
      expected: {abstain: true, gap: G00, span: "no longer works"}    # a cessation construction
    - category: positive
      note: a continuation of a property — the copular in the clause's tense, sealed; Continues
      text: "The mill remained closed."
      instances:
        - {t: witness, id: x1, class: mill, definite: true}
        - {t: copular, id: c1, subject: "@x1", predicate: closed, form: adjective, tense: past}
        - {t: aspectual, id: e1, verb: remain, complement: ["@c1"], tense: past}
    - category: positive
      note: a continuation of a place — the locative in the clause's tense, sealed
      text: "Teodor stayed in the barn."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: locative, id: l1, thing: "@n1", place: "@x1", head: LocatedIn, preposition: in, tense: past}
        - {t: aspectual, id: e1, verb: stay, complement: ["@l1"], tense: past}
    - category: positive
      note: keep with a property and no object — a continuation of the subject's own state
      text: "Lamine kept quiet."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: copular, id: c1, subject: "@n1", predicate: quiet, form: adjective, tense: past}
        - {t: aspectual, id: e1, verb: keep, complement: ["@c1"], tense: past}
    - category: positive
      note: a present continuation of a place
      text: "The ferret remains in the hut."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: witness, id: x2, class: hut, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: LocatedIn, preposition: in, tense: present}
        - {t: aspectual, id: e1, verb: remain, complement: ["@l1"], tense: present}
