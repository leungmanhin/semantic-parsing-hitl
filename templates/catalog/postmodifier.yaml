# Template: postmodifier  (a prepositional phrase inside a noun phrase, by its own preposition: "the man with the hat", "a book about ferrets", "a letter from Yusra")
#
# A prepositional phrase that restricts a noun attaches to that noun's referent under a head
# named after the preposition itself, capitalized: (With sk_man_1 sk_hat_1), (About sk_book_1
# ferret), (From sk_letter_1 sk_yusra_1). The phrase says which thing is meant, or what it is
# about, from, for or without; it is not a predication of its own (the man is not said to have
# a hat) and not an attachment to the clause's event. A possessive of-phrase (the quilt of Yusra)
# is the witness's possessor, not a postmodifier.

id: postmodifier
family: attachment
shape: attachment
title: A prepositional phrase inside a noun phrase, by its own preposition
status: draft

trigger:
  construction: >
    A prepositional phrase that modifies a noun inside its noun phrase: the man with the hat, a
    book about ferrets, a letter from Yusra, the key to the shed, a thermos without a lid, the
    destruction of the shed. The noun's referent is parsed as usual
    (a witness or a name); the postmodifier names that referent, the preposition as written
    (capitalized) and the phrase's object. One instance per phrase. It is part of the noun
    phrase, so it follows the referent wherever the referent is rendered.
  surface_forms:
    - "the <N> with / without <object>"               # the man with the hat
    - "a <N> about / from / to / for <object>"        # a book about ferrets; a letter from Yusra
    - "the <N> of <object>"                           # the destruction of the shed: the noun's own object
    - "a <N> by <author>"                             # a ballad by Ines: By, the author or maker of the thing
    - "<Name> is a <kind word> of <N>"                # Velloria is a genus of ferns: the copular genus, Of on the name, fern a bare lemma
    - "the <N> between <A> and <B>"                   # the quarrel between Ines and Corvin: Between, Ines the object, Corvin object2
  boundary:                   # looks like a postmodifier but is not one
    - >-
      a possessive of-phrase or genitive — the quilt of Yusra, Yusra's quilt, the sister of
      Lamine: the witness's possessor, not a phrase of this kind
    - >-
      a phrase on the clause, not on the noun — read the letter in the barn (the reading is in
      the barn), talked about the audit: a location or an oblique on the event; decide by what
      the phrase modifies
    - >-
      a partitive — two of the ferrets, some of the quilts: a portion of the group (the portion
      template), not a modified noun; one of the ferrets: a witness that is a member (part-whole)
    - >-
      a measure or a container — a cup of tea, three metres of cloth: a witness of the substance
      with a measure on it (unit cup, metre), the measure template; a lot of water: the
      witness's quantity phrase
    - >-
      a place phrase inside a noun phrase — the ferret in the barn, the ledger on the workbench:
      a locative predication of that thing (in, at, on, near, under …), not a phrase of this
      class; and a place predicated of a thing — the ledger is on the workbench — likewise
    - >-
      a reduced relative clause — the rules concerning the levy, a skiff moored at the jetty: a
      clause with the noun in its role (Relative clauses and participles), not a phrase; a
      by-phrase after a participle (a bowl carved by Bram) is that clause's agent, not By
    - >-
      an of-phrase naming the thing itself — the village of Aldmoor: the name with its class
      (the named-entity template), one referent, not a phrase
    - >-
      a noun before the noun — a harbour pilot: the head's mods (Nouns before nouns), not a
      phrase
    - >-
      between two times — between May and June, between 1990 and 1995: a window of time, the
      time-relation template

slots:
  id:     {type: id, required: true, doc: "your label for the attachment (a1, a2 …)"}
  noun:   {type: filler, class: Entity, attaches: true, required: true,
           doc: "the referent the phrase modifies: the id of its witness or named-entity instance"}
  head:   {type: enum, values: [About, Above, Across, Against, Along, Among, Around, As, At, Behind, Below, Beneath, Beside, Besides, Between, Beyond, By, Concerning, Despite, Down, Except, For, From, In, Inside, Into, Like, Near, Of, "Off", "On", Onto, Opposite, Out, Outside, Over, Past, Per, Regarding, Round, Through, To, Toward, Towards, Under, Underneath, Unlike, Up, Upon, Via, With, Within, Without],
           required: true, doc: "the preposition as written, capitalized (with → With, about → About); never a synonym"}
  object: {type: filler, class: Entity, required: true, narrowed_by: [object_props, object_mods],
           doc: "the phrase's object: a referent id (a witness, a name) for a specific thing, or a bare lemma for a non-specific or class-level one (a book about ferrets → ferret, a thermos without a lid → lid); with head Between the first of the two"}
  object_props: {type: list, class: Class, restriction: Member, required: false,
           doc: "with a bare-lemma object, the adjectives on it (a song about lost sailors: lost)"}
  object_mods: {type: list, class: Class, ids: [named-entity, time], required: false,
           doc: "with a bare-lemma object, the nouns before it (a book about harbour pilots: harbour), as the mods of Nouns before nouns"}
  object2: {type: filler, class: Entity, required: false, only_when: "head == Between",
           doc: "with head Between only, the second of the two (the quarrel between Ines and Corvin: Corvin); the order as written"}

emits:
  - atom: "({head} {noun} {object|mod} {object2|opt})"
    with_head: object                # a book about harbour pilots is about pilots too

notes:
  - >-
    The atom relates the two referents under the surface preposition and asserts nothing else:
    "the man with the hat" does not state a possession and "the key to the shed" no
    transfer. Which relation the preposition names is a consumer's reading.
  - >-
    The phrase follows its noun: an indefinite noun phrase bound inside a negation carries its
    postmodifier inside with it; a definite one stays at the top level with it.

depends_on: [witness, named-entity]
composes_with: [negation, modal, generic]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: the phrase picks out the referent; no possession is stated
      text: "The man with the hat laughed."
      instances:
        - {t: witness, id: x1, class: man, definite: true, span: "The man"}
        - {t: witness, id: x2, class: hat, definite: true, span: "the hat"}
        - {t: postmodifier, id: a1, noun: "@x1", head: With, object: "@x2", span: "with the hat"}
        - {t: activity, id: v1, verb: laugh, actor: "@x1", tense: past, span: "The man with the hat laughed"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Member sk_man_1 man)"
        - "(With sk_man_1 sk_hat_1)"
        - "(Member sk_hat_1 hat)"
        - "(Member sk_laugh_1 laugh)"
        - "(Agent sk_laugh_1 sk_man_1)"
        - "(Past sk_laugh_1)"
      declarations:
        - "(: hat Class)"
        - "(: laugh Class)"
        - "(: man Class)"
        - "(: sk_hat_1 Entity)"
        - "(: sk_laugh_1 Event)"
        - "(: sk_man_1 Entity)"
    - category: positive
      note: what a thing is about — a class-level object as a bare lemma
      text: "Yusra read a book about ferrets."
      instances:
        - {t: named-entity, id: n1, name: "Yusra", span: "Yusra"}
        - {t: witness, id: x1, class: book, span: "a book"}
        - {t: postmodifier, id: a1, noun: "@x1", head: About, object: ferret, span: "about ferrets"}
        - {t: activity, id: v1, verb: read, actor: "@n1", patient: "@x1", tense: past, span: "Yusra read a book about ferrets"}
    - category: abstain
      text: "Yusra's quilt"
      expected: {abstain: true, template: witness}                    # a possessive: the witness's possessor
    - category: abstain
      text: "Yusra talked about the audit."
      expected: {abstain: true, template: oblique}                    # a phrase on the clause

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      text: "A letter from Yusra arrived."
      instances:
        - {t: witness, id: x1, class: letter}
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: postmodifier, id: a1, noun: "@x1", head: From, object: "@n1"}
        - {t: motion, id: m1, verb: arrive, moved: "@x1", tense: past}
    - category: positive
      note: the key to the shed — no transfer is stated
      text: "Lamine found the key to the shed."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: key, definite: true}
        - {t: witness, id: x2, class: shed, definite: true}
        - {t: postmodifier, id: a1, noun: "@x1", head: To, object: "@x2"}
        - {t: acquisition, id: e1, verb: find, acquirer: "@n1", object: "@x1", tense: past}
    - category: abstain
      text: "The ferret in the barn slept."
      expected: {abstain: true, template: locative}                   # a place phrase inside a noun phrase
    - category: positive
      note: an indefinite with a class-level object inside — without any lid, a bare lemma
      text: "Teodor bought a thermos without a lid."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: thermos}
        - {t: postmodifier, id: a1, noun: "@x1", head: Without, object: lid}
        - {t: acquisition, id: e1, verb: buy, acquirer: "@n1", object: "@x1", tense: past}
    - category: positive
      note: the object of an event noun
      text: "The destruction of the shed upset Teodor."
      instances:
        - {t: witness, id: x1, class: destruction, definite: true}
        - {t: witness, id: x2, class: shed, definite: true}
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: postmodifier, id: a1, noun: "@x1", head: Of, object: "@x2"}
        - {t: psych, id: p1, verb: upset, experiencer: "@n1", stimulus: "@x1", tense: past}
    - category: positive
      note: a postmodifier on an object
      text: "Yusra saw the man with the hat."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: man, definite: true}
        - {t: witness, id: x2, class: hat, definite: true}
        - {t: postmodifier, id: a1, noun: "@x1", head: With, object: "@x2"}
        - {t: perception, id: p1, verb: see, perceiver: "@n1", stimulus: "@x1", tense: past}
    - category: scoped
      note: an indefinite under negation carries its phrase inside
      text: "Yusra did not read a book about ferrets."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: book}
        - {t: postmodifier, id: a1, noun: "@x1", head: About, object: ferret}
        - {t: activity, id: v1, verb: read, actor: "@n1", patient: "@x1", tense: past}
        - {t: negation, id: s1, over: ["@v1"]}
    - category: abstain
      text: "Lamine washed the quilt of Teodor."
      expected: {abstain: true, template: witness}                    # a possessive of-phrase
    - category: abstain
      text: "Teodor voted against the plan."
      expected: {abstain: true, template: oblique}                    # a phrase on the clause
    - category: abstain
      text: "Yusra drank a cup of tea."
      expected: {abstain: true, template: measure}                   # a measure or container
    - category: positive
      note: a kind word said of a name — the copular kind, the of-phrase Of on the name, its noun's mods
      text: "Marenthia is a genus of water ferns."
      instances:
        - {t: named-entity, id: n1, name: "Marenthia"}
        - {t: copular, id: c1, subject: "@n1", predicate: genus, form: noun, tense: present}
        - {t: postmodifier, id: a1, noun: "@n1", head: Of, object: fern, object_mods: [water]}
    - category: positive
      note: an adjective on a bare-lemma object — its props
      text: "Corvisia is a genus of aquatic beetles."
      instances:
        - {t: named-entity, id: n1, name: "Corvisia"}
        - {t: copular, id: c1, subject: "@n1", predicate: genus, form: noun, tense: present}
        - {t: postmodifier, id: a1, noun: "@n1", head: Of, object: beetle, object_props: [aquatic]}
    - category: positive
      note: between two — one phrase, the second in object2
      text: "The feud between Lamine and Teodor ended."
      instances:
        - {t: witness, id: x1, class: feud, definite: true}
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Teodor"}
        - {t: postmodifier, id: a1, noun: "@x1", head: Between, object: "@n1", object2: "@n2"}
        - {t: change-of-state, id: e1, verb: end, undergoer: "@x1", tense: past}
