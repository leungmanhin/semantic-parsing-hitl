# Template: locative  (where a thing is: "the ledger is on the workbench", "Calderwick is in Norfolk")
#
# A clause that locates a thing, not an event: "be" or "be located" with a place phrase, or
# "there is a <thing> <place phrase>". The atom relates the two referents directly — (LocatedIn
# thing place) for in / at / inside / within, the preposition's own head otherwise ((On thing
# place), (Under …), (From …) for an origin) — with tense, negation and modality as operators over
# it, as for a copular predication. No event is minted for a plain clause: being somewhere is a
# state of the thing; when a time, a duration, a relation, a link or a focus names the predication,
# the state of the fact holding is minted on demand — (Holds sk_located_1 (LocatedIn sk_yusra_1
# sk_barn_1)) — and the attachment hangs on it.

id: locative
family: predication
shape: copular
title: Where a thing is
status: draft

trigger:
  construction: >
    A clause whose main verb is "be" (or "be located", "be situated") and whose predicate is a
    place phrase: the ledger is on the workbench, Brackenford is in Westmarch, the coin was under the
    blanket, there is a trowel on the workbench, Henrike is from Brackenford. The subject is the thing
    located; the object of the preposition is the place. A place phrase inside a noun phrase (the
    ledger on the workbench, a village in Westmarch) is a locative of that thing too, in the present.
    A container verb with a separate thing inside — the chest contains a postcard, the drawer holds a
    key — locates the thing in the container: head LocatedIn, the verb recorded as the
    preposition, the thing in `thing` and the container in `place`. A DIRECTION FROM A LANDMARK
    (the well is west of the granary) is head DirectionFrom with the compass word in `direction`;
    a distance on it (three miles south of the granary) is a measure on this instance (dimension
    distance; the program mints the state of the fact holding). BEING WITH SOMEONE (the badgers are
    with a stork) is the company a thing is in: head With, the companion in `place`. A PLACE WORD with no object (the
    barrow is outdoors, a blanket left outside) is itself the place: head LocatedIn, the word as
    written in `place` and in `preposition`.
  surface_forms:
    - "<thing> is in / at / on / under … <place>"     # the ledger is on the workbench
    - "there is <thing> <place phrase>"               # there is a trowel on the workbench
    - "<thing> is located / situated in <place>"      # the granary is located in Brackenford
    - "<thing> is from <place>"                       # Henrike is from Brackenford
    - "<thing> is <compass word> of <place>"          # the well is west of the granary: DirectionFrom, direction west
    - "<thing> <place phrase>"                        # a village in Westmarch (inside a noun phrase)
  boundary:                   # looks like a locative but is not one
    - >-
      the place of an EVENT — laughed in the granary, waited at the hatch: an attachment to that
      event, not a locative
    - >-
      in with a garment or a colour on a person or an animal — a stork in a red cap, badgers in
      blue and grey: what the referent wears, not where it is: the postmodifier template, head In
    - >-
      nearby with no place named (a nearby farm): no slot; report it as unmapped
    - >-
      a verb of residence or posture — lives in Brackenford, stood by the door, lay on the
      workbench: the verb's own event with a location attachment
    - >-
      a spatial relation stated by a verb — faces the river, borders the marsh, surrounds the
      house, overlooks the field: a stative relation between the two things
    - >-
      a destination or an origin of a motion — went to the bazaar, came from the granary: the
      motion's goal or source
    - >-
      a class predicate — Brackenford is a village: a copular predication; "Brackenford is a village
      in Westmarch" is a copular predication and a locative on the same subject
    - >-
      a time — the session is at noon, the inspection is in May: a time, not a place
    - >-
      a non-spatial in / on / at — in trouble, in love, on alert, at war: a state, not a place;
      report the phrase as unmapped
    - >-
      membership, a part or a constituent — on the committee, a member of the fellowship, the lid
      of the chest, the broth contains pepper: a part-whole relation, not a place
    - >-
      between two times — between May and June: a window of time, the time-relation template
      (between two places — between the granary and the hut — is head Between, the second place in
      `place2`)

slots:
  id:          {type: id, required: true, doc: "your label for the predication (l1, l2 …)"}
  thing:       {type: filler, class: Entity, required: true,
                doc: "the thing located: a referent id (a name, a witness, a group)"}
  place:       {type: filler, class: Entity, required: true,
                doc: "the place: a referent id (a witness for the workbench, a name for Westmarch), a bare lemma for a class-level place, or a place word with no object, as written (the barrow is outdoors: outdoors)"}
  place2:      {type: filler, class: Entity, required: false, only_when: "head == Between",
                doc: "with head Between only, the second of the two places (between the granary and the hut: the hut); the order as written"}
  direction:   {type: enum, class: Class, values: [north, south, east, west, northeast, northwest, southeast, southwest], required: false, only_when: "head == DirectionFrom",
                doc: "with head DirectionFrom only, the compass direction of the thing from the place, as one word (west of the granary: west; north-east of: northeast)"}
  head:        {type: enum, values: [LocatedIn, "On", Near, NextTo, By, Under, Over, Above, Below, Behind, InFrontOf, Beside, Alongside, Between, Outside, Opposite, From, With, DirectionFrom], required: true,
                doc: "LocatedIn for in / at / inside / within; otherwise the preposition itself, capitalized (on → On, under → Under), a multi-word one CamelCased (in front of → InFrontOf, next to → NextTo); From for an origin (is from); With for company (is with a stork)"}
  preposition: {type: string, required: true, doc: "the preposition as written (in, on, under, from …)"}
  tense:       {type: enum, values: [past, present, future], required: true,
                doc: "the clause's tense; present is recorded, not inferred; present for a place phrase inside a noun phrase"}
  aspect:      {type: enum, values: [simple, progressive, perfect], required: false, default: simple}

mints: {id: Event, literal: located, on_demand: true}      # the state of the fact holding, only when something attaches

emits:
  - atom: "({head} {thing} {place} {place2|opt} {direction|opt})"
    when: "tense == present and aspect != perfect and aspect != progressive"
  - atom: "(Past ({head} {thing} {place} {place2|opt} {direction|opt}))"
    when: "tense == past or aspect == perfect"
  - atom: "(Future ({head} {thing} {place} {place2|opt} {direction|opt}))"
    when: "tense == future"
  - atom: "(Ongoing ({head} {thing} {place} {place2|opt} {direction|opt}))"
    when: "aspect == progressive"
  # an anchored predication: the state of the fact holding, minted only when something attaches
  - atom: "(Holds @id ({head} {thing} {place} {place2|opt} {direction|opt}))"
    if_minted: true
    state: true
  - atom: "(Past @id)"
    if_minted: true
    when: "tense == past or aspect == perfect"
  - atom: "(Future @id)"
    if_minted: true
    when: "tense == future"

notes:
  - >-
    No event is minted: the atom relates the thing and the place, and tense, negation and
    modality are operators over it, as for a copular predication. In, at, inside and within
    render as LocatedIn, the substrate's static-location relation; the other prepositions keep
    their own head, as the legacy output did, and the word itself is kept in the instance.
  - >-
    "There is a ledger on the workbench" introduces the ledger as an indefinite witness and
    locates it: the existence is the witness's, the location this predication's.

depends_on: [named-entity, witness, group]
composes_with: [negation, modal]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: on keeps its own head
      text: "The ledger is on the workbench."
      instances:
        - {t: witness, id: x1, class: ledger, definite: true, span: "The ledger"}
        - {t: witness, id: x2, class: workbench, definite: true, span: "the workbench"}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: "On", preposition: "on", tense: present, span: "The ledger is on the workbench"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Member sk_ledger_1 ledger)"
        - "(Member sk_workbench_1 workbench)"
        - "(On sk_ledger_1 sk_workbench_1)"
      declarations:
        - "(: ledger Class)"
        - "(: sk_ledger_1 Entity)"
        - "(: sk_workbench_1 Entity)"
        - "(: workbench Class)"
    - category: positive
      note: in renders as LocatedIn; two names
      text: "Brackenford is in Westmarch."
      instances:
        - {t: named-entity, id: n1, name: "Brackenford", span: "Brackenford"}
        - {t: named-entity, id: n2, name: "Westmarch", span: "Westmarch"}
        - {t: locative, id: l1, thing: "@n1", place: "@n2", head: LocatedIn, preposition: in, tense: present, span: "Brackenford is in Westmarch"}
    - category: abstain
      text: "Marisol laughed in the granary."
      expected: {abstain: true, template: location}                   # the place of an event
    - category: abstain
      text: "Pieter is a locksmith."
      expected: {abstain: true, template: copular}                    # a class predicate

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: being with someone — the company a thing is in, head With
      text: "Yusra was with a potter."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: potter}
        - {t: locative, id: l1, thing: "@n1", place: "@x1", head: With, preposition: with, tense: past}
    - category: positive
      note: a container verb — the thing is in the container, the verb recorded as the preposition
      text: "The box contains a letter."
      instances:
        - {t: witness, id: x1, class: box, definite: true}
        - {t: witness, id: x2, class: letter}
        - {t: locative, id: l1, thing: "@x2", place: "@x1", head: LocatedIn, preposition: contains, tense: present}
    - category: positive
      note: a place phrase inside a noun phrase — a locative of that thing, in the present
      text: "The ferret in the barn slept."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: witness, id: x2, class: barn, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: LocatedIn, preposition: in, tense: present}
        - {t: activity, id: v1, verb: sleep, actor: "@x1", tense: past}
    - category: positive
      note: an existential — the thing is an indefinite witness
      text: "There is a ledger on the workbench."
      instances:
        - {t: witness, id: x1, class: ledger}
        - {t: witness, id: x2, class: workbench, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: "On", preposition: "on", tense: present}
    - category: positive
      note: past tense, under
      text: "The key was under the mat."
      instances:
        - {t: witness, id: x1, class: key, definite: true}
        - {t: witness, id: x2, class: mat, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: Under, preposition: under, tense: past}
    - category: contrast
      note: the preposition — the instances differ in the head and the word only
      text: "The key was on the mat."
      instances:
        - {t: witness, id: x1, class: key, definite: true}
        - {t: witness, id: x2, class: mat, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: "On", preposition: "on", tense: past}
    - category: positive
      note: an origin
      text: "Yusra is from Calderwick."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: named-entity, id: n2, name: "Calderwick"}
        - {t: locative, id: l1, thing: "@n1", place: "@n2", head: From, preposition: from, tense: present}
    - category: positive
      note: be located
      text: "The barn is located in Calderwick."
      instances:
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: named-entity, id: n1, name: "Calderwick"}
        - {t: locative, id: l1, thing: "@x1", place: "@n1", head: LocatedIn, preposition: in, tense: present}
    - category: positive
      text: "The barn is near the market."
      instances:
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: witness, id: x2, class: market, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: Near, preposition: near, tense: present}
    - category: positive
      note: next to — a multi-word preposition, its words CamelCased as the head
      text: "The anvil is next to the stove."
      instances:
        - {t: witness, id: x1, class: anvil, definite: true}
        - {t: witness, id: x2, class: stove, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: NextTo, preposition: "next to", tense: present}
    - category: positive
      note: a place word with no object — the word itself is the place, LocatedIn
      text: "The ferret is outdoors."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: outdoors, head: LocatedIn, preposition: outdoors, tense: present}
    - category: positive
      note: a named thing
      text: "Teodor is in the barn."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: locative, id: l1, thing: "@n1", place: "@x1", head: LocatedIn, preposition: in, tense: present}
    - category: positive
      note: a possessed thing
      text: "Lamine's quilt is in the shed."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: quilt, possessor: "@n1"}
        - {t: witness, id: x2, class: shed, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: LocatedIn, preposition: in, tense: present}
    - category: positive
      note: a class predicate and a locative on the same subject
      text: "Calderwick is a village in Norfolk."
      instances:
        - {t: named-entity, id: n1, name: "Calderwick"}
        - {t: named-entity, id: n2, name: "Norfolk"}
        - {t: copular, id: c1, subject: "@n1", predicate: village, form: noun, tense: present}
        - {t: locative, id: l1, thing: "@n1", place: "@n2", head: LocatedIn, preposition: in, tense: present}
    - category: scoped
      note: under clausal negation
      text: "The thermos is not in the barn."
      instances:
        - {t: witness, id: x1, class: thermos, definite: true}
        - {t: witness, id: x2, class: barn, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: LocatedIn, preposition: in, tense: present}
        - {t: negation, id: s1, over: ["@l1"]}
    - category: scoped
      note: under a modal
      text: "The ferret might be in the shed."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: witness, id: x2, class: shed, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: LocatedIn, preposition: in, tense: present}
        - {t: modal, id: s1, over: ["@l1"], head: Might, surface: might}
    - category: abstain
      text: "Lamine entered the shed."
      expected: {abstain: true, template: motion}                     # a motion's goal
    - category: abstain
      text: "The meeting is at noon."
      expected: {abstain: true, template: time}                       # a time, not a place
    - category: abstain
      text: "Lamine is in trouble."
      expected: {abstain: true, gap: G00, span: "in trouble"}         # a state, not a place
    - category: positive
      note: a place between two — head Between, the second in place2
      text: "Calderwick is between the river and the hills."
      instances:
        - {t: named-entity, id: n1, name: "Calderwick"}
        - {t: witness, id: x1, class: river, definite: true}
        - {t: group, id: g1, class: hill, definite: true}
        - {t: locative, id: l1, thing: "@n1", place: "@x1", place2: "@g1", head: Between, preposition: between, tense: present}
    - category: positive
      note: a direction from a landmark — DirectionFrom with the compass word
      text: "The mill is east of the bridge."
      instances:
        - {t: witness, id: x1, class: mill, definite: true}
        - {t: witness, id: x2, class: bridge, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: DirectionFrom, direction: east, preposition: east of, tense: present}
    - category: positive
      note: a distance on the direction — a measure on the locative, its state minted
      text: "The barn is two miles north of the mill."
      instances:
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: witness, id: x2, class: mill, definite: true}
        - {t: locative, id: l1, thing: "@x1", place: "@x2", head: DirectionFrom, direction: north, preposition: north of, tense: present}
        - {t: measure, id: m1, event: "@l1", head: Measure, dimension: distance, magnitude: 2, unit: mile}
