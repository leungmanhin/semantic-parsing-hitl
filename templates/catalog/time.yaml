# Template: time  (when an event takes place: a date, a clock time, a weekday, a named time)
#
# A time expression on a clause attaches a time instance to the clause's event: (Time event t),
# with the time described by its fields — (Year t 2019), (Month t may), (Day t 3), (Weekday t
# monday), (Hour t 15), (Minute t 30) — or named by a word that is the time's own symbol ((Time
# event dawn), (Time event night)), or, for a deictic (yesterday, tomorrow, last week), related
# by an offset to the text's reference time, the reserved instance now: (Time event t) (BeforeBy
# t now 1 day) — a measured distance (three days ago, two weeks after the audit) is the same
# offset with a number. Like a location, the attachment is part of the clause: negated, modalised
# and generalised with the event. Relations with no measured distance (before, after, until,
# since, during), frequencies and durations are not this template.

id: time
family: attachment
shape: attachment
title: The time at which an event takes place
status: draft

trigger:
  construction: >
    A time expression saying when the clause's event takes place: a calendar date or any part of
    one (in 2019, in May, on 3 May 2019, on Monday), a clock time (at 3 pm, at 2:30 pm, at noon,
    at midnight), a deictic relative to the moment the text speaks from (now, today, tonight,
    yesterday, tomorrow, last / this / next week, month or year), a time named by a word (at
    dawn, at night, in autumn, later, this morning), a measured distance from an anchor (three
    days ago, a year ago, in two weeks, two days after the audit, a week later), or an anaphoric
    phrase naming a time by one the text stated before it (that evening, the same day, the next
    day, the following morning, the week after). The event is parsed with its own template; the
    time instance names that event and describes the time: a date or a clock time by its fields
    (year, month, day, weekday, hour, minute), a deictic by the `deictic` word with the reference
    time as its anchor, a measured distance by its `offset`, `unit` and `direction` from its
    anchor (the reference time for ago / from now / in n units; a stated event or time for before
    / after it and for later / earlier), an anaphoric phrase likewise from the antecedent event or
    time (offset 0 for that / the same, 1 for next / following / after, a day part as a second
    instance), a named time by its name. One instance per time expression; a day part beside a
    date or an offset (Monday morning, the following morning) is a second instance. A time no
    clause places an event at — the reference of a time relation (before noon), the edge of a
    window (within three days) — is an instance with no event. When the time is predicated of
    an event noun by "be" (the meeting is at noon, the audit was on Monday), the noun is a witness
    marked eventive, the time attaches to it, and this instance records the clause's tense.
  surface_forms:
    - "<clause> in <year / month>"                   # arrived in 2019; left in May
    - "<clause> on <date / weekday>"                 # baked a loaf on 3 May 2019; sold the spindle on Monday
    - "<clause> at <clock time>"                     # left at 3 pm; arrived at noon
    - "<clause> <deictic>"                           # laughed yesterday; will leave tomorrow; left last week
    - "<clause> <named time>"                        # slept at night; sang at dawn
    - "<time>, <clause>"                             # In 2019, Teodor arrived
    - "<event noun> is / was at / on <time>"         # the meeting is at noon; the audit was on Monday
    - "<clause> <n> <units> ago / later / earlier"   # left three days ago; a week later, Teodor left
    - "<clause> in <n> <units>"                      # will leave in two weeks
    - "<clause> <n> <units> before / after <event or time>"   # arrived two days after the audit
    - "<clause>. That / the same <day part or unit>, <clause>"   # Lamine sang. That evening, Yusra left: offset 0 from the singing, plus evening
    - "<clause>. The next / following <unit or day part>, <clause>"   # The following morning, Yusra left: offset 1 day, plus morning
  boundary:                   # looks like the time of an event but is not one
    - >-
      a relation with no measured distance — before the audit, after noon, until noon, since
      May, by Monday, during the meeting, while Yusra sang: a time relation
    - >-
      a frequency or a schedule — every day, every morning, on Sundays as a habit, twice a week:
      a frequency (a period of one unit is a range over its class, not a time instance); a clock
      time or a date beside it — at noon every day — is a time instance on the event
    - >-
      a duration — for six hours, lasted two days: the measure template, not a time
    - >-
      a decade, a century or an era — in the 1990s, in the 19th century: no slot yet; reported
      as unmapped
    - >-
      an approximate time — around noon, about 3 pm: record the time, report the approximator
      as unmapped
    - >-
      a place — in the barn, at the market: a location
    - >-
      tense alone — arrived, will arrive: the event's own template records it; a time instance
      needs a time expression

slots:
  id:      {type: id, required: true, doc: "your label for the time (t1, t2 …)"}
  event:   {type: filler, class: Event, attaches: true, required: false,
            doc: "the event the time attaches to: the id of the clause's predication instance, or of an eventive witness when the time is predicated of an event noun (the meeting is at noon); absent only for a time no clause places an event at"}
  deictic: {type: enum, values: [now, today, tonight, yesterday, tomorrow, last_week, this_week, next_week, last_month, this_month, next_month, last_year, this_year, next_year], required: false,
            doc: "a time relative to the moment the text speaks from, as one of the listed words (last Tuesday or two days ago are not deictics here); fill no field beside it"}
  anchor:  {type: filler, class: TimeTerm, required: false, default: "@now",
            doc: "what a deictic or an offset is relative to: \"@now\" (the reserved id; the program supplies the instance) for a deictic and for ago / from now / in n units; the id of a time instance or of an event (a predication, an eventive witness) for an offset before / after it or for later / earlier, when the text states the anchor; the antecedent event or stated time of an anaphoric phrase (that evening: the previous clause's event)"}
  name:    {type: lemma, class: TimeTerm, required: false,
            doc: "a time named by a word or a fixed phrase that no deictic word covers, lowercase, joined with underscores: dawn, dusk, morning, afternoon, evening, night, spring, summer, autumn, winter, later, this_morning; fill no field beside it"}
  offset:  {type: number, required: false,
            doc: "a measured distance from the anchor: the number of units (three days ago → 3, a week later → 1, that evening → 0 day); fill unit and direction with it, no calendar field"}
  unit:    {type: lemma, class: Class, required: false,
            doc: "the unit of the offset, singular and lowercase: minute, hour, day, week, month, year"}
  direction: {type: enum, values: [before, after], required: false,
            doc: "before when the time precedes its anchor (ago, earlier, before it), after when it follows (from now, in n units, later, after it) and for the same period as the anchor (that evening, the same day: offset 0)"}
  year:    {type: int, required: false, doc: "the calendar year (2019)"}
  month:   {type: lemma, class: Class, required: false, doc: "the month name, lowercase (may)"}
  day:     {type: int, required: false, doc: "the day of the month (3)"}
  weekday: {type: lemma, class: Class, required: false, doc: "the weekday name, lowercase (monday)"}
  hour:    {type: int, required: false, doc: "the clock hour in 24-hour form (3 pm → 15, noon → 12, midnight → 0)"}
  minute:  {type: int, required: false, doc: "the clock minute (2:30 → 30); absent for a whole hour"}
  tense:   {type: enum, values: [past, present, future], required: false,
            doc: "only when the time is predicated of an event noun by be (the meeting was at noon): the clause's tense; otherwise absent, the event's own template records it"}

mints: {id: TimeTerm, symbol: name, constant: true, literal: time}   # a named time is its word; otherwise sk_time_n (a date, a clock time, a deictic, an offset)

emits:
  - atom: "(Time {event} @id)"
    if_filled: event
  - atom: "(Year @id {year})"
    if_filled: year
  - atom: "(Month @id {month})"
    if_filled: month
  - atom: "(Day @id {day})"
    if_filled: day
  - atom: "(Weekday @id {weekday})"
    if_filled: weekday
  - atom: "(Hour @id {hour})"
    if_filled: hour
  - atom: "(Minute @id {minute})"
    if_filled: minute
  - atom: "(BeforeBy @id {anchor} 0 hour)"                 # now: the reference moment itself
    when: "deictic == now"
    declare: {hour: Class}
  - atom: "(BeforeBy @id {anchor} 0 day)"                  # today, tonight: the reference day
    when: "deictic == today or deictic == tonight"
    declare: {day: Class}
  - atom: "(Time {event} night)"                           # tonight: the night of it
    when: "deictic == tonight"
    if_filled: event
    declare: {night: TimeTerm}
  - atom: "(BeforeBy @id {anchor} 1 day)"                  # yesterday: one day before
    when: "deictic == yesterday"
    declare: {day: Class}
  - atom: "(BeforeBy {anchor} @id 1 day)"                  # tomorrow: one day after
    when: "deictic == tomorrow"
    declare: {day: Class}
  - atom: "(BeforeBy @id {anchor} 1 week)"
    when: "deictic == last_week"
    declare: {week: Class}
  - atom: "(BeforeBy @id {anchor} 0 week)"
    when: "deictic == this_week"
    declare: {week: Class}
  - atom: "(BeforeBy {anchor} @id 1 week)"
    when: "deictic == next_week"
    declare: {week: Class}
  - atom: "(BeforeBy @id {anchor} 1 month)"
    when: "deictic == last_month"
    declare: {month: Class}
  - atom: "(BeforeBy @id {anchor} 0 month)"
    when: "deictic == this_month"
    declare: {month: Class}
  - atom: "(BeforeBy {anchor} @id 1 month)"
    when: "deictic == next_month"
    declare: {month: Class}
  - atom: "(BeforeBy @id {anchor} 1 year)"
    when: "deictic == last_year"
    declare: {year: Class}
  - atom: "(BeforeBy @id {anchor} 0 year)"
    when: "deictic == this_year"
    declare: {year: Class}
  - atom: "(BeforeBy {anchor} @id 1 year)"
    when: "deictic == next_year"
    declare: {year: Class}
  - atom: "(BeforeBy @id {anchor} {offset} {unit})"       # three days ago: the time precedes its anchor by the offset
    if_filled: offset
    when: "direction == before"
  - atom: "(BeforeBy {anchor} @id {offset} {unit})"       # in two weeks, a week later: the anchor precedes the time
    if_filled: offset
    when: "direction == after"
  - atom: "(Member @id day)"                               # the stated granularity: a calendar day, a weekday, a day deictic
    when: "day or weekday or deictic == today or deictic == tonight or deictic == yesterday or deictic == tomorrow"
    declare: {day: Class}
  - atom: "(Member @id week)"
    when: "deictic == last_week or deictic == this_week or deictic == next_week"
    declare: {week: Class}
  - atom: "(Member @id month)"                             # a month with no day
    when: "month and not day and not weekday or deictic == last_month or deictic == this_month or deictic == next_month"
    declare: {month: Class}
  - atom: "(Member @id year)"                              # a bare year
    when: "year and not month and not day and not weekday or deictic == last_year or deictic == this_year or deictic == next_year"
    declare: {year: Class}
  - atom: "(Member @id {unit})"                            # an offset: the unit it is counted in
    if_filled: offset
  - atom: "(Past {event})"
    if_filled: event
    when: "tense == past"
  - atom: "(Future {event})"
    if_filled: event
    when: "tense == future"

notes:
  - >-
    A time is an instance of its own, described by field atoms, so that two events on the same
    date share nothing but their fields and a later relation (before, until, during) can hold
    between time instances; a named time (dawn, night) is a shared constant — every "night" in an
    item is the one symbol.
  - >-
    A deictic is not resolved by the parser: it is recorded as the word and rendered as an offset
    from the reference time — (BeforeBy t now 1 day) for yesterday — so that a reasoner resolves
    it against the anchor's calendar fields, and a revised reference time revises every deictic
    at once. Two "yesterday"s are two instances with the same offset.
  - >-
    A measured distance is a deictic with a number: three days ago is the time three days before
    the anchor — (BeforeBy t now 3 day) — and the same rules that resolve yesterday resolve it;
    two days after the audit is a time two days after that event, (BeforeBy sk_audit_1 t 2 day).
    The event sits at the time, (Time e t), so how long before now, or before another event, an
    event took place is a question over the times.
  - >-
    A time instance states its granularity as a class — (Member t day) for a date, a weekday or
    a day deictic, (Member t week) for a week deictic, (Member t month) for a month alone,
    (Member t year) for a bare year, the offset's unit for an offset — so that a rule over the
    days or the weeks (every day, twice a week) instantiates at a stated time. Nothing is
    computed: the class is read off the fields the text gives.
  - >-
    An anaphoric phrase is the same offset from its antecedent: that evening is 0 days from the
    previous clause's event with evening as a second instance, the following morning 1 day after
    it with morning; a stated date as the antecedent (arrived on Monday; the next day …) makes
    that time instance the anchor.
  - >-
    The attachment is rendered wherever its event is rendered: "Teodor did not arrive in 2019"
    denies the dated arrival as a whole, and a generalization carries the time into its rule.

depends_on: [witness, reference-time]
composes_with: [negation, modal, generic, distribution, time-relation]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: a deictic — an offset from the reference time, which the program supplies as `now`
      text: "Yusra laughed yesterday."
      instances:
        - {t: named-entity, id: n1, name: "Yusra", span: "Yusra"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: past, span: "Yusra laughed"}
        - {t: time, id: t1, event: "@v1", deictic: yesterday, anchor: "@now", span: "yesterday"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_yusra_1 \"Yusra\")"
        - "(Member sk_laugh_1 laugh)"
        - "(Agent sk_laugh_1 sk_yusra_1)"
        - "(Past sk_laugh_1)"
        - "(Time sk_laugh_1 sk_time_1)"
        - "(BeforeBy sk_time_1 sk_now_1 1 day)"
        - "(Member sk_time_1 day)"
      declarations:
        - "(: day Class)"
        - "(: laugh Class)"
        - "(: sk_laugh_1 Event)"
        - "(: sk_now_1 TimeTerm)"
        - "(: sk_time_1 TimeTerm)"
        - "(: sk_yusra_1 Entity)"
    - category: positive
      note: a weekday — a time instance described by a field
      text: "Lamine sold the spindle on Monday."
      instances:
        - {t: named-entity, id: n1, name: "Lamine", span: "Lamine"}
        - {t: witness, id: x1, class: spindle, definite: true, span: "the spindle"}
        - {t: transfer, id: e1, verb: sell, giver: "@n1", object: "@x1", tense: past, span: "Lamine sold the spindle"}
        - {t: time, id: t1, event: "@e1", weekday: monday, span: "on Monday"}
    - category: positive
      note: a measured distance from the reference time — a deictic with a number
      text: "Three days ago, Yusra left."
      instances:
        - {t: named-entity, id: n1, name: "Yusra", span: "Yusra"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past, span: "Yusra left"}
        - {t: time, id: t1, event: "@m1", offset: 3, unit: day, direction: before, anchor: "@now", span: "Three days ago"}
    - category: abstain
      text: "Yusra laughed in the barn."
      expected: {abstain: true, template: location}                   # a place

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: a year
      text: "Teodor arrived in 2019."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: past}
        - {t: time, id: t1, event: "@m1", year: 2019}
    - category: positive
      note: a time predicated of an event noun — the witness is eventive, the clause's tense recorded here
      text: "The meeting is at noon."
      instances:
        - {t: witness, id: x1, class: meeting, definite: true, eventive: true}
        - {t: time, id: t1, event: "@x1", hour: 12, tense: present}
    - category: positive
      note: a full date — one instance, three fields
      text: "Lamine baked a loaf on 3 May 2019."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: loaf}
        - {t: creation, id: e1, verb: bake, creator: "@n1", product: "@x1", tense: past}
        - {t: time, id: t1, event: "@e1", year: 2019, month: may, day: 3}
    - category: positive
      note: a named day part
      text: "Ottoline sang at dawn."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: past}
        - {t: time, id: t1, event: "@v1", name: dawn}
    - category: positive
      note: a deictic after the reference time, with a future event
      text: "Teodor will leave tomorrow."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: future}
        - {t: time, id: t1, event: "@m1", deictic: tomorrow, anchor: "@now"}
    - category: positive
      note: a deictic with the reference date known — the anchor carries the calendar, the offset is zero
      text: "Lamine baked bread today."
      reference_time: "2026-10-18"
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: creation, id: e1, verb: bake, creator: "@n1", product: bread, tense: past}
        - {t: time, id: t1, event: "@e1", deictic: today, anchor: "@now"}
    - category: positive
      note: a week-level deictic
      text: "Ottoline sold the quilt last week."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: witness, id: x1, class: quilt, definite: true}
        - {t: transfer, id: e1, verb: sell, giver: "@n1", object: "@x1", tense: past}
        - {t: time, id: t1, event: "@e1", deictic: last_week, anchor: "@now"}
    - category: positive
      note: a clock time in 24-hour form
      text: "Yusra left at 3 pm."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past}
        - {t: time, id: t1, event: "@m1", hour: 15}
    - category: positive
      note: hour and minute
      text: "Lamine arrived at 2:30 pm."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: past}
        - {t: time, id: t1, event: "@m1", hour: 14, minute: 30}
    - category: positive
      note: a weekday and a day part — two instances
      text: "Teodor arrived on Monday morning."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: past}
        - {t: time, id: t1, event: "@m1", weekday: monday}
        - {t: time, id: t2, event: "@m1", name: morning}
    - category: positive
      note: an event noun in the past — the tense lands on the eventive witness
      text: "The audit was on Monday."
      instances:
        - {t: witness, id: x1, class: audit, definite: true, eventive: true}
        - {t: time, id: t1, event: "@x1", weekday: monday, tense: past}
    - category: optional
      note: a fronted time
      text: "In 2019, Teodor arrived."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: past}
        - {t: time, id: t1, event: "@m1", year: 2019}
    - category: scoped
      note: under clausal negation — the dated arrival is denied as a whole
      text: "Teodor did not arrive in 2019."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: past}
        - {t: time, id: t1, event: "@m1", year: 2019}
        - {t: negation, id: s1, over: ["@m1"]}
    - category: scoped
      note: under a modal
      text: "Lamine might leave on Monday."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: present}
        - {t: time, id: t1, event: "@m1", weekday: monday}
        - {t: modal, id: s1, over: ["@m1"], head: Might, surface: might}
    - category: scoped
      note: inside a generalization — the named time is a constant in the rule
      text: "Every ferret slept at night."
      instances:
        - {t: range, id: q1, class: ferret, quantifier: every, predicate: sleep}
        - {t: activity, id: v1, verb: sleep, actor: "@q1", tense: past}
        - {t: time, id: t1, event: "@v1", name: night}
        - {t: generic, id: r1, ranges: ["@q1"], over: ["@v1"]}
    - category: positive
      note: a distance after the reference time
      text: "Lamine will leave in two weeks."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: future}
        - {t: time, id: t1, event: "@m1", offset: 2, unit: week, direction: after, anchor: "@now"}
    - category: positive
      note: a distance from a stated event — the anchor is the eventive witness
      text: "Yusra arrived two days after the audit."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: audit, definite: true, eventive: true}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: past}
        - {t: time, id: t1, event: "@m1", offset: 2, unit: day, direction: after, anchor: "@x1"}
    - category: positive
      note: a distance from the previous clause's event — the anchor is that event
      text: "Lamine sang. A week later, Teodor left."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Teodor"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: past}
        - {t: motion, id: m1, verb: leave, mover: "@n2", tense: past}
        - {t: time, id: t1, event: "@m1", offset: 1, unit: week, direction: after, anchor: "@v1"}
    - category: positive
      note: one unit with no number word
      text: "Ottoline left a year ago."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past}
        - {t: time, id: t1, event: "@m1", offset: 1, unit: year, direction: before, anchor: "@now"}
    - category: positive
      note: an anaphoric phrase — the same day as the previous clause's event, a day part beside it
      text: "Lamine sang. That evening, Yusra left."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: past}
        - {t: motion, id: m1, verb: leave, mover: "@n2", tense: past}
        - {t: time, id: t1, event: "@m1", offset: 0, unit: day, direction: after, anchor: "@v1"}
        - {t: time, id: t2, event: "@m1", name: evening}
    - category: positive
      note: the following morning — one day after the antecedent event, plus the day part
      text: "Lamine sang. The following morning, Yusra left."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: past}
        - {t: motion, id: m1, verb: leave, mover: "@n2", tense: past}
        - {t: time, id: t1, event: "@m1", offset: 1, unit: day, direction: after, anchor: "@v1"}
        - {t: time, id: t2, event: "@m1", name: morning}
    - category: positive
      note: the next day after a stated date — the anchor is that time instance
      text: "Teodor arrived on Monday. The next day, Lamine left."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
