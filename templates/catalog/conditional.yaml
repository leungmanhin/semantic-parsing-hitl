# Template: conditional  (an indicative conditional: "If Lamine sings, Yusra leaves", "The ladder is brittle when cold", "Herons are patient if the weather is sunny")
#
# An indicative conditional is a rule: if the condition holds, the consequence does. With an
# eventive condition the rule ranges over the condition's events — every singing by Lamine —
# and the consequence has its own event per case:
#   (Implication (And (Member $e sing) (Agent $e sk_lamine_1)) (And (Member (sk_leave $e) leave) (Agent (sk_leave $e) sk_yusra_1)))
# With a stative condition on an individual the rule holds between the states: (Implication
# (Member sk_ladder_1 cold) (Member sk_ladder_1 brittle)). A class subject is a range, and the
# rule has its member among the premises. Neither clause is asserted. A counterfactual (if
# Lamine had sung, Yusra would have left) is another template; "unless" and "if not" have no
# form yet, since a rule premise cannot say that something is not the case.

id: conditional
family: rule
shape: rule
title: An indicative conditional

trigger:
  construction: >
    "If P, Q" and its kin — if … then, provided that, as long as, in case, even if — and a
    stative when-clause (the ladder is brittle when cold; Teodor is grumpy when tired). Parse
    the condition with its own template (a predication for an event — Lamine sings; a copular
    instance for a state — cold, open, tired, with the subject it is said of) and the consequence
    with its own (a predication, or a negation or modal over it, or a copular instance for a
    state), and name them in `condition` and `over`. With an eventive condition the rule ranges
    over the condition's events, and the consequence's event is a function of each; with a
    stative condition the rule holds between the states as stated. When the subject is a class —
    herons are patient if the weather is sunny — it is a range instance listed in `ranges`, the
    consequence a copular instance over it, and `generic: true` marks a bare plural (no
    quantifier word). The mood is indicative: the clauses are real possibilities; a subjunctive
    (if Lamine had sung, Yusra would have left; if Yusra sang, Teodor would leave) is a
    counterfactual. The span is the whole sentence.
  surface_forms:
    - "If <P>, <Q> / <Q> if <P>"                           # if Lamine sings, Yusra leaves: condition v1, over v2
    - "<X> is ADJ when / if ADJ"                           # the ladder is brittle when cold: a stative condition, the copular for cold
    - "<class>s are ADJ if <P>"                            # herons are patient if the weather is sunny: ranges + condition + over
    - "Provided that / as long as / in case <P>, <Q>"      # the same rule, the words recorded
  boundary:                   # looks like a conditional but is not one
    - >-
      a counterfactual or a hypothetical with would — if Lamine had sung, Yusra would have left;
      if Yusra sang, Teodor would leave: the counterfactual template
    - >-
      unless, or if not — unless it rains, Lamine sings; if Yusra does not sing, Lamine leaves:
      a negated condition, with no form yet; report the clause as unmapped (G08)
    - >-
      an eventive when-clause — when Lamine sings, Yusra leaves; whenever the bell rang: a
      generalization over the when-clause's events, the frequency template
    - >-
      a class's property under a state of its members — clay is soft when wet, all alloys are
      brittle when cold: the conditional-property template; here the subject is an individual,
      or the condition is about something else than the member
    - >-
      a causal connective — because, since, so: a link between two asserted clauses, not a
      condition
    - >-
      "if" introducing an embedded question — asked if Yusra had left: a sealed question under
      the verb, not a condition
    - >-
      a purpose or a result infinitive — left to sleep, woke to find the door open: not a
      condition

slots:
  id:        {type: id, required: true, doc: "your label for the rule (r1, r2 …)"}
  condition: {type: refs, class: Proposition, required: true, as_variable: true,
              doc: "the if-clause: the id of its predication (its event becomes the rule's variable) or of its copular / locative instance for a state (the copular for cold, its subject the thing it is said of); several conditions are several ids"}
  over:      {type: refs, class: Proposition, required: true, skolemize: true,
              doc: "the consequence: the id of its predication, or of the negation or modal over it, or of its copular instance for a state; nothing else"}
  ranges:    {type: refs, class: Proposition, required: false,
              doc: "the range instance of a class subject (herons are patient if the weather is sunny): its id; absent otherwise"}
  generic:   {type: bool, required: false,
              doc: "true when the subject is a bare plural or mass noun read generically, with no quantifier word (herons are …): a bare generalization; absent otherwise"}
  word:      {type: string, required: false, doc: "the conditional word as written when it is not if (provided that, as long as, in case, even if, when); recorded, not rendered"}

truth:
  strength:                    # a class subject takes its quantifier's value; a bare generic 0.9; a conditional about individuals 1.0
    - {from: ranges, slot: quantifier, values: {every: 1.0, each: 1.0, all: 1.0, most: 0.9, many: 0.7, few: 0.1, "no": 0.0, none: 0.0}}
    - {slot: generic, values: {"true": 0.9}}
    - 1.0
  confidence:                  # an explicit conditional 0.9; a bare generic states no proportion: 0.7
    - {slot: generic, values: {"true": 0.7}}
    - 0.9

emits:
  - atom: "(Implication {condition|own} {over})"
    when: "not ranges"
  - atom: "(Implication (And {ranges} {condition|own}) {over})"
    if_filled: ranges

notes:
  - >-
    A rule, not a fact: nothing is asserted of Lamine's singing or Yusra's leaving. With an
    eventive condition the variable is the condition's event — any singing by Lamine — so a
    stated singing instantiates the rule; an indefinite inside the condition is a variable too.
    With a stative condition the rule holds between the states as stated, so "the ladder is
    brittle when cold" fires when the ladder is stated to be cold.
  - >-
    An individual's conditional carries 1.0 at 0.9 (an explicit rule, revisable); a class's
    takes its quantifier's strength, 0.9 at 0.7 for a bare generic, as the generic and
    conditional-property templates do.
  - >-
    "If" is a condition, "when" a time: an eventive when-clause is the frequency template's
    generalization over occasions, and a stative when-clause (when cold) is a condition here.

depends_on: [activity, copular, range]
composes_with: [negation, modal]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: an eventive condition — the rule ranges over Teodor's arrivals, Ottoline's leaving a function of each
      text: "If Teodor arrives, Ottoline leaves."
      instances:
        - {t: named-entity, id: n1, name: "Teodor", span: "Teodor"}
        - {t: named-entity, id: n2, name: "Ottoline", span: "Ottoline"}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: present, span: "Teodor arrives"}
        - {t: motion, id: m2, verb: leave, mover: "@n2", tense: present, span: "Ottoline leaves"}
        - {t: conditional, id: r1, condition: ["@m1"], over: ["@m2"], span: "If Teodor arrives, Ottoline leaves"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_teodor_1 \"Teodor\")"
        - "(Name sk_ottoline_1 \"Ottoline\")"
        - "(Implication (And (Member $e arrive) (Agent $e sk_teodor_1)) (And (Member (sk_leave $e) leave) (Agent (sk_leave $e) sk_ottoline_1)))"
      declarations:
        - "(: arrive Class)"
        - "(: leave Class)"
        - "(: sk_arrive_1 Event)"
        - "(: sk_leave_1 Event)"
        - "(: sk_ottoline_1 Entity)"
        - "(: sk_teodor_1 Entity)"
        - "(: sk_leave (-> Atom Event))"
    - category: positive
      note: a stative condition on an individual — the rule holds between the two states
      text: "The barn is cold when the door is open."
      instances:
        - {t: witness, id: x1, class: barn, definite: true, span: "The barn"}
        - {t: witness, id: x2, class: door, definite: true, span: "the door"}
        - {t: copular, id: c1, subject: "@x1", predicate: cold, form: adjective, tense: present, span: "The barn is cold"}
        - {t: copular, id: c2, subject: "@x2", predicate: open, form: adjective, tense: present, span: "the door is open"}
        - {t: conditional, id: r1, condition: ["@c2"], over: ["@c1"], word: when, span: "The barn is cold when the door is open"}
    - category: abstain
      text: "All alloys are brittle when cold."
      expected: {abstain: true, template: conditional-property}        # a class's property under a state of its members
    - category: abstain
      text: "Unless it rains, Lamine sings."
      expected: {abstain: true, gap: G08, span: "Unless it rains"}     # a negated condition

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: the plain conditional
      text: "If Lamine sings, Yusra leaves."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: present}
        - {t: motion, id: m1, verb: leave, mover: "@n2", tense: present}
        - {t: conditional, id: r1, condition: ["@v1"], over: ["@m1"]}
    - category: positive
      note: an individual's property under a state
      text: "The ladder is brittle when cold."
      instances:
        - {t: witness, id: x1, class: ladder, definite: true}
        - {t: copular, id: c1, subject: "@x1", predicate: brittle, form: adjective, tense: present}
        - {t: copular, id: c2, subject: "@x1", predicate: cold, form: adjective, tense: present}
        - {t: conditional, id: r1, condition: ["@c2"], over: ["@c1"], word: when}
    - category: positive
      note: a named individual under a state
      text: "Teodor is grumpy when tired."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: copular, id: c1, subject: "@n1", predicate: grumpy, form: adjective, tense: present}
        - {t: copular, id: c2, subject: "@n1", predicate: tired, form: adjective, tense: present}
        - {t: conditional, id: r1, condition: ["@c2"], over: ["@c1"], word: when}
    - category: positive
      note: a class subject with a condition about something else — the range among the premises, a bare generic
      text: "Herons are patient if the weather is sunny."
      instances:
        - {t: range, id: q1, class: heron}
        - {t: witness, id: x1, class: weather, definite: true}
        - {t: copular, id: c1, subject: "@q1", predicate: patient, form: adjective, tense: present}
        - {t: copular, id: c2, subject: "@x1", predicate: sunny, form: adjective, tense: present}
        - {t: conditional, id: r1, ranges: ["@q1"], condition: ["@c2"], over: ["@c1"], generic: true}
    - category: positive
      note: a future consequence
      text: "If Yusra arrives, Teodor will leave."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: named-entity, id: n2, name: "Teodor"}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: present}
        - {t: motion, id: m2, verb: leave, mover: "@n2", tense: future}
        - {t: conditional, id: r1, condition: ["@m1"], over: ["@m2"]}
    - category: positive
      note: a stative condition with an eventive consequence
      text: "If the gate is open, the ferret leaves."
      instances:
        - {t: witness, id: x1, class: gate, definite: true}
        - {t: witness, id: x2, class: ferret, definite: true}
        - {t: copular, id: c1, subject: "@x1", predicate: open, form: adjective, tense: present}
        - {t: motion, id: m1, verb: leave, mover: "@x2", tense: present}
        - {t: conditional, id: r1, condition: ["@c1"], over: ["@m1"]}
    - category: positive
      note: provided that — the same rule, the words recorded
      text: "Provided that Lamine sings, Yusra stays."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: present}
        - {t: activity, id: v2, verb: stay, actor: "@n2", tense: present}
        - {t: conditional, id: r1, condition: ["@v1"], over: ["@v2"], word: "provided that"}
    - category: scoped
      note: a negated consequence
      text: "If Lamine sings, Yusra does not leave."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: present}
        - {t: motion, id: m1, verb: leave, mover: "@n2", tense: present}
        - {t: negation, id: s1, over: ["@m1"]}
        - {t: conditional, id: r1, condition: ["@v1"], over: ["@s1"]}
    - category: scoped
      note: a modal consequence
      text: "If Teodor arrives, Ottoline might leave."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Ottoline"}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: present}
        - {t: motion, id: m2, verb: leave, mover: "@n2", tense: present}
        - {t: modal, id: s1, over: ["@m2"], head: Might, surface: might}
        - {t: conditional, id: r1, condition: ["@m1"], over: ["@s1"]}
    - category: abstain
      text: "Whenever Yusra sang, the ferret hid."
      expected: {abstain: true, template: frequency}                  # an eventive when-clause
    - category: abstain
      text: "Tin is brittle when cold."
      expected: {abstain: true, template: conditional-property}        # a class's property under a state of its members
    - category: abstain
      text: "If Lamine had sung, Yusra would have left."
      expected: {abstain: true, template: counterfactual}             # a subjunctive
    - category: abstain
      text: "Unless Yusra sings, Lamine leaves."
      expected: {abstain: true, gap: G08, span: "Unless Yusra sings"}   # a negated condition
