# Template: coref  (coreference stated as a link: a later mention stands for an earlier referent)
#
# The parser resolves coreference, but not silently: a pronoun, a repeated name or an anaphoric
# definite is an instance of its own, and this instance states which earlier referent it stands
# for and how sure the text makes it — (Coref sk_he_1 sk_bob_1) with the probability of identity
# as its strength. Roles stay on the mention; a downstream reasoner carries them across the link
# (the seeded congruence rules) and can revise the link. Two readings the text leaves open are two
# links, one per candidate.

id: coref
family: link
shape: link
title: A later mention stands for an earlier referent
status: draft

trigger:
  construction: >
    The judgement that a later mention stands for a referent introduced earlier in the text: a
    pronoun (he, it, her), a repeated name (Marisol … Marisol), an anaphoric definite (a sluice … the
    sluice), a demonstrative for an event (that surprised Marisol). State it as an instance naming
    the later mention, the referent's FIRST instance in the text, and the certainty: certain when
    only one antecedent fits, likely when one fits clearly better than another, unsure when the
    text leaves it open, unlikely for the other candidate when you state both. One instance per
    later mention; for an open choice between two candidates, one instance per candidate.
  surface_forms:
    - "<N> … <pronoun>"                 # Pieter ate the bun and he liked it
    - "<Name> … <Name>"                 # Marisol laughed. Marisol left.
    - "a <N> … the <N>"                 # a badger arrived; the badger slept
    - "<clause>. That <V> …"            # Pieter arrived. That frightened Marisol.
  boundary:                   # looks like coreference but is not one
    - >-
      a first mention — Marisol laughed: nothing to link; the referent's own instance suffices
    - >-
      two different referents with the same class — a badger and another badger: no link
    - >-
      a relative pronoun — the stork that ate the frog: no coreference; the noun fills the clause's
      role directly (relative clauses)
    - >-
      an expletive or a generic pronoun — it rained, one never knows: no referent, no link

slots:
  id:         {type: id, required: true, doc: "your label for the link (c1, c2 …)"}
  mention:    {type: filler, class: Entity, required: true,
               doc: "the later mention: the id of its own instance (a mention, a second named-entity, a second witness)"}
  antecedent: {type: filler, class: Entity, required: true,
               doc: "the referent it stands for: the id of that referent's FIRST instance in the text (an entity or an event)"}
  certainty:  {type: enum, values: [certain, likely, unsure, unlikely], required: true,
               doc: "how sure the text makes the identity; the program sets the strength from it"}

truth:
  strength:
    - {slot: certainty, values: {certain: 0.99, likely: 0.8, unsure: 0.5, unlikely: 0.2}}
  confidence: [0.9]

emits:
  - atom: "(Coref {mention} {antecedent})"

notes:
  - >-
    The link's strength is the probability of identity, set by the program from the certainty
    word; its confidence is the parse's usual 0.9, revisable by later evidence. Roles are never
    moved from the mention to the antecedent in the parse: the seeded congruence rules derive them
    downstream, at the link's strength and with provenance, so a wrong resolution is one atom to
    retract.
  - >-
    Link every later mention to the referent's first instance, not to the previous mention, so
    that the reasoner reaches any fact in one step.

depends_on: [mention, named-entity, witness]
composes_with: []

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: two pronouns, each its own mention, each linked to the first instance of its referent
      text: "Odile baked a bun and she ate it."
      instances:
        - {t: named-entity, id: n1, name: "Odile", span: "Odile"}
        - {t: witness, id: x1, class: bun, span: "a bun"}
        - {t: creation, id: e1, verb: bake, creator: "@n1", product: "@x1", tense: past, span: "Odile baked a bun"}
        - {t: mention, id: m1, word: she, span: "she"}
        - {t: mention, id: m2, word: it, span: "it"}
        - {t: activity, id: v1, verb: eat, actor: "@m1", patient: "@m2", tense: past, span: "she ate it"}
        - {t: coref, id: c1, mention: "@m1", antecedent: "@n1", certainty: certain, span: ["Odile", "she"]}
        - {t: coref, id: c2, mention: "@m2", antecedent: "@x1", certainty: certain, span: ["a bun", "it"]}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_odile_1 \"Odile\")"
        - "(Member sk_bun_1 bun)"
        - "(Member sk_bake_1 bake)"
        - "(Agent sk_bake_1 sk_odile_1)"
        - "(Patient sk_bake_1 sk_bun_1)"
        - "(Past sk_bake_1)"
        - "(Member sk_she_1 female)"
        - "(Member sk_eat_1 eat)"
        - "(Agent sk_eat_1 sk_she_1)"
        - "(Patient sk_eat_1 sk_it_1)"
        - "(Past sk_eat_1)"
        - "(Coref sk_she_1 sk_odile_1)"
        - "(Coref sk_it_1 sk_bun_1)"
      declarations:
        - "(: bake Class)"
        - "(: bun Class)"
        - "(: eat Class)"
        - "(: female Class)"
        - "(: sk_bake_1 Event)"
        - "(: sk_bun_1 Entity)"
        - "(: sk_eat_1 Event)"
        - "(: sk_it_1 Entity)"
        - "(: sk_odile_1 Entity)"
        - "(: sk_she_1 Entity)"
    - category: positive
      note: a repeated name is a second instance, linked
      text: "Marisol laughed. Marisol left."
      instances:
        - {t: named-entity, id: n1, name: "Marisol", span: "Marisol"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: past, span: "Marisol laughed"}
        - {t: named-entity, id: n2, name: "Marisol", span: "Marisol"}
        - {t: motion, id: m1, verb: leave, mover: "@n2", tense: past, span: "Marisol left"}
        - {t: coref, id: c1, mention: "@n2", antecedent: "@n1", certainty: certain, span: ["Marisol", "Marisol"]}
    - category: abstain
      text: "Marisol laughed."
      expected: {abstain: true, template: activity}                   # a first mention: nothing to link

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      text: "Teodor ate the loaf and he liked it."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: loaf, definite: true}
        - {t: activity, id: v1, verb: eat, actor: "@n1", patient: "@x1", tense: past}
        - {t: mention, id: m1, word: he}
        - {t: mention, id: m2, word: it}
        - {t: psych, id: p1, verb: like, experiencer: "@m1", stimulus: "@m2", tense: past}
        - {t: coref, id: c1, mention: "@m1", antecedent: "@n1", certainty: certain}
        - {t: coref, id: c2, mention: "@m2", antecedent: "@x1", certainty: certain}
    - category: positive
      note: an anaphoric definite is a second witness, linked
      text: "A ferret arrived. The ferret slept."
      instances:
        - {t: witness, id: x1, class: ferret}
        - {t: motion, id: e1, verb: arrive, mover: "@x1", tense: past}
        - {t: witness, id: x2, class: ferret, definite: true}
        - {t: activity, id: v1, verb: sleep, actor: "@x2", tense: past}
        - {t: coref, id: c1, mention: "@x2", antecedent: "@x1", certainty: certain}
    - category: positive
      note: a possessive pronoun is the witness's possessor, and a mention
      text: "Yusra sold her spindle."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: mention, id: m1, word: her}
        - {t: witness, id: x1, class: spindle, possessor: "@m1"}
        - {t: transfer, id: e1, verb: sell, giver: "@n1", object: "@x1", tense: past}
        - {t: coref, id: c1, mention: "@m1", antecedent: "@n1", certainty: certain}
    - category: positive
      note: two candidates the text leaves open — one link per candidate
      text: "Teodor and Lamine arrived. He laughed."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: motion, id: e1, verb: arrive, mover: "@n1", tense: past}
        - {t: motion, id: e2, verb: arrive, mover: "@n2", tense: past}
        - {t: mention, id: m1, word: he}
        - {t: activity, id: v1, verb: laugh, actor: "@m1", tense: past}
        - {t: coref, id: c1, mention: "@m1", antecedent: "@n1", certainty: unsure}
        - {t: coref, id: c2, mention: "@m1", antecedent: "@n2", certainty: unsure}
    - category: scoped
      note: the mentions stay outside the negation; only the eating is denied
      text: "Yusra baked a loaf. She did not eat it."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: loaf}
        - {t: creation, id: e1, verb: bake, creator: "@n1", product: "@x1", tense: past}
        - {t: mention, id: m1, word: she}
        - {t: mention, id: m2, word: it}
        - {t: activity, id: v1, verb: eat, actor: "@m1", patient: "@m2", tense: past}
        - {t: negation, id: s1, over: ["@v1"]}
        - {t: coref, id: c1, mention: "@m1", antecedent: "@n1", certainty: certain}
        - {t: coref, id: c2, mention: "@m2", antecedent: "@x1", certainty: certain}
    - category: optional
      note: a demonstrative standing for an event
      text: "Teodor arrived. That frightened Yusra."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: motion, id: e1, verb: arrive, mover: "@n1", tense: past}
        - {t: mention, id: m1, word: that}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: psych, id: p1, verb: frighten, experiencer: "@n2", stimulus: "@m1", tense: past}
        - {t: coref, id: c1, mention: "@m1", antecedent: "@e1", certainty: certain}
    - category: abstain
      text: "Yusra gave up."
      expected: {abstain: true, template: activity}                   # a first mention: nothing to link
    - category: abstain
      text: "The clerk who laughed left."
      expected: {abstain: true, template: activity}                   # a relative pronoun: the noun fills the clause
    - category: positive
      note: read after a context — a pronoun linked to the earlier sentence's referent by its qualified id
      context:
        - text: "Lamine sold a quilt."
          instances:
            - {t: named-entity, id: n1, name: "Lamine"}
            - {t: witness, id: x1, class: quilt}
            - {t: transfer, id: e1, verb: sell, giver: "@n1", object: "@x1", tense: past}
      text: "He smiled."
      instances:
        - {t: mention, id: m1, word: he}
        - {t: coref, id: c1, mention: "@m1", antecedent: "@s1.n1", certainty: certain}
        - {t: activity, id: v1, verb: smile, actor: "@m1", tense: past}
    - category: positive
      note: read after a context — a pronoun for a thing, the earlier witness its antecedent
      context:
        - text: "Teodor fed a ferret."
          instances:
            - {t: named-entity, id: n1, name: "Teodor"}
            - {t: witness, id: x1, class: ferret}
            - {t: activity, id: v1, verb: feed, actor: "@n1", patient: "@x1", tense: past}
      text: "It was asleep."
      instances:
        - {t: mention, id: m1, word: it}
        - {t: coref, id: c1, mention: "@m1", antecedent: "@s1.x1", certainty: certain}
        - {t: copular, id: c2, subject: "@m1", predicate: asleep, form: adjective, tense: past}
    - category: positive
      note: read after a context — a repeated name gets its own instance, linked to the first
      context:
        - text: "Ottoline mended the barn."
          instances:
            - {t: named-entity, id: n1, name: "Ottoline"}
            - {t: witness, id: x1, class: barn, definite: true}
            - {t: activity, id: v1, verb: mend, actor: "@n1", patient: "@x1", tense: past}
      text: "Ottoline left."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: coref, id: c1, mention: "@n1", antecedent: "@s1.n1", certainty: certain}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: past}
    - category: positive
      note: read after two sentences — an anaphoric definite whose antecedent is two sentences back
      context:
        - text: "Yusra bought a ferret."
          instances:
            - {t: named-entity, id: n1, name: "Yusra"}
            - {t: witness, id: x1, class: ferret}
            - {t: acquisition, id: e1, verb: buy, acquirer: "@n1", object: "@x1", tense: past}
        - text: "Teodor mended the barn."
          instances:
            - {t: named-entity, id: n1, name: "Teodor"}
            - {t: witness, id: x1, class: barn, definite: true}
            - {t: activity, id: v1, verb: mend, actor: "@n1", patient: "@x1", tense: past}
      text: "The ferret escaped."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: coref, id: c1, mention: "@x1", antecedent: "@s1.x1", certainty: certain}
        - {t: motion, id: m1, verb: escape, mover: "@x1", tense: past}
    - category: abstain
      note: read after a context — a sentence denying the earlier one is reported (G11); the earlier sentence stays as parsed
      context:
        - text: "Lamine sold the quilt."
          instances:
            - {t: named-entity, id: n1, name: "Lamine"}
            - {t: witness, id: x1, class: quilt, definite: true}
            - {t: transfer, id: e1, verb: sell, giver: "@n1", object: "@x1", tense: past}
      text: "That is false."
      expected: {abstain: true, gap: G11, span: "That is false"}
