# Template: range  (the quantified variable of a generalization: "every ferret", "ferrets" as a class)
#
# A verbal generalization — every ferret slept, ferrets sleep, most students laugh, no ferret
# slept — ranges over the members of a class. The range is the referent the predication is
# about: a variable ($x) standing for an arbitrary member, with the class and the quantifier
# word recorded. It fills the predication's slots like any referent; the generic template then
# turns the predication into a rule over it. The quantifier word stays in the instance record —
# provenance of the rule's strength, reachable from the rule statement — and is not an atom.

id: range
family: referent
shape: referent
title: The quantified variable of a verbal generalization
status: draft

trigger:
  construction: >
    The subject or object of a verbal generalization over a class: a quantifier word with a class
    noun (every badger, each student, all badgers, most students, many storks, few badgers, no
    badger, none of the badgers) or a bare plural read generically (badgers sleep). It stands
    for an arbitrary member of the class, not for a particular individual or a particular group.
    One range per quantified class noun: "every badger feared every stork" has two. A quantified
    TIME is a range too — every day, every morning, on Sundays, every Monday — over the class of
    the occasions (day, morning, sunday, monday), and a frequency adverb with no stated period
    (often, rarely) ranges over the class occasion; the frequency template builds that rule.
  surface_forms:
    - "every / each / all <N>(s)"                # universal
    - "most / many / few <N>s"                   # graded
    - "no <N> / none of the <N>s"                # the negative universal
    - "<N>s V …"                                 # a bare plural read generically: no word
    - "every <unit / day part / weekday>; on <weekday>s; daily"   # the occasions of a frequency: class day, morning, sunday …
    - "<adverb of frequency>"                    # often, rarely: a range over the class occasion
  boundary:                   # looks like a range but is not one
    - >-
      a specific group — the badgers, several badgers, three students, some students: a group
      referent, and what is said of its members is a distribution
    - >-
      a quantified portion of a definite group — most of the badgers, two of the badgers: a
      portion referent, not a range; none of the badgers stays a range
    - >-
      a bare plural with "be" — badgers are curious: a class statement, which carries its own
      quantifier
    - >-
      an existential singular — some badger slept, a badger slept: an indefinite witness

slots:
  id:         {type: id, required: true, doc: "your label for the range (q1, q2 …)"}
  class:       {type: lemma, class: Class, required: true, narrowed_by: [props, mods], doc: "the class, lemmatized to the singular (badger) — an adjective on it (old badgers, red kites) narrows it: props, as a noun before it does: mods (harbour seals: class seal, mods [harbour]); a state stated as a condition (badgers that are cornered, clay when wet) is a copular instance in the rule's condition instead; for the occasions of a frequency the unit, day part or weekday (day, morning, sunday), or occasion for a bare adverb"}
  props:      {type: list, class: Class, restriction: Member, required: false,
               doc: "the adjectives on the class noun, each a lemma (old badgers: old)"}
  mods:       {type: list, class: Class, ids: [named-entity, time], required: false,
               doc: "the nouns, names and years before the head noun that narrow its class (Nouns before nouns): a lemma for a noun (a harbour pilot: harbour; a sea salt grinder: sea_salt), the id of a named-entity instance for a name (a Brackenford blanket), of a time instance for a year, a decade or a century (a 1904 almanac); never an adjective"}
  quantifier: {type: string, required: false,
               doc: "the quantifier word as written (every, each, all, most, many, few, no, none); absent for a bare generic"}
  predicate:  {type: lemma, class: Class, required: false,
               doc: "the lemma of the predication the range takes part in (slept → sleep); recorded, not rendered; optional"}

mints: {id: Entity, variable: true}

emits:
  - atom: "(Member @id {class|mod})"                          # the premise: an arbitrary member of the (narrowed) class
    mod_each: class                                             # one narrowed class per modifier, each a premise

notes:
  - >-
    The range mints a variable rather than a witness: nothing asserts that a member exists; the
    rule the generic template builds quantifies over whatever members there are.
  - >-
    The quantifier word is not an atom: the rule's strength carries the quantity and its
    confidence tells an explicit word (0.9) from a bare generic (0.7); the word itself stays in
    this instance, reachable from the rule statement, as the provenance of that strength.

depends_on: []
composes_with: [generic]

examples:                    # a range appears only inside a generalization: see the generic template
  shown: []
  held_out: []
