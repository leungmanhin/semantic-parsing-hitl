# Template: location  (where an event takes place: "laughed in the barn", "waited at the gate")
#
# A place phrase on a clause attaches to the clause's event: (Location event place) for in / at /
# on / inside / within, the preposition's own head for the others ((Under event place), (Near …)).
# The place is a referent like any other — a witness (the barn), a name (Calderwick) or a bare
# lemma for a class-level place (in burrows). The attachment is part of the clause: it is negated,
# modalised and generalised together with the event it attaches to. A phrase that locates a thing
# rather than an event (the ledger is on the workbench) is a locative predication instead.

id: location
family: attachment
shape: attachment
title: The place where an event takes place
status: draft

trigger:
  construction: >
    A prepositional phrase naming the place where the clause's event takes place: in / at / on /
    inside / within a place (laughed in the barn, waited at the gate, slept on the rug), or
    near / by / under / over / above / below / behind / beside / outside / opposite it. The event
    is parsed with its own template; the location instance names that event and the place. One
    instance per place phrase.
  surface_forms:
    - "<clause> in / at / on <place>"                 # Yusra laughed in the barn
    - "<clause> near / under / behind … <place>"      # the ferret slept under the ladder
    - "<place phrase>, <clause>"                      # In the barn, Lamine laughed
  boundary:                   # looks like the place of an event but is not one
    - >-
      a destination or an origin of a motion — went to the market, came from the barn, entered
      the shed: the motion's goal or source
    - >-
      the origin of an acquisition or a transfer — took the envelope from Lamine: the source slot
      of that template
    - >-
      where a THING is, with no event — the ledger is on the workbench, Calderwick is in Norfolk:
      a locative predication
    - >-
      a path of a motion — ran across the field, walked along the river, went through the gate:
      an oblique on the motion, by its preposition
    - >-
      a time phrase — in 2019, at noon, on Monday: a time, not a place
    - >-
      a non-spatial in / on / at on an event — works on the audit: no place; an oblique on the
      event, by its preposition
    - >-
      a non-spatial phrase on an adjective — good at chess, modest in its demands: an adjective
      with a complement, the adjective-complement template; a place phrase on an adjective —
      happy in Calderwick, empty in the village, very busy in the mill: this template on the
      copular or degree predication (the event slot names that instance; the program mints the
      state the place hangs on), and likewise on a comparative, a part-whole or a measure clause
    - >-
      a place phrase inside a noun phrase — the ferret in the barn slept: a locative predication
      of that thing, not an attachment to the clause's event
    - >-
      among a group — among the ferrets: an oblique (among what); between two times — between
      noon and two: a window of time, the time-relation template (between two places — slept
      between the barn and the shed — is head Between, the second place in `place2`)

slots:
  id:          {type: id, required: true, doc: "your label for the attachment (l1, l2 …)"}
  event:       {type: filler, class: Event, attaches: true, required: true,
                doc: "the predication the place attaches to: the id of the clause's event instance"}
  place:       {type: filler, class: Entity, required: true,
                doc: "the place: a referent id (a witness for the barn, a name for Calderwick) or a bare lemma for a class-level place (in burrows)"}
  place2:      {type: filler, class: Entity, required: false, only_when: "head == Between",
                doc: "with head Between only, the second of the two places (slept between the barn and the shed: the shed); the order as written"}
  head:        {type: enum, values: [Location, Near, By, Under, Over, Above, Below, Behind, Beside, Between, Outside, Opposite], required: true,
                doc: "Location for in / at / on / inside / within; otherwise the preposition itself, capitalized (under → Under)"}
  preposition: {type: string, required: true, doc: "the preposition as written (in, at, under …)"}

emits:
  - atom: "({head} {event} {place} {place2|opt})"

notes:
  - >-
    An attachment has no symbol of its own: its atom is rendered wherever its event is rendered —
    inside a negation or a modal over the clause, inside the rule a generalization builds — so
    "Yusra did not laugh in the barn" denies the located laughing as a whole.
  - >-
    In, at and on all render as Location, the substrate's role for where an eventuality holds;
    the other prepositions keep their own head, as the legacy output did, and the word itself is
    kept in the instance.

depends_on: [named-entity, witness]
composes_with: [negation, modal, generic, distribution]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: the place attaches to the clause's event
      text: "Yusra laughed in the barn."
      instances:
        - {t: named-entity, id: n1, name: "Yusra", span: "Yusra"}
        - {t: witness, id: x1, class: barn, definite: true, span: "the barn"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: past, span: "Yusra laughed"}
        - {t: location, id: l1, event: "@v1", place: "@x1", head: Location, preposition: in, span: "in the barn"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_yusra_1 \"Yusra\")"
        - "(Member sk_barn_1 barn)"
        - "(Member sk_laugh_1 laugh)"
        - "(Agent sk_laugh_1 sk_yusra_1)"
        - "(Past sk_laugh_1)"
        - "(Location sk_laugh_1 sk_barn_1)"
      declarations:
        - "(: barn Class)"
        - "(: laugh Class)"
        - "(: sk_barn_1 Entity)"
        - "(: sk_laugh_1 Event)"
        - "(: sk_yusra_1 Entity)"
    - category: positive
      note: a preposition other than in / at / on keeps its own head
      text: "The ferret slept under the ladder."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true, span: "The ferret"}
        - {t: witness, id: x2, class: ladder, definite: true, span: "the ladder"}
        - {t: activity, id: v1, verb: sleep, actor: "@x1", tense: past, span: "The ferret slept"}
        - {t: location, id: l1, event: "@v1", place: "@x2", head: Under, preposition: under, span: "under the ladder"}
    - category: abstain
      text: "Yusra went to the market."
      expected: {abstain: true, template: motion}                     # a destination
    - category: abstain
      text: "Ottoline took the envelope from Lamine."
      expected: {abstain: true, template: acquisition}                # the source of an acquisition
    - category: abstain
      text: "The ledger is on the workbench."
      expected: {abstain: true, template: locative}                   # where a thing is, no event

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: a place on a copular clause — the state of the fact holding carries the location
      text: "Lamine was happy in Calderwick."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Calderwick"}
        - {t: copular, id: c1, subject: "@n1", predicate: happy, form: adjective, tense: past}
        - {t: location, id: l1, event: "@c1", place: "@n2", head: Location, preposition: in}
    - category: positive
      text: "Teodor read the letter in the barn."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: letter, definite: true}
        - {t: witness, id: x2, class: barn, definite: true}
        - {t: activity, id: v1, verb: read, actor: "@n1", patient: "@x1", tense: past}
        - {t: location, id: l1, event: "@v1", place: "@x2", head: Location, preposition: in}
    - category: positive
      note: at renders as Location
      text: "Lamine waited at the market."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: market, definite: true}
        - {t: activity, id: v1, verb: wait, actor: "@n1", tense: past}
        - {t: location, id: l1, event: "@v1", place: "@x1", head: Location, preposition: at}
    - category: positive
      note: on renders as Location
      text: "The ferret slept on the quilt."
      instances:
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: witness, id: x2, class: quilt, definite: true}
        - {t: activity, id: v1, verb: sleep, actor: "@x1", tense: past}
        - {t: location, id: l1, event: "@v1", place: "@x2", head: Location, preposition: "on"}
    - category: positive
      text: "Yusra laughed behind the shed."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: shed, definite: true}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: past}
        - {t: location, id: l1, event: "@v1", place: "@x1", head: Behind, preposition: behind}
    - category: positive
      text: "Ottoline sang near the barn."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: past}
        - {t: location, id: l1, event: "@v1", place: "@x1", head: Near, preposition: near}
    - category: positive
      note: a named place
      text: "Yusra laughed in Calderwick."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: named-entity, id: n2, name: "Calderwick"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: past}
        - {t: location, id: l1, event: "@v1", place: "@n2", head: Location, preposition: in}
    - category: positive
      note: an indefinite place, present tense
      text: "Teodor works in a bakery."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: bakery}
        - {t: activity, id: v1, verb: work, actor: "@n1", tense: present}
        - {t: location, id: l1, event: "@v1", place: "@x1", head: Location, preposition: in}
    - category: positive
      note: the place of a creation — the event's place, nothing about where the shed is
      text: "Yusra built a shed in the garden."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: shed}
        - {t: witness, id: x2, class: garden, definite: true}
        - {t: creation, id: e1, verb: build, creator: "@n1", product: "@x1", tense: past}
        - {t: location, id: l1, event: "@e1", place: "@x2", head: Location, preposition: in}
    - category: scoped
      note: under clausal negation — the attachment is denied with the event
      text: "Teodor did not laugh in the barn."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: past}
        - {t: location, id: l1, event: "@v1", place: "@x1", head: Location, preposition: in}
        - {t: negation, id: s1, over: ["@v1"]}
    - category: scoped
      note: under a modal
      text: "Lamine might wait in the barn."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: activity, id: v1, verb: wait, actor: "@n1", tense: present}
        - {t: location, id: l1, event: "@v1", place: "@x1", head: Location, preposition: in}
        - {t: modal, id: s1, over: ["@v1"], head: Might, surface: might}
    - category: scoped
      note: inside a generalization — each member's sleeping is in the one barn
      text: "Every ferret slept in the barn."
      instances:
        - {t: range, id: q1, class: ferret, quantifier: every, predicate: sleep}
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: activity, id: v1, verb: sleep, actor: "@q1", tense: past}
        - {t: location, id: l1, event: "@v1", place: "@x1", head: Location, preposition: in}
        - {t: generic, id: r1, ranges: ["@q1"], over: ["@v1"]}
    - category: optional
      note: a fronted place phrase
      text: "In the barn, Yusra laughed."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: barn, definite: true}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: past}
        - {t: location, id: l1, event: "@v1", place: "@x1", head: Location, preposition: in}
    - category: abstain
      text: "Teodor arrived in 2019."
      expected: {abstain: true, template: time}                       # a time, not a place
    - category: abstain
      text: "Teodor ran across the field."
      expected: {abstain: true, template: motion}                     # a path, no slot
    - category: abstain
      text: "Lamine was modest in his demands."
      expected: {abstain: true, template: adjective-complement}         # a non-spatial in: an adjective's complement
    - category: positive
      note: a place on a graded clause — the state of the graded fact holding carries the location
      text: "Teodor was very busy in the mill."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: witness, id: x1, class: mill, definite: true}
        - {t: degree, id: d1, bearer: "@n1", scale: busy, level: very, tense: past}
        - {t: location, id: l1, event: "@d1", place: "@x1", head: Location, preposition: in}
    - category: positive
      note: where — the noun the place of the relative clause's event, the word as its preposition
      text: "Teodor visited the town where Yusra sang."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: witness, id: x1, class: town, definite: true}
        - {t: activity, id: v1, verb: visit, actor: "@n1", patient: "@x1", tense: past}
        - {t: activity, id: v2, verb: sing, actor: "@n2", tense: past}
        - {t: location, id: l1, event: "@v2", place: "@x1", head: Location, preposition: where}
    - category: positive
      note: an event's place between two — head Between, the second in place2
      text: "Corvin waited between the kiln and the well."
      instances:
        - {t: named-entity, id: n1, name: "Corvin"}
        - {t: witness, id: x1, class: kiln, definite: true}
        - {t: witness, id: x2, class: well, definite: true}
        - {t: activity, id: v1, verb: wait, actor: "@n1", tense: past}
        - {t: location, id: l1, event: "@v1", place: "@x1", place2: "@x2", head: Between, preposition: between}
