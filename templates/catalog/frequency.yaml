# Template: frequency  (how often an event recurs: "swims every morning", "often laughs", "visits the market twice a week", "knocked twice")
#
# A frequency expression says how often the clause's event recurs. When it quantifies over
# occasions — a period of one unit (every day, every morning, on Sundays, daily, weekly) or a
# frequency adverb (always, often, rarely) — the clause becomes a RULE over an occasion range,
# with its own event per occasion, exactly as a generalization over a class does:
#   (Implication (Member $t morning) (And (Member (sk_swim $t) swim) (Agent (sk_swim $t) sk_yusra_1) (Time (sk_swim $t) $t)))
# The sentence asserts no particular swim, so no top-level swim is minted; the strength is the
# quantifier's, on the one dial the noun quantifiers use (every / always 1.0, usually 0.9 like
# most, often 0.7 like many, rarely 0.1 like few) at confidence 0.9; an existential adverb
# (sometimes) states no proportion and gets 0.5 at confidence 0.7, as a bare generic does. The
# range's instance record keeps the word. A rate (twice a week) is the same rule
# over the weeks, each week's episode carrying the count: (Times (sk_visit $w) 2). A pattern no
# single occasion carries — a period of more than one unit (every two weeks) — and a bare count
# of occurrences (knocked twice) stay a tag on the event: (Every e 2 week), (Times e 2). The
# parser records the words; what "usually" amounts to is the program's dial. When an adverb
# qualifies a clause that carries an attachment — a time, a place, a manner — the restrictor is
# the clause's own events and the attachment is what is asserted of them: "Teodor always arrives
# at noon" = (Implication (And (Member $e arrive) (Agent $e sk_teodor_1)) (And (Time $e (sk_time
# $e)) (Hour (sk_time $e) 12))), a rule that fires on any stated arrival; a when / whenever clause
# is the restrictor of the clause it introduces.

id: frequency
family: rule
shape: rule
title: How often an event recurs
status: draft

trigger:
  construction: >
    An expression saying how often the clause's event recurs. Two forms. (1) A QUANTIFICATION
    OVER OCCASIONS: a period of one unit — every day, each morning, every Monday, on Sundays,
    every night, daily, weekly, monthly, yearly, annually, nightly — a rate — twice a week, three
    times a day, once a year, twice per month — or a frequency adverb — always, usually, normally,
    generally, often, frequently, regularly, sometimes, occasionally, seldom, rarely, hardly ever,
    from time to time. The occasion is a range instance over the class of occasions (day, week,
    month, year; morning, night; sunday, monday; and `occasion` for an adverb with no stated
    period), the clause is parsed with its own template, and this instance names the range in
    `occasion` and the predication in `over`, with `every: 1` for a period, `times` for a rate
    (the count in each occasion: twice a week → 2 with a range over week) or `level` for the
    adverb; a generic subject or object (ferrets often bite, every ferret sleeps every night) is
    a range listed in `ranges`, and no generic instance is written. Two cases take their
    restrictor from the sentence instead of an occasion range. (1b) An ADVERB ON A CLAUSE WITH AN
    ATTACHMENT — Teodor always arrives at noon, Yusra usually swims in the lake, Lamine often
    sings loudly: the rule ranges over the clause's own events and asserts the attachment of
    them; name the predication in `restrictor` (no `occasion`, no `over`) and leave its time,
    place or manner attached to it as usual; "never" here is the same rule at strength 0
    (Teodor never arrives late). (1c) A WHEN / WHENEVER / EVERY TIME CLAUSE — when Lamine sings,
    Yusra usually leaves; whenever the bell rang, the ferret hid: the when-clause's predication
    is the restrictor, named in `restrictor`, and the main clause's predication is named in
    `over`; `every: 1` for whenever / every time / each time, `level` for an adverb in the main
    clause, and `every: 1` again for a bare "when" clause read as a generalization. (2) A PATTERN
    RECORDED ON
    THE EVENT: a period of more than one unit (every two weeks, every other day, every three
    years) or a bare count of occurrences (once, twice, three times): the clause's predication is
    named in `event` with `every` and `unit`, or with `times`. One instance per frequency
    expression; a clock time, a date or a place beside it (at noon every day) is an attachment
    on the event as always, rendered inside the rule.
  surface_forms:
    - "<clause> every / each <unit, day part or weekday>"    # swims every morning: a range over morning; every: 1
    - "<clause> on <weekday>s"                                # swims on Sundays: a range over sunday; every: 1
    - "<clause> daily / weekly / monthly / yearly / nightly"   # bakes bread daily: a range over day; every: 1
    - "<subject> <adverb> V … / <clause> <adverb>"             # often laughs: a range over occasion; level: often
    - "<subject> <adverb> V … <attachment>"                    # always arrives at noon: restrictor = the clause, the time asserted of its events
    - "When / Whenever / Every time <clause>, <clause> [<adverb>]"   # whenever the bell rang, the ferret hid: restrictor = the when-clause; every: 1
    - "<class>s <adverb> V … / every <class> V … every <unit>"   # ferrets often bite: the class range in ranges
    - "<clause> once / twice / <n> times a / per <unit>"       # visits the market twice a week: a range over week; times: 2
    - "<clause> every <n> <units> / every other <unit>"        # visits every two weeks: event, every: 2, unit: week
    - "<clause> once / twice / <n> times"                      # knocked twice: event, times: 2
  boundary:                   # looks like a frequency but is not one
    - >-
      a quantifier on a non-temporal noun with no frequency — every ferret slept, most students
      laugh: a generalization over a class, the generic template
    - >-
      never on a bare clause — Yusra never laughs: a negation of the clause, with no frequency
      instance; never with an attachment or a when-clause (never arrives late) is this template's
      rule at strength 0; never under a norm — must never feed the ferrets, should never be done:
      a prohibition (weak with should), the never its universality, no frequency instance
    - >-
      again, still, already, yet — laughed again, still waits: an aspectual particle, a
      presupposition about an earlier state, not how often
    - >-
      a duration — for six hours: how long, the measure template; a vague one — all day, for
      years: no slot anywhere; report
      the phrase as unmapped
    - >-
      an if-clause — if the bell rings, the ferret hides: the conditional template; a stative
      when-clause — the ladder is brittle when cold — is a condition there too, not a frequency
    - >-
      a habit with no frequency expression — Yusra swims, Lamine used to sing: the habitual
      template marks the clause's event; no rule, no range
    - >-
      a time the event takes place at — in 2019, on Monday, at noon, yesterday: a time; a time
      stated once is not a recurrence (on Monday is a time, on Mondays a frequency)
    - >-
      once meaning formerly — Lamine once lived in Calderwick: a vague past time, not one
      occurrence; report the word as unmapped
    - >-
      a vague count — several times a week, a few times a year, many times: no number to
      record; report the phrase as unmapped
    - >-
      a rate per something that is not a time — one per person, twice per visit: a
      distribution, no slot here; report the phrase as unmapped
    - >-
      a multiplicative comparison — twice as tall, three times the size: a degree, not a count
      of occurrences

slots:
  id:       {type: id, required: true, doc: "your label for the frequency (f1, f2 …)"}
  occasion: {type: refs, class: Proposition, required: false,
             doc: "the range this rule quantifies over: the id of a range instance whose class is the occasion — day, week, month or year for a period of one unit (every day, daily, weekly), the day part or weekday for every morning / every night / on Sundays / every Monday (morning, night, sunday, monday), and occasion for a frequency adverb with no stated period (often); required with over"}
  restrictor: {type: refs, class: Proposition, required: false, as_variable: true,
             doc: "the predication the rule ranges over when the sentence states it: the clause's own predication for an adverb on a clause with an attachment (Teodor always arrives at noon — the attachment stays on it), or the when / whenever clause's predication (whenever the bell rang, …); its id; never together with occasion"}
  ranges:   {type: refs, class: Proposition, required: false,
             doc: "the class range(s) of a generic subject or object in the same clause (ferrets often bite, every ferret sleeps every night): their ids in text order; absent otherwise"}
  over:     {type: refs, class: Proposition, required: false, skolemize: true,
             doc: "the predication over the occasions: its id, nothing else — or the id of the NORM over it (must lock the shed every night, may use the kitchen on Sundays, should always lock the shed: the norm instance over the act, so that the rule's consequent is the obligation or permission on each occasion); a negation or a modal over the clause names THIS instance instead; filled with occasion for a period of one unit, a rate or an adverb, and with restrictor for the main clause of a when-clause; empty for an adverb on a clause with an attachment; never together with event"}
  event:    {type: filler, class: Event, attaches: true, required: false,
             doc: "for a pattern recorded on the event instead — a period of more than one unit, or a bare count: the id of the clause's predication instance; never together with over"}
  every:    {type: number, required: false,
             doc: "the period as a number of units: 1 with occasion (every day, every morning, on Sundays, daily, annually) and for whenever / every time / each time with restrictor; the stated number with event (every two weeks → 2, every other day → 2, with unit)"}
  times:    {type: number, required: false,
             doc: "a count of occurrences — twice → 2, once → 1, three times → 3: with over, the count in each occasion of the range (twice a week → 2 with a range over week; once a year → 1 with a range over year); with event, a bare count (knocked twice)"}
  unit:     {type: lemma, class: Class, required: false,
             doc: "with event only: the time unit of a numeric period, singular and lowercase (every two weeks → week, every other day → day); with over the occasion range carries the class, so leave it empty"}
  level:    {type: lemma, class: Level, required: false,
             doc: "the frequency adverb as written, lowercase (always, usually, normally, generally, often, frequently, regularly, sometimes, occasionally, seldom, rarely); a phrase as one snake_case symbol (hardly_ever, from_time_to_time, once_in_a_while); never only with restrictor (never arrives late)"}
  word:     {type: string, required: false,
             doc: "the frequency expression as written (every morning, on Sundays, daily, twice a week, often); recorded, not rendered"}

one_of: [[occasion, restrictor, event], [every, times, level]]

truth:
  strength:                    # a weak norm under the frequency 0.7; else the quantifier over occasions: the adverb's dial, else a norm 1.0, else a graded class range, else every
    - {from: over, slot: weak, values: {"true": 0.7}}                   # should … every night / always: the norm's force, on the one dial
    - {slot: level, values: {always: 1.0, usually: 0.9, normally: 0.9, generally: 0.9, often: 0.7, frequently: 0.7, regularly: 0.7, sometimes: 0.5, occasionally: 0.5, from_time_to_time: 0.5, once_in_a_while: 0.5, seldom: 0.1, rarely: 0.1, hardly_ever: 0.1, never: 0.0}}
    - {from: over, slot: kind, values: {obligation: 1.0, permission: 1.0, prohibition: 1.0, exemption: 1.0}}   # a norm states no proportion
    - {from: ranges, slot: quantifier, values: {most: 0.9, many: 0.7, few: 0.1, "no": 0.0, none: 0.0}}
    - 1.0
  confidence:                  # an explicit frequency word states a proportion over occasions (0.9); an existential one — sometimes — states none (0.7); a norm is a prescription (0.99)
    - {slot: level, values: {sometimes: 0.7, occasionally: 0.7, from_time_to_time: 0.7, once_in_a_while: 0.7}}
    - {from: over, slot: kind, values: {obligation: 0.99, permission: 0.99, prohibition: 0.99, exemption: 0.99}}
    - 0.9

emits:
  # the rule over occasions
  - atom: "(Implication {occasion} {over})"
    if_filled: occasion
    when: "not ranges"
  - atom: "(Implication (And {ranges} {occasion}) {over})"
    if_filled: occasion
    when: "ranges"
  - atom: "(Time {over} {occasion})"                     # inside the consequent: the episode's time is the occasion
    within: over
    if_filled: occasion
  - atom: "(Times {over} {times})"                       # a rate: the count in each occasion, on that occasion's episode
    within: over
    if_filled: times
  # the rule over the clause's own events: the predication is the restrictor, its attachments the scope
  - atom: "(Implication {restrictor|own} {restrictor|attachments})"
    if_filled: restrictor
    when: "not over and not ranges"
  - atom: "(Implication (And {ranges} {restrictor|own}) {restrictor|attachments})"
    if_filled: restrictor
    when: "not over and ranges"
  # the rule over a when-clause's events: its predication is the restrictor, the main clause the scope
  - atom: "(Implication {restrictor|own} {over})"
    if_filled: restrictor
    when: "over and not ranges"
  - atom: "(Implication (And {ranges} {restrictor|own}) {over})"
    if_filled: restrictor
    when: "over and ranges"
  - atom: "(During {over} {restrictor})"                 # inside the consequent: the main clause's event falls within the when-clause's
    within: over
    if_filled: restrictor
  # a pattern recorded on the event
  - atom: "(Every {event} {every} {unit})"
    if_filled: event
    when: "every"
    stv: [1.0, 0.99]
  - atom: "(Times {event} {times})"
    if_filled: event
    when: "times"
    stv: [1.0, 0.99]

notes:
  - >-
    A rule, not a fact: the sentence commits to no particular episode, so none is minted at the
    top level — a top-level event is always an eventuality the text asserts. The episode is a
    function of the occasion, (sk_swim $t), and of every class range as well, (sk_sleep $x $t)
    for every ferret sleeping every night; its time is the occasion, (Time (sk_swim $t) $t). A
    time, a place or a manner on the clause is rendered inside the rule with its event, an
    indefinite inside it depends on the occasion, a name or a definite stays a constant.
  - >-
    The frequency adverbs are quantifiers over occasions — always, usually, often, sometimes,
    rarely — and set the rule's strength on the one dial the noun quantifiers use: always as
    every (1.0), usually as most (0.9), often as many (0.7), rarely as few (0.1); an existential
    adverb — sometimes, occasionally, from time to time — states that occasions exist and no
    proportion, so it gets the midpoint 0.5 at the no-proportion confidence 0.7, as a bare
    generic does;
    the confidence 0.9 is an explicit quantifier word's. "Never" is not a level but a negation of
    the clause. A negation or a modal over a clause with a frequency scopes over this rule:
    "Lamine does not laugh often" denies the frequent laughing, "Yusra might swim every day"
    qualifies the daily habit.
  - >-
    The occasion range is a range like any other, over a class of times: day, week, month, year,
    a day part (morning, night), a weekday (sunday). For an adverb with no stated period the
    class is occasion — an arbitrary occasion, the cases the adverb counts. A stated time joins
    the rule through its class: a time instance with a weekday or a day-of-month field is a day,
    and a Sunday, by the background rules.
  - >-
    The restrictor is taken from the sentence when it states one. An adverb on a clause with an
    attachment quantifies over that clause's own events — "Teodor always arrives at noon" says
    of every arrival of Teodor's that its time is noon: (Implication (And (Member $e arrive)
    (Agent $e sk_teodor_1)) (And (Time $e (sk_time $e)) (Hour (sk_time $e) 12))) — so a stated
    arrival instantiates it; an indefinite participant of the restrictor is a variable too. A
    when-clause is the restrictor of the clause it introduces, whose event falls within the
    when-clause's event: (During (sk_leave $e) $e). "Never" with a restrictor is the same rule at
    strength 0, the dual of always; on a bare clause it is a negation.
  - >-
    A rate is the rule over the unit with the count on each occasion's episode: "twice a week"
    says that in every week the visits number two, (Times (sk_visit $w) 2) — a plural episode per
    week, counted as "knocked twice" counts its two particular knocks, (Times e 2). A numeric
    period, "every two weeks", is not a quantifier over weeks and is recorded on the event as
    stated, (Every e 2 week): a pattern a later view may unfold.
  - >-
    A norm with a frequency — "Lamine must lock the shed every night", "Teodor may use the
    kitchen on Sundays", "Yusra should always lock the shed" — is the norm instance over the act
    and this rule over the occasions with the norm as its consequent: (Implication (Member $x
    night) (Obligated (And (Member (sk_lock $x) lock) (Agent (sk_lock $x) sk_lamine_1) (Patient
    (sk_lock $x) sk_shed_1) (Time (sk_lock $x) $x)))) — the obligation on each occasion, the act's
    time inside the sealed act, nothing asserted to happen; a stated night instantiates the
    obligation, as a stated member instantiates a class norm. The rule's strength is the norm's
    force first (a weak should 0.7, on the one dial), else the frequency word's proportion, else
    the norm's 1.0; its confidence the norm's 0.99.

depends_on: [range, time, activity]
composes_with: [negation, modal, norm, time, location]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: a period of one unit — a rule over the mornings, with the swim a function of the morning
      text: "Yusra swims every morning."
      instances:
        - {t: named-entity, id: n1, name: "Yusra", span: "Yusra"}
        - {t: activity, id: v1, verb: swim, actor: "@n1", tense: present, span: "Yusra swims"}
        - {t: range, id: q1, class: morning, quantifier: every, span: "every morning"}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], every: 1, word: "every morning", span: "every morning"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_yusra_1 \"Yusra\")"
        - "(Implication (Member $x morning) (And (Member (sk_swim $x) swim) (Agent (sk_swim $x) sk_yusra_1) (Time (sk_swim $x) $x)))"
      declarations:
        - "(: morning Class)"
        - "(: sk_swim_1 Event)"
        - "(: sk_yusra_1 Entity)"
        - "(: swim Class)"
        - "(: sk_swim (-> Atom Event))"
    - category: positive
      note: a frequency adverb — a rule over occasions whose strength is the adverb's
      text: "Ottoline often laughs."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline", span: "Ottoline"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: present, span: "Ottoline often laughs"}
        - {t: range, id: q1, class: occasion, span: "often"}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], level: often, word: often, span: "often"}
    - category: positive
      note: an adverb on a clause with a place — the restrictor is the clause's own events, the place is asserted of them
      text: "Yusra usually swims in the lake."
      instances:
        - {t: named-entity, id: n1, name: "Yusra", span: "Yusra"}
        - {t: witness, id: x1, class: lake, definite: true, span: "the lake"}
        - {t: activity, id: v1, verb: swim, actor: "@n1", tense: present, span: "Yusra usually swims"}
        - {t: location, id: l1, event: "@v1", place: "@x1", head: Location, preposition: in, span: "in the lake"}
        - {t: frequency, id: f1, restrictor: ["@v1"], level: usually, word: usually, span: "usually"}
    - category: positive
      note: a rate — a rule over the weeks, each week's episode carrying the count
      text: "Lamine visits the market twice a week."
      instances:
        - {t: named-entity, id: n1, name: "Lamine", span: "Lamine"}
        - {t: witness, id: x1, class: market, definite: true, span: "the market"}
        - {t: activity, id: v1, verb: visit, actor: "@n1", patient: "@x1", tense: present, span: "Lamine visits the market"}
        - {t: range, id: q1, class: week, span: "a week"}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], times: 2, word: "twice a week", span: "twice a week"}
    - category: abstain
      text: "Most students laugh."
      expected: {abstain: true, template: generic}                    # a quantifier over a class, no frequency
    - category: abstain
      text: "Lamine waited all day."
      expected: {abstain: true, gap: G00, span: "all day"}            # a duration

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: a daily period
      text: "Teodor reads every day."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: activity, id: v1, verb: read, actor: "@n1", tense: present}
        - {t: range, id: q1, class: day, quantifier: every}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], every: 1, word: "every day"}
    - category: positive
      note: a frequency adverb on a past clause — the tense rides into the rule
      text: "Lamine often laughed."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: past}
        - {t: range, id: q1, class: occasion}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], level: often, word: often}
    - category: positive
      note: a plural weekday — a rule over the Sundays
      text: "Ottoline swims on Sundays."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: activity, id: v1, verb: swim, actor: "@n1", tense: present}
        - {t: range, id: q1, class: sunday}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], every: 1, word: "on Sundays"}
    - category: positive
      note: an adverb of period — daily is a rule over the days
      text: "Lamine bakes bread daily."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: creation, id: e1, verb: bake, creator: "@n1", product: bread, tense: present}
        - {t: range, id: q1, class: day}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@e1"], every: 1, word: daily}
    - category: positive
      note: weekly — a rule over the weeks
      text: "Lamine visits the market weekly."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: market, definite: true}
        - {t: activity, id: v1, verb: visit, actor: "@n1", patient: "@x1", tense: present}
        - {t: range, id: q1, class: week}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], every: 1, word: weekly}
    - category: positive
      note: a nightly period in the past
      text: "Lamine sang every night."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: past}
        - {t: range, id: q1, class: night, quantifier: every}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], every: 1, word: "every night"}
    - category: positive
      note: an adverb beside a clock time — every arrival of Teodor's is at noon; the time instance is a function of the arrival
      text: "Teodor always arrives at noon."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: present}
        - {t: time, id: t1, event: "@m1", hour: 12}
        - {t: frequency, id: f1, restrictor: ["@m1"], level: always, word: always}
    - category: positive
      note: an existential adverb beside a place — some of Ottoline's waits are at the gate; the definite place stays a constant
      text: "Ottoline sometimes waits at the gate."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: witness, id: x1, class: gate, definite: true}
        - {t: activity, id: v1, verb: wait, actor: "@n1", tense: present}
        - {t: location, id: l1, event: "@v1", place: "@x1", head: Location, preposition: at}
        - {t: frequency, id: f1, restrictor: ["@v1"], level: sometimes, word: sometimes}
    - category: positive
      note: an adverb beside a named time — most of Yusra's sleeps are at night
      text: "Yusra usually sleeps at night."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: activity, id: v1, verb: sleep, actor: "@n1", tense: present}
        - {t: time, id: t1, event: "@v1", name: night}
        - {t: frequency, id: f1, restrictor: ["@v1"], level: usually, word: usually}
    - category: positive
      note: an adverb beside a manner
      text: "Lamine often sings loudly."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: present}
        - {t: manner, id: a1, event: "@v1", manner: loudly}
        - {t: frequency, id: f1, restrictor: ["@v1"], level: often, word: often}
    - category: positive
      note: never with a manner — the rule at strength 0
      text: "Teodor never arrives late."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: present}
        - {t: manner, id: a1, event: "@m1", manner: late}
