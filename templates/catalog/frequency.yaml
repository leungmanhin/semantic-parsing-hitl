# Template: frequency  (how often an event recurs: "swims every morning", "often laughs", "visits the market twice a week", "knocked twice")
#
# A frequency expression says how often the clause's event recurs. When it quantifies over
# occasions — a period of one unit (every day, every morning, on Sundays, daily, weekly) or a
# frequency adverb (always, often, rarely) — the clause becomes a RULE over an occasion range,
# with its own event per occasion, exactly as a generalization over a class does:
#   (Implication (Member $t morning) (And (Member (sk_swim $t) swim) (Agent (sk_swim $t) sk_yusra_1) (Time (sk_swim $t) $t)))
# The sentence asserts no particular swim, so no top-level swim is minted; the strength is the
# quantifier's (every / always 1.0, usually / often 0.8, sometimes 0.5, rarely 0.1) at confidence
# 0.9, and the range's instance record keeps the word. A pattern no single occasion carries
# — a period of more than one unit (every two weeks), a rate (twice a week) — and a bare count of
# occurrences (knocked twice) stay a tag on the event: (Every e 2 week), (TimesPer e 2 week),
# (Times e 2). The parser records the words; what "usually" amounts to is the program's dial.

id: frequency
family: rule
shape: rule
title: How often an event recurs
status: draft

trigger:
  construction: >
    An expression saying how often the clause's event recurs. Two forms. (1) A QUANTIFICATION
    OVER OCCASIONS: a period of one unit — every day, each morning, every Monday, on Sundays,
    every night, daily, weekly, monthly, yearly, annually, nightly — or a frequency adverb —
    always, usually, normally, generally, often, frequently, regularly, sometimes, occasionally,
    seldom, rarely, hardly ever, from time to time. The occasion is a range instance over the
    class of occasions (day, week, month, year; morning, night; sunday, monday; and `occasion`
    for an adverb with no stated period), the clause is parsed with its own template, and this
    instance names the range in `occasion` and the predication in `over` with `every: 1` for a
    period or `level` for the adverb; a generic subject or object (ferrets often bite, every
    ferret sleeps every night) is a range listed in `ranges`, and no generic instance is written.
    (2) A PATTERN RECORDED ON THE EVENT: a period of more than one unit (every two weeks, every
    other day, every three years), a rate (twice a week, once a year, three times a day, twice per
    month), or a bare count of occurrences (once, twice, three times): the clause's predication is
    named in `event` with `every` and `unit`, or `times` with or without `unit`. One instance per
    frequency expression; a clock time, a date or a place beside it (at noon every day) is an
    attachment on the event as always, rendered inside the rule.
  surface_forms:
    - "<clause> every / each <unit, day part or weekday>"    # swims every morning: a range over morning; every: 1
    - "<clause> on <weekday>s"                                # swims on Sundays: a range over sunday; every: 1
    - "<clause> daily / weekly / monthly / yearly / nightly"   # bakes bread daily: a range over day; every: 1
    - "<subject> <adverb> V … / <clause> <adverb>"             # often laughs: a range over occasion; level: often
    - "<class>s <adverb> V … / every <class> V … every <unit>"   # ferrets often bite: the class range in ranges
    - "<clause> every <n> <units> / every other <unit>"        # visits every two weeks: event, every: 2, unit: week
    - "<clause> once / twice / <n> times a / per <unit>"       # visits the market twice a week: event, times: 2, unit: week
    - "<clause> once / twice / <n> times"                      # knocked twice: event, times: 2
  boundary:                   # looks like a frequency but is not one
    - >-
      a quantifier on a non-temporal noun with no frequency — every ferret slept, most students
      laugh: a generalization over a class, the generic template
    - >-
      never — Yusra never laughs: a negation of the clause, with no frequency instance
    - >-
      again, still, already, yet — laughed again, still waits: an aspectual particle, a
      presupposition about an earlier state, not how often
    - >-
      a duration — all day, for years, for six hours: how long, a measure; no slot here; report
      the phrase as unmapped
    - >-
      every time or whenever with a clause — whenever the bell rings: a conditional over
      occasions, not a recurrence; reported as unmapped
    - >-
      a habitual past with used to — Lamine used to sing: a different construction; report the
      clause as unmapped
    - >-
      a time the event takes place at — in 2019, on Monday, at noon, yesterday: a time; a time
      stated once is not a recurrence (on Monday is a time, on Mondays a frequency)
    - >-
      once meaning formerly — Lamine once lived in Calderwick: a vague past time, not one
      occurrence; report the word as unmapped
    - >-
      a vague count — several times a week, a few times a year, many times: no number to
      record; report the phrase as unmapped
    - >-
      a rate per something that is not a time — one per person, twice per visit: a
      distribution, no slot here; report the phrase as unmapped
    - >-
      a multiplicative comparison — twice as tall, three times the size: a degree, not a count
      of occurrences

slots:
  id:       {type: id, required: true, doc: "your label for the frequency (f1, f2 …)"}
  occasion: {type: refs, class: Proposition, required: false,
             doc: "the range this rule quantifies over: the id of a range instance whose class is the occasion — day, week, month or year for a period of one unit (every day, daily, weekly), the day part or weekday for every morning / every night / on Sundays / every Monday (morning, night, sunday, monday), and occasion for a frequency adverb with no stated period (often); required with over"}
  ranges:   {type: refs, class: Proposition, required: false,
             doc: "the class range(s) of a generic subject or object in the same clause (ferrets often bite, every ferret sleeps every night): their ids in text order; absent otherwise"}
  over:     {type: refs, class: Proposition, required: false, skolemize: true,
             doc: "the predication over the occasions: its id, nothing else (a negation or a modal over the clause names THIS instance instead); filled for a period of one unit or an adverb, never together with event"}
  event:    {type: filler, class: Event, attaches: true, required: false,
             doc: "for a pattern recorded on the event instead — a period of more than one unit, a rate, a bare count: the id of the clause's predication instance; never together with over"}
  every:    {type: number, required: false,
             doc: "the period as a number of units: 1 with over (every day, every morning, on Sundays, daily, annually); the stated number with event (every two weeks → 2, every other day → 2, with unit)"}
  times:    {type: number, required: false,
             doc: "with event: a count of occurrences — twice → 2, once → 1, three times → 3 — per unit when a unit is stated (twice a week → 2, week), bare otherwise (knocked twice)"}
  unit:     {type: lemma, class: Class, required: false,
             doc: "with event: the time unit of a numeric period or a rate, singular and lowercase (minute, hour, day, week, month, year); with over the occasion range carries the class, so leave it empty"}
  level:    {type: lemma, class: Level, required: false,
             doc: "the frequency adverb as written, lowercase (always, usually, normally, generally, often, frequently, regularly, sometimes, occasionally, seldom, rarely); a phrase as one snake_case symbol (hardly_ever, from_time_to_time, once_in_a_while)"}
  word:     {type: string, required: false,
             doc: "the frequency expression as written (every morning, on Sundays, daily, twice a week, often); recorded, not rendered"}

one_of: [[over, event], [every, times, level]]

truth:
  strength:                    # the quantifier over occasions: the adverb's dial, else a graded class range, else every
    - {slot: level, values: {always: 1.0, usually: 0.8, normally: 0.8, generally: 0.8, often: 0.8, frequently: 0.8, regularly: 0.8, sometimes: 0.5, occasionally: 0.5, seldom: 0.1, rarely: 0.1, hardly_ever: 0.1, from_time_to_time: 0.5, once_in_a_while: 0.5}}
    - {from: ranges, slot: quantifier, values: {most: 0.9, many: 0.7, few: 0.1, "no": 0.0, none: 0.0}}
    - 1.0
  confidence:                  # an explicit frequency word states a proportion over occasions
    - 0.9

emits:
  # the rule over occasions
  - atom: "(Implication {occasion} {over})"
    if_filled: over
    when: "not ranges"
  - atom: "(Implication (And {ranges} {occasion}) {over})"
    if_filled: over
    when: "ranges"
  - atom: "(Time {over} {occasion})"                     # inside the consequent: the episode's time is the occasion
    within: over
  # a pattern recorded on the event
  - atom: "(Every {event} {every} {unit})"
    if_filled: event
    when: "every"
    stv: [1.0, 0.99]
  - atom: "(TimesPer {event} {times} {unit})"
    if_filled: event
    when: "times and unit"
    stv: [1.0, 0.99]
  - atom: "(Times {event} {times})"
    if_filled: event
    when: "times and not unit"
    stv: [1.0, 0.99]

notes:
  - >-
    A rule, not a fact: the sentence commits to no particular episode, so none is minted at the
    top level — a top-level event is always an eventuality the text asserts. The episode is a
    function of the occasion, (sk_swim $t), and of every class range as well, (sk_sleep $x $t)
    for every ferret sleeping every night; its time is the occasion, (Time (sk_swim $t) $t). A
    time, a place or a manner on the clause is rendered inside the rule with its event, an
    indefinite inside it depends on the occasion, a name or a definite stays a constant.
  - >-
    The frequency adverbs are quantifiers over occasions — always, usually, often, sometimes,
    rarely — and set the rule's strength as most, many and few do for a class, by the same dial;
    the confidence 0.9 is an explicit quantifier word's. "Never" is not a level but a negation of
    the clause. A negation or a modal over a clause with a frequency scopes over this rule:
    "Lamine does not laugh often" denies the frequent laughing, "Yusra might swim every day"
    qualifies the daily habit.
  - >-
    The occasion range is a range like any other, over a class of times: day, week, month, year,
    a day part (morning, night), a weekday (sunday). For an adverb with no stated period the
    class is occasion — an arbitrary occasion, the cases the adverb counts. A stated time joins
    the rule through its class: a time instance with a weekday or a day-of-month field is a day,
    and a Sunday, by the background rules.
  - >-
    A numeric period, a rate and a bare count are recorded on the event: "every two weeks" is not
    a quantifier over weeks, "twice a week" states two episodes in each week, "knocked twice"
    states two particular knocks (a plural episode, like a group of participants); the first two
    are patterns a later representation may unfold, the record keeps them as stated.

depends_on: [range, time, activity]
composes_with: [negation, modal, time, location]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: a period of one unit — a rule over the mornings, with the swim a function of the morning
      text: "Yusra swims every morning."
      instances:
        - {t: named-entity, id: n1, name: "Yusra", span: "Yusra"}
        - {t: activity, id: v1, verb: swim, actor: "@n1", tense: present, span: "Yusra swims"}
        - {t: range, id: q1, class: morning, quantifier: every, span: "every morning"}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], every: 1, word: "every morning", span: "every morning"}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_yusra_1 \"Yusra\")"
        - "(Implication (Member $x morning) (And (Member (sk_swim $x) swim) (Agent (sk_swim $x) sk_yusra_1) (Time (sk_swim $x) $x)))"
      declarations:
        - "(: morning Class)"
        - "(: sk_swim_1 Event)"
        - "(: sk_yusra_1 Entity)"
        - "(: swim Class)"
        - "(: sk_swim (-> Atom Event))"
    - category: positive
      note: a frequency adverb — a rule over occasions whose strength is the adverb's
      text: "Ottoline often laughs."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline", span: "Ottoline"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: present, span: "Ottoline often laughs"}
        - {t: range, id: q1, class: occasion, span: "often"}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], level: often, word: often, span: "often"}
    - category: positive
      note: a rate — a pattern recorded on the event, which stays a particular predication
      text: "Lamine visits the market twice a week."
      instances:
        - {t: named-entity, id: n1, name: "Lamine", span: "Lamine"}
        - {t: witness, id: x1, class: market, definite: true, span: "the market"}
        - {t: activity, id: v1, verb: visit, actor: "@n1", patient: "@x1", tense: present, span: "Lamine visits the market"}
        - {t: frequency, id: f1, event: "@v1", times: 2, unit: week, word: "twice a week", span: "twice a week"}
    - category: abstain
      text: "Most students laugh."
      expected: {abstain: true, template: generic}                    # a quantifier over a class, no frequency
    - category: abstain
      text: "Lamine waited all day."
      expected: {abstain: true, gap: G00, span: "all day"}            # a duration

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: a daily period
      text: "Teodor reads every day."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: activity, id: v1, verb: read, actor: "@n1", tense: present}
        - {t: range, id: q1, class: day, quantifier: every}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], every: 1, word: "every day"}
    - category: positive
      note: a frequency adverb on a past clause — the tense rides into the rule
      text: "Lamine often laughed."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: past}
        - {t: range, id: q1, class: occasion}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], level: often, word: often}
    - category: positive
      note: a plural weekday — a rule over the Sundays
      text: "Ottoline swims on Sundays."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: activity, id: v1, verb: swim, actor: "@n1", tense: present}
        - {t: range, id: q1, class: sunday}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], every: 1, word: "on Sundays"}
    - category: positive
      note: an adverb of period — daily is a rule over the days
      text: "Lamine bakes bread daily."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: creation, id: e1, verb: bake, creator: "@n1", product: bread, tense: present}
        - {t: range, id: q1, class: day}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@e1"], every: 1, word: daily}
    - category: positive
      note: weekly — a rule over the weeks
      text: "Lamine visits the market weekly."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: market, definite: true}
        - {t: activity, id: v1, verb: visit, actor: "@n1", patient: "@x1", tense: present}
        - {t: range, id: q1, class: week}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], every: 1, word: weekly}
    - category: positive
      note: a nightly period in the past
      text: "Lamine sang every night."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: past}
        - {t: range, id: q1, class: night, quantifier: every}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], every: 1, word: "every night"}
    - category: positive
      note: an adverb beside a clock time — the time instance is inside the rule, one per occasion
      text: "Teodor always arrives at noon."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: motion, id: m1, verb: arrive, mover: "@n1", tense: present}
        - {t: time, id: t1, event: "@m1", hour: 12}
        - {t: range, id: q1, class: occasion}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@m1"], level: always, word: always}
    - category: positive
      note: an adverb beside a place — the definite place stays a constant outside the rule
      text: "Ottoline sometimes waits at the gate."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: witness, id: x1, class: gate, definite: true}
        - {t: activity, id: v1, verb: wait, actor: "@n1", tense: present}
        - {t: location, id: l1, event: "@v1", place: "@x1", head: Location, preposition: at}
        - {t: range, id: q1, class: occasion}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], level: sometimes, word: sometimes}
    - category: positive
      note: an adverb beside a named time — the constant night inside the rule
      text: "Yusra usually sleeps at night."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: activity, id: v1, verb: sleep, actor: "@n1", tense: present}
        - {t: time, id: t1, event: "@v1", name: night}
        - {t: range, id: q1, class: occasion}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], level: usually, word: usually}
    - category: positive
      note: a low frequency adverb
      text: "Lamine rarely sings."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: activity, id: v1, verb: sing, actor: "@n1", tense: present}
        - {t: range, id: q1, class: occasion}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], level: rarely, word: rarely}
    - category: positive
      note: a two-word adverb as one symbol
      text: "Ottoline hardly ever laughs."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: present}
        - {t: range, id: q1, class: occasion}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], level: hardly_ever, word: "hardly ever"}
    - category: positive
      note: a generic subject and a period — one rule with two ranges, the sleep a function of both
      text: "Every ferret sleeps every night."
      instances:
        - {t: range, id: q1, class: ferret, quantifier: every}
        - {t: activity, id: v1, verb: sleep, actor: "@q1", tense: present}
        - {t: range, id: q2, class: night, quantifier: every}
        - {t: frequency, id: f1, ranges: ["@q1"], occasion: ["@q2"], over: ["@v1"], every: 1, word: "every night"}
    - category: positive
      note: a bare generic subject with an adverb — the adverb sets the strength, no generic instance
      text: "Ferrets often bite."
      instances:
        - {t: range, id: q1, class: ferret}
        - {t: activity, id: v1, verb: bite, actor: "@q1", tense: present}
        - {t: range, id: q2, class: occasion}
        - {t: frequency, id: f1, ranges: ["@q1"], occasion: ["@q2"], over: ["@v1"], level: often, word: often}
    - category: positive
      note: a period of two units — a pattern on the event
      text: "Yusra visits Lamine every two weeks."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: activity, id: v1, verb: visit, actor: "@n1", patient: "@n2", tense: present}
        - {t: frequency, id: f1, event: "@v1", every: 2, unit: week, word: "every two weeks"}
    - category: positive
      note: every other day — a period of two days on the event
      text: "Yusra swims every other day."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: activity, id: v1, verb: swim, actor: "@n1", tense: present}
        - {t: frequency, id: f1, event: "@v1", every: 2, unit: day, word: "every other day"}
    - category: positive
      note: a bare count of occurrences — two particular knocks
      text: "Teodor knocked twice."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: activity, id: v1, verb: knock, actor: "@n1", tense: past}
        - {t: frequency, id: f1, event: "@v1", times: 2, word: twice}
    - category: positive
      note: a rate of three per day
      text: "Yusra feeds the ferret three times a day."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: ferret, definite: true}
        - {t: activity, id: v1, verb: feed, actor: "@n1", patient: "@x1", tense: present}
        - {t: frequency, id: f1, event: "@v1", times: 3, unit: day, word: "three times a day"}
    - category: positive
      note: once a month
      text: "Teodor visits Yusra once a month."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: activity, id: v1, verb: visit, actor: "@n1", patient: "@n2", tense: present}
        - {t: frequency, id: f1, event: "@v1", times: 1, unit: month, word: "once a month"}
    - category: scoped
      note: a negation over the frequency — not often
      text: "Lamine does not laugh often."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: activity, id: v1, verb: laugh, actor: "@n1", tense: present}
        - {t: range, id: q1, class: occasion}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], level: often, word: often}
        - {t: negation, id: s1, over: ["@f1"]}
    - category: scoped
      note: a modal over the habit
      text: "Yusra might swim every day."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: activity, id: v1, verb: swim, actor: "@n1", tense: present}
        - {t: range, id: q1, class: day, quantifier: every}
        - {t: frequency, id: f1, occasion: ["@q1"], over: ["@v1"], every: 1, word: "every day"}
        - {t: modal, id: s1, over: ["@f1"], head: Might, surface: might}
    - category: abstain
      text: "Yusra never laughs."
      expected: {abstain: true, template: negation}                   # never is a negation
    - category: abstain
      text: "Every ferret slept."
      expected: {abstain: true, template: generic}                    # a quantifier on a class, no frequency
    - category: abstain
      text: "Whenever Yusra sang, the ferret hid."
      expected: {abstain: true, gap: G00, span: "Whenever"}           # a conditional over occasions
    - category: abstain
      text: "Lamine used to sing."
      expected: {abstain: true, gap: G00, span: "used to"}            # a habitual past construction
