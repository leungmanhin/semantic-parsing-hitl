# Template: kind-statement  (a kind is a kind or has a property: "Ferrets are mustelids")
#
# A statement about a kind as such, with no quantifier word: a bare plural (ferrets), a mass
# noun (granite) or a generic indefinite singular (a spindle is a tool). The atom is
# (Inheritance <kind> <predicate>) with the confidence dial of the substrate: 0.99 for a
# definitional or taxonomic claim, 0.9 for an empirical generalization. Tense, negation and
# modality are operators over the atom. A quantifier word (all, most, no, some) makes a
# quantified generalization, which is a different template.

id: kind-statement
family: predication
kind: copular
title: A kind is a kind or has a property
status: draft

trigger:
  construction: >
    A clause with "be" as its main verb whose subject names a kind rather than an individual —
    a bare plural (ferrets, herons), a mass noun (granite) or a generic indefinite singular
    (a spindle is a tool) — and whose predicate is an indefinite noun phrase or an adjective.
    The statement is definitional when it states what the kind is by definition or taxonomy
    (ferrets are mustelids, a spindle is a tool) and empirical when it generalizes over the
    kind's members (ferrets are curious). No quantifier word is present.
  surface_forms:
    - "<kind>s are <N>s"                       # ferrets are mustelids
    - "<kind>s are <ADJ>"                      # ferrets are curious
    - "<mass noun> is a <N>"                   # granite is a rock
    - "a <kind> is a <N>"                      # a spindle is a tool (generic indefinite)
  boundary:                   # looks like a kind statement but is not one
    - >-
      an individual as the subject — Teodor is a locksmith, the ladder is crooked: a
      predication about one individual
    - >-
      a quantifier word — all ferrets are curious, most herons are patient, no reptile is
      warm-blooded: a quantified generalization carrying its quantifier
    - >-
      a definite plural — the ferrets are curious: a specific group of individuals, not the kind
    - >-
      a property of the kind as a whole that no member holds — ferrets are widespread, the
      dodo is extinct, herons are common: a kind-level property, not a generalization
    - >-
      a copular verb other than be — herons seem patient, ferrets became popular: evidential,
      or a change of state

slots:
  id:           {type: id, required: true, doc: "your label for the statement"}
  subject:      {type: lemma, class: Class, required: true, doc: "the kind, lemmatized to the singular (ferret, granite, spindle)"}
  predicate:    {type: lemma, class: Class, required: true, doc: "the kind (mustelid) or the property (curious), lemmatized"}
  form:         {type: enum, values: [noun, adjective], required: true,
                 doc: "noun for a kind predicate, adjective for a property"}
  definitional: {type: bool, required: true,
                 doc: "true for a definitional or taxonomic claim (ferrets are mustelids), false for an empirical generalization (ferrets are curious)"}
  tense:        {type: enum, values: [past, present, future], required: true,
                 doc: "the clause's tense; present is recorded, not inferred"}
  aspect:       {type: enum, values: [simple, progressive, perfect], required: false, default: simple}

truth: {slot: definitional, values: {"true": [1.0, 0.99], "false": [1.0, 0.9]}, default: [1.0, 0.9]}

emits:
  - atom: "(Inheritance {subject} {predicate})"
    when: "tense == present and aspect != perfect and aspect != progressive"
  - atom: "(Past (Inheritance {subject} {predicate}))"
    when: "tense == past or aspect == perfect"
  - atom: "(Future (Inheritance {subject} {predicate}))"
    when: "tense == future"
  - atom: "(Ongoing (Inheritance {subject} {predicate}))"
    when: "aspect == progressive"

notes:
  - >-
    The confidence dial is the parser's one judgment here: definitional claims hold by
    definition (0.99), empirical ones admit exceptions (0.9). The program sets the value; the
    parser records only the boolean.
  - >-
    Kind-level properties that no member holds (extinct, widespread, common) are not
    generalizations over members and would be wrong as Inheritance; they wait for their own
    template.

depends_on: []
composes_with: [negation, modal]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      note: definitional
      text: "Ferrets are mustelids."
      instances:
        - {t: kind-statement, id: k1, subject: ferret, predicate: mustelid, form: noun,
           definitional: true, tense: present}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Inheritance ferret mustelid)"
      declarations:
        - "(: ferret Class)"
        - "(: mustelid Class)"
    - category: positive
      note: empirical — the program lowers the confidence
      text: "Ferrets are curious."
      instances:
        - {t: kind-statement, id: k1, subject: ferret, predicate: curious, form: adjective,
           definitional: false, tense: present}
    - category: abstain
      text: "Teodor is a locksmith."
      expected: {abstain: true, template: copular}                     # an individual as the subject
    - category: abstain
      text: "All ferrets are curious."
      expected: {abstain: true, template: generic}                     # a quantifier word

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: definitional
      text: "Herons are birds."
      instances:
        - {t: kind-statement, id: k1, subject: heron, predicate: bird, form: noun,
           definitional: true, tense: present}
    - category: contrast
      note: the confidence dial — an empirical generalization about the same kind
      text: "Herons are patient."
      instances:
        - {t: kind-statement, id: k1, subject: heron, predicate: patient, form: adjective,
           definitional: false, tense: present}
    - category: positive
      note: a mass noun
      text: "Granite is a rock."
      instances:
        - {t: kind-statement, id: k1, subject: granite, predicate: rock, form: noun,
           definitional: true, tense: present}
    - category: positive
      note: a generic indefinite singular
      text: "A spindle is a tool."
      instances:
        - {t: kind-statement, id: k1, subject: spindle, predicate: tool, form: noun,
           definitional: true, tense: present}
    - category: positive
      note: past tense
      text: "Dinosaurs were reptiles."
      instances:
        - {t: kind-statement, id: k1, subject: dinosaur, predicate: reptile, form: noun,
           definitional: true, tense: past}
    - category: scoped
      note: under clausal negation
      text: "Ferrets are not rodents."
      instances:
        - {t: kind-statement, id: k1, subject: ferret, predicate: rodent, form: noun,
           definitional: true, tense: present}
        - {t: negation, id: s1, over: ["@k1"]}
    - category: scoped
      note: under a modal, empirical
      text: "Herons might be migratory."
      instances:
        - {t: kind-statement, id: k1, subject: heron, predicate: migratory, form: adjective,
           definitional: false, tense: present}
        - {t: modal, id: s1, over: ["@k1"], head: Might, surface: might}
    - category: abstain
      text: "Most herons are patient."
      expected: {abstain: true, template: generic}                     # a quantifier word
    - category: abstain
      text: "The ferrets are curious."
      expected: {abstain: true, template: group}                       # a definite plural
    - category: abstain
      text: "Yusra is a weaver."
      expected: {abstain: true, template: copular}                     # an individual as the subject
    - category: abstain
      text: "Ferrets are widespread."
      expected: {abstain: true, gap: G00, span: "Ferrets are widespread."}   # a kind-level property
