# Template: attitude  (a propositional attitude: a holder and a sealed complement clause)
#
# The complement clause is parsed with the ordinary templates (its predication, its referents,
# any negation or modal over it); the attitude instance REFERENCES those instances in its
# `content` slot. The emitter renders them inside the attitude's Theme as one sealed term and
# not on their own, so a non-factive attitude asserts nothing about the complement. A factive
# attitude (know, realize …) presupposes the complement: it is also emitted flat, at the top
# level, whatever scope the attitude itself sits in — a presupposition projects through
# negation ("Yusra does not know that P" still says P).

id: attitude
family: predication
shape: verb-class
title: A propositional attitude towards a complement clause
status: draft

trigger:
  construction: >
    A clause whose verb expresses a mental or reporting attitude of its subject (the holder)
    towards a complement clause: a finite clause introduced by "that" or bare, or a
    to-infinitive naming what the holder wants, hopes, intends, plans, decides, promises or
    agrees to do (wants to send the quilt) or expects of someone (expects Lamine to come).
    Non-factive verbs (believe, think, suppose, assume, suspect, doubt, hope, fear, expect,
    claim, say, want, wish, intend, plan, decide, promise, agree) do not assert the complement;
    factive verbs (know, realize, discover, learn, notice, remember, regret) presuppose it. A
    finite complement has a subject and a tense of its own; an infinitival one is parsed with
    the holder as its actor (or the object, when the syntax supplies one) and tense present.
  verbs: [believe, think, suppose, assume, suspect, doubt, hope, fear, expect, claim, say,
          want, wish, intend, plan, decide, promise, agree,
          know, realize, discover, learn, notice, remember, regret]
  verbs_note: >
    The lists anchor the two classes; an unlisted verb that takes a finite complement belongs
    here, with `factive` decided by whether the verb presupposes the complement — the
    complement survives negation of the attitude ("did not realize that P" still entails P).
  surface_forms:
    - "<holder> V that <clause>"                 # believes that Lamine lent Ottoline the trowel
    - "<holder> V <clause>"                      # thinks Lamine lent Ottoline the trowel
    - "<holder> V-ed that <clause>"              # tense on the attitude; the clause keeps its own
    - "<holder> V to <V2> …"                     # wants to send the quilt: the holder acts in the complement
    - "<holder> V <object> to <V2> …"            # expects Lamine to come: the object acts in it
  boundary:                   # looks like an attitude but is not one
    - >-
      an entity object instead of a clause — fears the dog, distrusts Lamine, knows Yusra: a
      psych state or an acquaintance; nothing is sealed
    - >-
      an effort or an achievement towards an action — tried to sleep, managed to open the shed,
      failed to arrive: a control verb, whose implication about the action is recorded there
    - >-
      a liking or a dislike of an action — likes to send quilts, enjoys sending quilts: a psych
      state whose stimulus is the clause
    - >-
      an interrogative complement — wonders whether, knows whether, asks if: the complement is
      a question, not a proposition
    - >-
      an addressee — told Ottoline that P, informed Yusra that P: a communication with a
      recipient of the message, not an attitude of the subject alone
    - >-
      a parenthetical or discourse use — I think, you know, as far as I know: no attitude is
      predicated of anyone

slots:
  id:      {type: id, required: true, doc: "your label for the attitude event"}
  verb:    {type: lemma, class: Class, required: true, doc: "the attitude verb lemma"}
  holder:  {type: filler, class: Entity, role: Experiencer, required: true,
            doc: "who holds the attitude: the subject"}
  content: {type: refs, class: Proposition, required: true,
            doc: "the complement clause: the ids of the instances that state it, that is its predication or the scope operator (negation, modal) over that predication; for an infinitival complement, its predication with the holder (or the object) as its actor; the referents it mentions are not listed"}
  factive: {type: bool, required: true,
            doc: "true when the verb presupposes the complement (know, realize, discover, learn, notice, remember, regret), false otherwise (believe, think, suppose, assume, suspect, doubt, hope, fear, expect, claim, say, want, wish, intend, plan, decide, promise, agree)"}
  tense:   {type: enum, values: [past, present, future], required: true,
            doc: "the attitude clause's tense; present is recorded, not inferred"}
  aspect:  {type: enum, values: [simple, progressive, perfect], required: false, default: simple}

mints: {id: Event}

emits:
  - atom: "(Member @id {verb})"
  - atom: "(Experiencer @id {holder})"
  - atom: "(Theme @id {content})"           # the complement, sealed as one term
  - atom: "{content}"                       # a factive's complement is presupposed: also stated flat,
    each: content                           # one statement per conjunct,
    when: "factive == true"
    project: true                           # at the top level whatever scope the attitude sits in
  - atom: "(Past @id)"
    when: "tense == past or aspect == perfect"
  - atom: "(Future @id)"
    when: "tense == future"
  - atom: "(Ongoing @id)"
    when: "aspect == progressive"

notes:
  - >-
    Sealing is what makes belief safe: the complement's atoms appear only inside the Theme
    term, so nothing in the complement is asserted or queryable on its own, while a query can
    still bind variables inside the term.
  - >-
    The factive complement is emitted flat by the parse rather than derived by a background
    rule, because the presupposition projects through negation of the attitude: a rule keyed
    on the attitude event would not fire when the attitude is negated.
  - >-
    "say" and "claim" with a that-clause report a proposition on the subject's authority and
    belong here; with an addressee the clause is a communication.

depends_on: [named-entity, witness, transfer, negation, modal]     # what states the complement
composes_with: [negation, modal, time]

examples:
  shown:                     # rendered into the prompt
    - category: positive
      text: "Teodor believes that Lamine lent Ottoline the trowel."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: named-entity, id: n3, name: "Ottoline"}
        - {t: witness, id: x1, class: trowel, definite: true}
        - {t: transfer, id: e1, verb: lend, giver: "@n2", recipient: "@n3", object: "@x1", tense: past}
        - {t: attitude, id: a1, verb: believe, holder: "@n1", content: ["@e1"], factive: false,
           tense: present}
      emitted:               # what the emitter produces (illustration; the emitter is the authority)
        - "(Name sk_teodor_1 \"Teodor\")"
        - "(Name sk_lamine_1 \"Lamine\")"
        - "(Name sk_ottoline_1 \"Ottoline\")"
        - "(Member sk_trowel_1 trowel)"
        - "(Member sk_believe_1 believe)"
        - "(Experiencer sk_believe_1 sk_teodor_1)"
        - "(Theme sk_believe_1 (And (Member sk_lend_1 lend) (Agent sk_lend_1 sk_lamine_1) (Recipient sk_lend_1 sk_ottoline_1) (Theme sk_lend_1 sk_trowel_1) (Past sk_lend_1)))"
      declarations:
        - "(: believe Class)"
        - "(: lend Class)"
        - "(: sk_believe_1 Event)"
        - "(: sk_lamine_1 Entity)"
        - "(: sk_lend_1 Event)"
        - "(: sk_ottoline_1 Entity)"
        - "(: sk_teodor_1 Entity)"
        - "(: sk_trowel_1 Entity)"
        - "(: trowel Class)"
    - category: positive
      note: factive — the complement is also stated flat
      text: "Yusra knows that Teodor sold the spindle."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: named-entity, id: n2, name: "Teodor"}
        - {t: witness, id: x1, class: spindle, definite: true}
        - {t: transfer, id: e1, verb: sell, giver: "@n2", object: "@x1", tense: past}
        - {t: attitude, id: a1, verb: know, holder: "@n1", content: ["@e1"], factive: true,
           tense: present}
    - category: positive
      note: a reporting verb with no addressee is an attitude
      text: "Teodor said that Lamine sold the spindle."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: witness, id: x1, class: spindle, definite: true}
        - {t: transfer, id: e1, verb: sell, giver: "@n2", object: "@x1", tense: past}
        - {t: attitude, id: a1, verb: say, holder: "@n1", content: ["@e1"], factive: false,
           tense: past}
    - category: positive
      note: a perception verb with a that-clause is a factive attitude
      text: "Teodor saw that Lamine sold the spindle."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: witness, id: x1, class: spindle, definite: true}
        - {t: transfer, id: e1, verb: sell, giver: "@n2", object: "@x1", tense: past}
        - {t: attitude, id: a1, verb: see, holder: "@n1", content: ["@e1"], factive: true,
           tense: past}
    - category: abstain
      text: "Teodor told Ottoline that Lamine sold the spindle."
      expected: {abstain: true, template: communication}             # an addressee
    - category: abstain
      text: "Yusra distrusts Lamine."
      expected: {abstain: true, template: psych}                     # an entity object
    - category: positive
      note: an infinitival complement — the holder acts in it; nothing is asserted about the sending
      text: "Ottoline wants to send the quilt."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: witness, id: x1, class: quilt, definite: true}
        - {t: transfer, id: e1, verb: send, giver: "@n1", object: "@x1", tense: present}
        - {t: attitude, id: a1, verb: want, holder: "@n1", content: ["@e1"], factive: false, tense: present}

  held_out:                  # tests; never rendered into the prompt
    - category: positive
      note: a witness introduced inside the complement stays inside the seal
      text: "Teodor suspects that Lamine sold a spindle."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: witness, id: x1, class: spindle}
        - {t: transfer, id: e1, verb: sell, giver: "@n2", object: "@x1", tense: past}
        - {t: attitude, id: a1, verb: suspect, holder: "@n1", content: ["@e1"], factive: false,
           tense: present}
    - category: contrast
      note: holder and giver swapped — the instances must differ in holder and giver only
      text: "Lamine suspects that Teodor sold a spindle."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Teodor"}
        - {t: witness, id: x1, class: spindle}
        - {t: transfer, id: e1, verb: sell, giver: "@n2", object: "@x1", tense: past}
        - {t: attitude, id: a1, verb: suspect, holder: "@n1", content: ["@e1"], factive: false,
           tense: present}
    - category: positive
      note: bare complement, no "that"; past attitude
      text: "Ottoline thought Yusra handed Lamine an envelope."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: named-entity, id: n3, name: "Lamine"}
        - {t: witness, id: x1, class: envelope}
        - {t: transfer, id: e1, verb: hand, giver: "@n2", recipient: "@n3", object: "@x1", tense: past}
        - {t: attitude, id: a1, verb: think, holder: "@n1", content: ["@e1"], factive: false,
           tense: past}
    - category: contrast
      note: factivity — the verb changes, factive becomes true, the complement is also stated flat
      text: "Ottoline realized Yusra handed Lamine an envelope."
      instances:
        - {t: named-entity, id: n1, name: "Ottoline"}
        - {t: named-entity, id: n2, name: "Yusra"}
        - {t: named-entity, id: n3, name: "Lamine"}
        - {t: witness, id: x1, class: envelope}
        - {t: transfer, id: e1, verb: hand, giver: "@n2", recipient: "@n3", object: "@x1", tense: past}
        - {t: attitude, id: a1, verb: realize, holder: "@n1", content: ["@e1"], factive: true,
           tense: past}
    - category: scoped
      note: the attitude negated — the complement stays sealed inside
      text: "Teodor does not believe that Lamine sold the spindle."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: witness, id: x1, class: spindle, definite: true}
        - {t: transfer, id: e1, verb: sell, giver: "@n2", object: "@x1", tense: past}
        - {t: attitude, id: a1, verb: believe, holder: "@n1", content: ["@e1"], factive: false,
           tense: present}
        - {t: negation, id: s1, over: ["@a1"]}
    - category: scoped
      note: a factive negated — the presupposed complement still stands at the top level
      text: "Yusra does not know that Teodor sold the spindle."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: named-entity, id: n2, name: "Teodor"}
        - {t: witness, id: x1, class: spindle, definite: true}
        - {t: transfer, id: e1, verb: sell, giver: "@n2", object: "@x1", tense: past}
        - {t: attitude, id: a1, verb: know, holder: "@n1", content: ["@e1"], factive: true,
           tense: present}
        - {t: negation, id: s1, over: ["@a1"]}
    - category: scoped
      note: a modal inside the complement — the content is the modal, which scopes over the transfer
      text: "Teodor believes that Lamine might lend Ottoline the trowel."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: named-entity, id: n3, name: "Ottoline"}
        - {t: witness, id: x1, class: trowel, definite: true}
        - {t: transfer, id: e1, verb: lend, giver: "@n2", recipient: "@n3", object: "@x1", tense: present}
        - {t: modal, id: s1, over: ["@e1"], head: Might, surface: might}
        - {t: attitude, id: a1, verb: believe, holder: "@n1", content: ["@s1"], factive: false,
           tense: present}
    - category: scoped
      note: negation inside the complement — the content is the negation
      text: "Teodor believes that Lamine did not sell the spindle."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: witness, id: x1, class: spindle, definite: true}
        - {t: transfer, id: e1, verb: sell, giver: "@n2", object: "@x1", tense: past}
        - {t: negation, id: s1, over: ["@e1"]}
        - {t: attitude, id: a1, verb: believe, holder: "@n1", content: ["@s1"], factive: false,
           tense: present}
    - category: optional
      note: perfect aspect on the attitude
      text: "Lamine had assumed that Ottoline sent the quilt."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Ottoline"}
        - {t: witness, id: x1, class: quilt, definite: true}
        - {t: transfer, id: e1, verb: send, giver: "@n2", object: "@x1", tense: past}
        - {t: attitude, id: a1, verb: assume, holder: "@n1", content: ["@e1"], factive: false,
           tense: past, aspect: perfect}
    - category: positive
      note: a psych verb with a clause is an attitude
      text: "Yusra fears that Lamine sold the spindle."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: witness, id: x1, class: spindle, definite: true}
        - {t: transfer, id: e1, verb: sell, giver: "@n2", object: "@x1", tense: past}
        - {t: attitude, id: a1, verb: fear, holder: "@n1", content: ["@e1"], factive: false,
           tense: present}
    - category: abstain
      text: "Yusra knows Lamine."
      expected: {abstain: true, gap: G00, span: "knows Lamine"}                 # an entity object: acquaintance
    - category: abstain
      text: "Teodor wonders whether Lamine sold the spindle."
      expected: {abstain: true, gap: G00, span: "wonders whether Lamine sold the spindle"}   # interrogative complement
    - category: positive
      note: the object acts in the complement
      text: "Teodor expects Lamine to come."
      instances:
        - {t: named-entity, id: n1, name: "Teodor"}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: motion, id: m1, verb: come, mover: "@n2", tense: present}
        - {t: attitude, id: a1, verb: expect, holder: "@n1", content: ["@m1"], factive: false, tense: present}
    - category: positive
      note: a decision
      text: "Lamine decided to leave."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: motion, id: m1, verb: leave, mover: "@n1", tense: present}
        - {t: attitude, id: a1, verb: decide, holder: "@n1", content: ["@m1"], factive: false, tense: past}
    - category: abstain
      text: "Yusra told Teodor that Ottoline sent the quilt."
      expected: {abstain: true, template: communication}
