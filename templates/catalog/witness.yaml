# Template: witness  (stub for review: the minimal referent template a common-noun phrase needs)

id: witness
family: referent
shape: referent
title: A common-noun phrase introducing an individual
status: stub

trigger:
  construction: >
    A noun phrase headed by a common noun with a determiner or a modifier — a flask, the
    blanket, this bobbin, two envelopes' member — introducing an individual of that class. The
    individual gets a numbered witness symbol; whether the phrase is definite is recorded. A
    possessive phrase (Marisol's blanket, the blanket of Marisol, her blanket) is a witness with its
    possessor recorded: the possessor is a referent — a name, a witness, or for a possessive
    pronoun (her blanket) a mention instance of its own, linked to its antecedent by a coref
    instance; the possessor presupposes the witness, so no definite mark is needed. A
    noun that names an event or a period (session, inspection, war, trip, storm) is a witness like any
    other; when the clause puts the noun itself in time (the session is at noon, the inspection was on
    Monday) or places another event relative to it (left after the inspection, slept during the
    session), mark it eventive so that the time or the relation can attach to it. A MASS noun
    with a quantity phrase — a lot of water, plenty of hail, lots of sugar, a little salt — or
    with a container or measure word — a cup of tea, a bag of flour — is a witness of the stuff
    (the quantity of it the text introduces): the vague phrase is recorded in `quantity`; a
    container or measure word is a measure instance on the witness. A noun, a name or a year
    before the head noun (a harbour pilot, a Brackenford blanket, a 1904 almanac) narrows the
    class: the head is the class and the words before it are its `mods`. Former, ex- or retired
    before the noun (a former guard) sets `former`: it was one and is not now. Another or the
    other before the noun (another badger) is a witness of its own, never coreferent with the
    earlier one; the word itself is not reported. An INDEFINITE PRONOUN introduces a witness
    like an indefinite noun phrase: someone, somebody, anyone, anybody are a witness of class
    person; something, anything a witness of class thing (somebody is knitting: a witness
    person, indefinite). Nearby before a noun (a nearby farm) is an ordinary adjective of the
    noun, recorded with the others. An EPISTEMIC or a distancing adjective before the noun —
    alleged, suspected, probable, presumed, so-called, would-be (an alleged smuggler, three
    probable cases) — is not a property: the noun does not hold of the referent on its own, and
    there is no slot yet; report the noun phrase as unmapped (G00), and the whole clause when
    its claim depends on the noun.
  surface_forms:
    - "a <N>"                       # indefinite
    - "the <N>"                     # definite
    - "<Adj> <N>"                   # the property is recorded beside the class
    - "<N1> <N2>"                   # a harbour pilot: class pilot, mods [harbour]
    - "<possessor>'s <N>"           # the possessor is recorded; definite
    - "the <N> of <possessor>"      # the same
    - "a lot of / plenty of <mass N>"   # a witness of the stuff, the phrase recorded
    - "someone / somebody / something"   # a witness of class person or thing
  boundary:
    - >-
      a bare plural read generically — dogs bark: a class-level statement, not a witness
    - >-
      a negative or universal pronoun — nobody, no one, nothing, everyone, everybody,
      everything: a range over person or thing with its quantifier (no, every), a
      generalization, not a witness
    - >-
      a plural noun phrase — the badgers, two envelopes: a group of individuals, not one
      witness
    - >-
      a proper name — Pieter: a named entity

slots:
  id:       {type: id, required: true}
  class:     {type: lemma, class: Class, required: true, narrowed_by: [props, mods], doc: "the head noun's lemma"}
  definite: {type: bool, required: false, doc: "true for the / this / that; absent for a / an and for a possessed phrase (the possessor presupposes it)"}
  props:    {type: list, class: Class, restriction: Member, required: false,
             doc: "adjectival properties stated in the phrase; a property with a degree word (a very old bobbin) is a degree instance beside the witness, not a property here; a noun before the head is a mod, never a property"}
  former:   {type: bool, required: false, doc: "true when former, ex-, one-time or retired makes the noun something the referent was and no longer is (a former guard)"}
  mods:     {type: list, class: Class, ids: [named-entity, time], required: false,
             doc: "the nouns, names and years before the head noun that narrow its class (Nouns before nouns): a lemma for a noun (a harbour pilot: harbour; a sea salt grinder: sea_salt), the id of a named-entity instance for a name (a Brackenford blanket), of a time instance for a year, a decade or a century (a 1904 almanac); never an adjective — a compass word before a common noun (a northern cottage) is a prop (northern), never a witness or a mod"}
  possessor: {type: filler, class: Entity, required: false,
              doc: "the possessor of a possessive phrase: Marisol's blanket, the blanket of Marisol, her blanket — an owner or an associate, NOT a whole the noun is a part of (the lid of the chest, the chest's lid, the car engine, the top of the barrow: no possessor, the witness definite, and a part-whole instance links the two), NOT the other party of a singular relational noun (her son, Joost's grandmother, the fellowship's treasurer: no possessor, a stative-relation instance with the witness as its bearer); a referent id (for a possessive pronoun, the id of its mention instance), or a bare lemma for a class-level possessor"}
  tags:     {type: list, class: String, required: false, verbatim: true,
             doc: "a label or a code written right after the noun phrase — a commit hash, an id, a model or registry code, an abbreviation of the phrase in brackets — each as written, without the brackets around it (Tags after a name); never decoded"}
  quantity: {type: string, required: false,
             doc: "a vague amount phrase on a mass noun, as written (a lot, lots, plenty, a little, a bit, much); absent otherwise"}
  eventive: {type: bool, required: false,
             doc: "true when the noun names an event or a period and the clause puts the noun itself in time (the session is at noon), a year before it names its time (the 1904 flood), or the clause places another event relative to it (after the inspection, during the session); absent otherwise"}

mints: {id: Entity, stem: class, also: {Event: eventive}}      # an eventive witness is an Event too

presupposed: [definite, possessor]      # a definite or possessed witness exists whatever scope mentions it

emits:
  - atom: "(Member @id {class|mod})"
    with_head: class                # a harbour pilot is a pilot too
    when: "not former"
  - atom: "(Past (Member @id {class|mod}))"
    with_head: class                # former: it was one
    when: "former"
  - atom: "(Not (Member @id {class|mod}))"
    when: "former"                  # and is not one now
  - atom: "(Implication (Member @id {class|mod}) (Member @id {props}))"   # the plain adjective, a weaker derivation from the stated narrowed class
    each: props
    top_level: true
    stv: [0.9, 0.7]
  - atom: "(Possession @id {possessor})"
    if_filled: possessor
  - atom: "(QuantityPhrase @id \"{quantity}\")"
    if_filled: quantity
  - atom: "(Tag @id \"{tags}\")"             # a label or a code after the noun phrase, as written: a surface record
    each: tags

examples:
  shown:
    - category: positive
      text: "a flask"
      instances:
        - {t: witness, id: n1, class: flask, span: "a flask"}
    - category: positive
      note: a comparative before the noun with no standard stated — the adjective as written, no comparison
      text: "Odile bought a sturdier bracket."
      instances:
        - {t: named-entity, id: n1, name: "Odile", span: "Odile"}
        - {t: witness, id: x1, class: bracket, props: [sturdier], span: "a sturdier bracket"}
        - {t: acquisition, id: q1, verb: buy, acquirer: "@n1", object: "@x1", tense: past, span: "Odile bought a sturdier bracket"}
    - category: positive
      note: a possessive phrase — the possessor is a referent of its own
      text: "Marisol's blanket"
      instances:
        - {t: named-entity, id: n1, name: "Marisol", span: "Marisol"}
        - {t: witness, id: x1, class: blanket, possessor: "@n1", span: "Marisol's blanket"}
    - category: positive
      note: a noun before the noun narrows its class — the head is the class, the noun before it a mod
      text: "a harbour pilot"
      instances:
        - {t: witness, id: x1, class: pilot, mods: [harbour], span: "a harbour pilot"}
  held_out:
    - category: positive
      note: an indefinite pronoun for a person — a witness of class person
      text: "Somebody is knitting a quilt."
      instances:
        - {t: witness, id: x1, class: person}
        - {t: witness, id: x2, class: quilt}
        - {t: activity, id: v1, verb: knit, actor: "@x1", patient: "@x2", tense: present, aspect: progressive}
    - category: positive
      note: an indefinite pronoun for a thing — a witness of class thing
      text: "Something is burning in the kitchen."
      instances:
        - {t: witness, id: x1, class: thing}
        - {t: witness, id: x2, class: kitchen, definite: true}
        - {t: change-of-state, id: c1, verb: burn, undergoer: "@x1", tense: present, aspect: progressive}
        - {t: location, id: l1, event: "@c1", place: "@x2", head: Location, preposition: in}
    - category: positive
      note: a comparative before the noun with no standard — the adjective as written, no comparison
      text: "An older weaver is mending a quilt."
      instances:
        - {t: witness, id: x1, class: weaver, props: [older]}
        - {t: witness, id: x2, class: quilt}
        - {t: activity, id: v1, verb: mend, actor: "@x1", patient: "@x2", tense: present, aspect: progressive}
    - category: positive
      note: nearby before a noun is an adjective of the noun
      text: "Yusra is watching the nearby mill."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: mill, definite: true, props: [nearby]}
        - {t: perception, id: p1, verb: watch, perceiver: "@n1", stimulus: "@x1", tense: present, aspect: progressive}
    - category: positive
      note: a vague amount of a mass — a witness of the stuff with the phrase recorded
      text: "Lamine drank a lot of water."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: water, quantity: a lot}
        - {t: activity, id: v1, verb: drink, actor: "@n1", patient: "@x1", tense: past}
    - category: positive
      note: a property stated in the phrase
      text: "Lamine washed the old quilt."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: quilt, definite: true, props: [old]}
        - {t: activity, id: v1, verb: wash, actor: "@n1", patient: "@x1", tense: past}
    - category: positive
      note: a possessive of-phrase — the possessor, not a postmodifier; no definite mark
      text: "Lamine washed the quilt of Teodor."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: named-entity, id: n2, name: "Teodor"}
        - {t: witness, id: x1, class: quilt, possessor: "@n2"}
        - {t: activity, id: v1, verb: wash, actor: "@n1", patient: "@x1", tense: past}
    - category: positive
      note: a name before the noun — the named entity's id in mods
      text: "Yusra washed an Aldmoor shawl."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: named-entity, id: n2, name: "Aldmoor"}
        - {t: witness, id: x1, class: shawl, mods: ["@n2"]}
        - {t: activity, id: v1, verb: wash, actor: "@n1", patient: "@x1", tense: past}
    - category: positive
      note: a year before a noun that names no event — a time instance with no event, its id in mods
      text: "Bram sold a 1923 tractor."
      instances:
        - {t: named-entity, id: n1, name: "Bram"}
        - {t: time, id: t1, year: 1923}
        - {t: witness, id: x1, class: tractor, mods: ["@t1"]}
        - {t: transfer, id: e1, verb: sell, giver: "@n1", object: "@x1", tense: past}
    - category: positive
      note: an adjective is a prop, the noun before the head a mod
      text: "Ines used a three-legged milking stool."
      instances:
        - {t: named-entity, id: n1, name: "Ines"}
        - {t: witness, id: x1, class: stool, props: [three_legged], mods: [milking]}
        - {t: activity, id: v1, verb: use, actor: "@n1", patient: "@x1", tense: past}
    - category: positive
      note: a compound whose head does not name what it is — one lemma, no mods
      text: "Lamine saw a guinea pig."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: guinea_pig}
        - {t: perception, id: p1, verb: see, perceiver: "@n1", stimulus: "@x1", tense: past}
    - category: positive
      note: former on the noun — it was one and is not one now
      text: "A former miller opened the gate."
      instances:
        - {t: witness, id: x1, class: miller, former: true}
        - {t: witness, id: x2, class: gate, definite: true}
        - {t: change-of-state, id: e1, verb: open, agent: "@x1", undergoer: "@x2", tense: past}
    - category: positive
      note: another — a referent of its own, no coreference with the first
      text: "A heron fished, and another heron slept."
      instances:
        - {t: witness, id: x1, class: heron}
        - {t: activity, id: v1, verb: fish, actor: "@x1", tense: past}
        - {t: witness, id: x2, class: heron}
        - {t: activity, id: v2, verb: sleep, actor: "@x2", tense: past}
    - category: positive
      note: two adjectives on the noun — one narrowed class each, both together, each plain adjective derived
      text: "Lamine sold an old wooden chair."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: chair, props: [old, wooden]}
        - {t: transfer, id: e1, verb: sell, giver: "@n1", object: "@x1", tense: past}
    - category: positive
      note: a compass word before a common noun — a plain property
      text: "Yusra visited a northern village."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: village, props: [northern]}
        - {t: activity, id: v1, verb: visit, actor: "@n1", patient: "@x1", tense: past}
    - category: abstain
      note: an epistemic adjective before the noun — not a property; the noun phrase, and the clause that needs it, unmapped
      text: "Lamine chased a suspected thief."
      expected: {abstain: true, gap: G00, span: "a suspected thief"}
    - category: positive
      note: a commit hash in brackets after a common noun phrase — a tag on the witness, as written
      text: "Yusra sent the patch (a3d90be) to Lamine."
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, class: patch, definite: true, tags: ["a3d90be"]}
        - {t: named-entity, id: n2, name: "Lamine"}
        - {t: transfer, id: e1, verb: send, giver: "@n1", recipient: "@n2", object: "@x1", tense: past}
    - category: positive
      note: an abbreviation of a common noun phrase in brackets — no name to add to, a tag on the witness
      text: "Lamine washed the field kitchen (FK)."
      instances:
        - {t: named-entity, id: n1, name: "Lamine"}
        - {t: witness, id: x1, class: kitchen, mods: [field], definite: true, tags: ["FK"]}
        - {t: activity, id: v1, verb: wash, actor: "@n1", patient: "@x1", tense: past}
