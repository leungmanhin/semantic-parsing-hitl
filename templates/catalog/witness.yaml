# Template: witness  (stub for review: the minimal referent template a common-noun phrase needs)

id: witness
family: referent
kind: referent
title: A common-noun phrase introducing an individual
status: stub

trigger:
  construction: >
    A noun phrase headed by a common noun with a determiner or a modifier — a thermos, the
    quilt, this spindle, two envelopes' member — introducing an individual of that kind. The
    individual gets a numbered witness symbol; whether the phrase is definite is recorded. A
    possessive phrase (Yusra's quilt, the quilt of Yusra, her quilt) is a witness with its
    possessor recorded: the possessor is a referent — a name, a witness, or for a possessive
    pronoun (her quilt) a mention instance of its own, linked to its antecedent by a coref
    instance; the possessor presupposes the witness, so no definite mark is needed. A
    noun that names an event or a period (meeting, audit, war, trip, storm) is a witness like any
    other; when the clause puts the noun itself in time (the meeting is at noon, the audit was on
    Monday), mark it eventive so that the time can attach to it.
  surface_forms:
    - "a <N>"                       # indefinite
    - "the <N>"                     # definite
    - "<Adj> <N>"                   # the property is recorded beside the kind
    - "<possessor>'s <N>"           # the possessor is recorded; definite
    - "the <N> of <possessor>"      # the same
  boundary:
    - >-
      a bare plural read generically — dogs bark: a kind-level statement, not a witness
    - >-
      a plural noun phrase — the ferrets, two envelopes: a group of individuals, not one
      witness
    - >-
      a proper name — Teodor: a named entity

slots:
  id:       {type: id, required: true}
  kind:     {type: lemma, class: Class, required: true, doc: "the head noun's lemma"}
  definite: {type: bool, required: false, doc: "true for the / this / that; absent for a / an and for a possessed phrase (the possessor presupposes it)"}
  props:    {type: list, class: Class, required: false, doc: "adjectival properties stated in the phrase"}
  possessor: {type: filler, class: Entity, required: false,
              doc: "the possessor of a possessive phrase: Yusra's quilt, the quilt of Yusra, her quilt; a referent id (for a possessive pronoun, the id of its mention instance), or a bare lemma for a kind-level possessor"}
  eventive: {type: bool, required: false,
             doc: "true when the noun names an event or a period and the clause puts the noun itself in time (the meeting is at noon); absent otherwise"}

mints: {id: Entity, stem: kind, also: {Event: eventive}}      # an eventive witness is an Event too

presupposed: [definite, possessor]      # a definite or possessed witness exists whatever scope mentions it

emits:
  - atom: "(Member @id {kind})"
  - atom: "(Member @id {props})"
    each: props
  - atom: "(Possession @id {possessor})"
    if_filled: possessor

examples:
  shown:
    - category: positive
      text: "a thermos"
      instances:
        - {t: witness, id: n1, kind: thermos}
    - category: positive
      note: a possessive phrase — the possessor is a referent of its own
      text: "Yusra's quilt"
      instances:
        - {t: named-entity, id: n1, name: "Yusra"}
        - {t: witness, id: x1, kind: quilt, definite: true, possessor: "@n1"}
  held_out:
    - category: positive
      text: "the old quilt"
      instances:
        - {t: witness, id: x1, kind: quilt, definite: true, props: [old]}
