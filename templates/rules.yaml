  - id: transparent
    meaning: a property whose felt or complemented state entails the bare property of its bearer (the bridge rule felt_state_holds reads it)
    head: Transparent
    truth: {strength: 1.0, confidence: 0.99}
    reads: [sensation, adjective-complement]
