# Background rules of the catalog, stated once in a consumer-neutral form.
#
# A rule says what the parse deliberately leaves out: an inference the text licenses but does not
# state. Its premises and conclusion are atom patterns over the substrate's heads with `$`
# variables; `computations` are the arithmetic steps a conclusion needs; `truth` is how reliable
# the inference is (0.99 for a congruence or an arithmetic rule, 0.9 for a generalization a later
# fact can revise); `semantics: deductive` means the conclusion follows from the premises and
# nothing follows from their absence, forward only; `semantics: equivalence` means the one premise
# and the conclusion hold together (a symmetric relation read from either side), so the rule is used
# in both directions and a denied side denies the other. Nothing here names a consumer: `python -m
# tmpl.rules` validates the rules and lowers them for one (generated/seeded_rules.metta for the
# chainer, where the deductive semantics becomes an explicit conditional truth value and an
# equivalence the chainer's Equivalence link).

rules:
  - id: result_holds
    meaning: a change's named result holds afterwards
    premises: ["(Result $e (Member $x $s))"]
    conclusion: "(Member $x $s)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [change-of-state]
    notes: >-
      Reads the sealed Result term a change-of-state instance emits (became a locksmith, got wet)
      and binds x and s inside it. "Became" says what the change was into; that it still holds is
      this rule's claim, revisable by a later change.

  # Coreference: a stated link (Coref mention antecedent) carries the mention's facts to the
  # antecedent at the link's strength (its probability of identity), and back.
  - id: between_sym
    meaning: between a and b is between b and a
    premises: ["(Between $x $a $b)"]
    conclusion: "(Between $x $b $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: equivalence
    reads: [oblique, postmodifier, locative, location]
    notes: >-
      An equivalence: "between the KDP and the PUK" and "between the PUK and the KDP" say the same,
      so a question in either order finds the statement, a denial included.
  - id: coref_sym
    meaning: a coreference link holds in both directions
    premises: ["(Coref $a $b)"]
    conclusion: "(Coref $b $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: equivalence
    reads: [coref]
    notes: >-
      An equivalence: the link read from either mention is the same link, so the chainer's
      Equivalence carries it both ways, and a denied link (not the same person) is denied both
      ways too.
  - id: coref_agent
    meaning: a mention's Agent role holds of its antecedent
    premises: ["(Coref $m $a)", "(Agent $e $m)"]
    conclusion: "(Agent $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_patient
    meaning: a mention's Patient role holds of its antecedent
    premises: ["(Coref $m $a)", "(Patient $e $m)"]
    conclusion: "(Patient $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_theme
    meaning: a mention's Theme role holds of its antecedent
    premises: ["(Coref $m $a)", "(Theme $e $m)"]
    conclusion: "(Theme $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_recipient
    meaning: a mention's Recipient role holds of its antecedent
    premises: ["(Coref $m $a)", "(Recipient $e $m)"]
    conclusion: "(Recipient $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_experiencer
    meaning: a mention's Experiencer role holds of its antecedent
    premises: ["(Coref $m $a)", "(Experiencer $e $m)"]
    conclusion: "(Experiencer $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_bearer
    meaning: a mention's Bearer role holds of its antecedent
    premises: ["(Coref $m $a)", "(Bearer $e $m)"]
    conclusion: "(Bearer $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_stimulus
    meaning: a mention's Stimulus role holds of its antecedent
    premises: ["(Coref $m $a)", "(Stimulus $e $m)"]
    conclusion: "(Stimulus $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_holder
    meaning: a mention's Holder role holds of its antecedent
    premises: ["(Coref $m $a)", "(Holder $e $m)"]
    conclusion: "(Holder $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_goal
    meaning: a mention's Goal role holds of its antecedent
    premises: ["(Coref $m $a)", "(Goal $e $m)"]
    conclusion: "(Goal $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_source
    meaning: a mention's Source role holds of its antecedent
    premises: ["(Coref $m $a)", "(Source $e $m)"]
    conclusion: "(Source $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_location
    meaning: a mention's Location role holds of its antecedent
    premises: ["(Coref $m $a)", "(Location $e $m)"]
    conclusion: "(Location $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_member
    meaning: a mention's class or property holds of its antecedent
    premises: ["(Coref $m $a)", "(Member $m $k)"]
    conclusion: "(Member $a $k)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_possession
    meaning: what a mention possesses, its antecedent possesses
    premises: ["(Coref $m $a)", "(Possession $x $m)"]
    conclusion: "(Possession $x $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_locatedin
    meaning: where a mention is, its antecedent is
    premises: ["(Coref $m $a)", "(LocatedIn $m $p)"]
    conclusion: "(LocatedIn $a $p)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]

  # Dates: a deictic time is an offset from the text's reference time (the anchor), and the anchor
  # carries calendar fields when the caller states the date. Within one month the day number
  # follows by arithmetic; month and year are carried at 0.9. No boundary handling yet: a time n
  # days before the 1st needs a days-in-month table and a previous-month rule, and weekdays need
  # modular arithmetic.
  - id: days_before_day
    meaning: a time n days before an anchor has the anchor's day number minus n
    premises: ["(BeforeBy $t $a $n day)", "(Day $a $d)"]
    computations: [{result: "$e", op: "-", args: ["$d", "$n"]}]
    conclusion: "(Day $t $e)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_after_day
    meaning: a time n days after an anchor has the anchor's day number plus n
    premises: ["(BeforeBy $a $t $n day)", "(Day $a $d)"]
    computations: [{result: "$e", op: "+", args: ["$d", "$n"]}]
    conclusion: "(Day $t $e)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_before_month
    meaning: a time some days before an anchor is in the anchor's month
    premises: ["(BeforeBy $t $a $n day)", "(Month $a $m)"]
    conclusion: "(Month $t $m)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_before_year
    meaning: a time some days before an anchor is in the anchor's year
    premises: ["(BeforeBy $t $a $n day)", "(Year $a $y)"]
    conclusion: "(Year $t $y)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_after_month
    meaning: a time some days after an anchor is in the anchor's month
    premises: ["(BeforeBy $a $t $n day)", "(Month $a $m)"]
    conclusion: "(Month $t $m)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_after_year
    meaning: a time some days after an anchor is in the anchor's year
    premises: ["(BeforeBy $a $t $n day)", "(Year $a $y)"]
    conclusion: "(Year $t $y)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]

  # Occasions: a frequency rule quantifies over a class of times — (Member $t day), (Member $t
  # sunday). A time instance states its granularity itself ((Member t day) from the time
  # template); these rules add the weekday's and the month's own classes from the fields, so a
  # rule over the Sundays instantiates at a stated Sunday.
  - id: weekday_class
    meaning: a time instance with a weekday field is a member of that weekday's class
    premises: ["(Weekday $t $w)"]
    conclusion: "(Member $t $w)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [time]
    notes: >-
      "Ottoline swims on Sundays" is a rule over (Member $t sunday); a stated Sunday carries
      (Weekday sk_time_9 sunday) and joins the rule through this congruence.
  - id: month_class
    meaning: a time instance with a month field is a member of that month's class
    premises: ["(Month $t $m)"]
    conclusion: "(Member $t $m)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [time]
  # Comparison: the parse emits the most specific atom (More, MoreBy, SameDegree, TimesAs) on the
  # surface pole; these derive the rest. The pole lexicon (the ScaleOpposite facts below) lets a
  # consumer chain across poles: a comparison on one pole is the reverse comparison on the other.
  - id: more_trans
    meaning: exceeding is transitive on a scale
    premises: ["(More $s $x $y)", "(More $s $y $z)"]
    conclusion: "(More $s $x $z)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]
  - id: samedegree_sym
    meaning: an equative holds in both directions
    premises: ["(SameDegree $s $x $y)"]
    conclusion: "(SameDegree $s $y $x)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: equivalence
    reads: [comparative]
    notes: >-
      An equivalence: "as tall as" read from either side is the same equative, so a denied
      equative (Lamine is not as tall as Yusra, (Not (SameDegree tall …))) is denied from the
      other side as well — the logical form's symmetry, not the English hint that he is shorter.
  - id: morebydiff
    meaning: a measured gap entails the plain ordering
    premises: ["(MoreBy $s $x $y $n $u)"]
    conclusion: "(More $s $x $y)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]
  - id: morebydiff_trans
    meaning: measured gaps add along a chain in one unit
    premises: ["(MoreBy $s $x $y $a $u)", "(MoreBy $s $y $z $b $u)"]
    computations: [{result: "$c", op: "+", args: ["$a", "$b"]}]
    conclusion: "(MoreBy $s $x $z $c $u)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]

  - id: ratio_more_gt
    meaning: a factor above one entails the plain ordering
    premises: ["(TimesAs $s $x $y $f)"]
    computations: [{result: true, op: ">", args: ["$f", 1]}]
    conclusion: "(More $s $x $y)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]
  - id: ratio_more_lt
    meaning: a factor below one entails the reverse ordering
    premises: ["(TimesAs $s $x $y $f)"]
    computations: [{result: true, op: "<", args: ["$f", 1]}]
    conclusion: "(More $s $y $x)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]


  # Poles: the ScaleOpposite facts name the two adjectives of one dimension; a comparison on one
  # pole is the reverse comparison on the other (shorter than = taller than, the other way round).
  # One route per conclusion: a measured gap flips as a gap and then yields the ordering through
  # morebydiff; there is no direct gap-to-ordering pole edge.
  - id: so_sym
    meaning: the poles of a dimension are opposite in both directions
    premises: ["(ScaleOpposite $a $b)"]
    conclusion: "(ScaleOpposite $b $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: equivalence
    reads: [comparative]
  - id: pole_more
    meaning: exceeding on one pole is being exceeded on the opposite pole
    premises: ["(ScaleOpposite $a $b)", "(More $a $x $y)"]
    conclusion: "(More $b $y $x)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]
    notes: >-
      "Bob is shorter than Alice", (More short bob alice), gives (More tall alice bob), so a
      question worded on the other pole is answered; the stated pole stays the stated atom.
  - id: pole_moreby
    meaning: a measured gap on one pole is the same gap the other way on the opposite pole
    premises: ["(ScaleOpposite $a $b)", "(MoreBy $a $x $y $n $u)"]
    conclusion: "(MoreBy $b $y $x $n $u)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]
  - id: pole_samedegree
    meaning: an equative on one pole is an equative on the opposite pole
    premises: ["(ScaleOpposite $a $b)", "(SameDegree $a $x $y)"]
    conclusion: "(SameDegree $b $x $y)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]

  # Units: the parse keeps a measure in its stated unit; the UnitFactor facts give each unit's
  # factor to the dimension's canonical unit (metre, kilogram, second, litre), and these rules
  # derive the measure, the bound and the gap in the canonical unit, so that measures stated in
  # different units compare. A consumer queries or thresholds in the canonical unit, or converts
  # its threshold with the same factor. Conversions are linear; an affine unit (a temperature
  # scale) has no factor and is not converted.
  - id: unit_measure
    meaning: a measure in a unit with a factor holds in the canonical unit
    premises: ["(Measure $x $d $n $u)", "(UnitFactor $u $c $f)"]
    computations: [{result: "$m", op: "*", args: ["$n", "$f"]}]
    conclusion: "(Measure $x $d $m $c)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [measure]
  - id: unit_atleast
    meaning: a lower bound converts like a measure
    premises: ["(MeasureAtLeast $x $d $n $u)", "(UnitFactor $u $c $f)"]
    computations: [{result: "$m", op: "*", args: ["$n", "$f"]}]
    conclusion: "(MeasureAtLeast $x $d $m $c)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [measure]
  - id: unit_atmost
    meaning: an upper bound converts like a measure
    premises: ["(MeasureAtMost $x $d $n $u)", "(UnitFactor $u $c $f)"]
    computations: [{result: "$m", op: "*", args: ["$n", "$f"]}]
    conclusion: "(MeasureAtMost $x $d $m $c)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [measure]
  - id: unit_moreby
    meaning: a measured gap converts to the canonical unit
    premises: ["(MoreBy $s $x $y $n $u)", "(UnitFactor $u $c $f)"]
    computations: [{result: "$m", op: "*", args: ["$n", "$f"]}]
    conclusion: "(MoreBy $s $x $y $m $c)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]

  # Measures and orderings: two measures on one dimension in one unit give the gap between the
  # things (morebydiff then gives the ordering), equal measures the equative; an ordering on a
  # dimension NOUN (weight, age) is carried onto the noun's adjective scale by the DimensionScale
  # facts, where the pole lexicon takes over.
  - id: measure_moreby
    meaning: two measures on one dimension in one unit give the gap between the things
    premises: ["(Measure $x $d $a $u)", "(Measure $y $d $b $u)"]
    computations: [{result: "$g", op: "-", args: ["$a", "$b"]}, {result: true, op: ">", args: ["$g", 0]}]
    conclusion: "(MoreBy $d $x $y $g $u)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [measure, comparative]
    notes: >-
      "The rope is 3 metres long" and "the beam is 2 metres long" give (MoreBy long sk_rope_1
      sk_beam_1 1.0 metre), and morebydiff the ordering (More long sk_rope_1 sk_beam_1). A
      dimension stated as a noun (weighs 12 kilograms: weight) orders on that noun until the
      dimension rules carry it onto the adjective; measures stated in different units meet in
      the canonical unit first.
  - id: measure_same
    meaning: equal measures on one dimension in one unit give the equative
    premises: ["(Measure $x $d $a $u)", "(Measure $y $d $a $u)"]
    computations: [{result: true, op: "!=", args: ["$x", "$y"]}]
    conclusion: "(SameDegree $d $x $y)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [measure, comparative]
  - id: dimension_more
    meaning: an ordering on a dimension noun is the ordering on its adjective scale
    premises: ["(More $d $x $y)", "(DimensionScale $d $s)"]
    conclusion: "(More $s $x $y)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [measure, comparative]
  - id: dimension_moreby
    meaning: a gap on a dimension noun is the gap on its adjective scale
    premises: ["(MoreBy $d $x $y $n $u)", "(DimensionScale $d $s)"]
    conclusion: "(MoreBy $s $x $y $n $u)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [measure, comparative]
  - id: dimension_samedegree
    meaning: an equative on a dimension noun is the equative on its adjective scale
    premises: ["(SameDegree $d $x $y)", "(DimensionScale $d $s)"]
    conclusion: "(SameDegree $s $x $y)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [measure, comparative]

  # Superlatives: the top of a class exceeds every other member, and no member exceeds the top. The
  # second rule concludes a negation, which the chainer answers as the positive at strength 0 — so
  # "is Bob older than Lamine?" gets a no, not an unknown.
  - id: most_exceeds
    meaning: the most ADJ member of a class exceeds every other member on the scale
    premises: ["(Most $s $x $c)", "(Member $y $c)"]
    computations: [{result: true, op: "!=", args: ["$x", "$y"]}]
    conclusion: "(More $s $x $y)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [superlative, comparative]
  - id: rank_orders
    meaning: of two ranks on one scale in one class, the lower is the greater (the second largest exceeds the third)
    premises: ["(Ordinal $a $m $s $c)", "(Ordinal $b $n $s $c)"]
    computations: [{result: true, op: "<", args: ["$m", "$n"]}, {result: true, op: "!=", args: ["$s", "$c"]}]
    conclusion: "(More $s $a $b)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [superlative, comparative]
    notes: >-
      Only an ordering on a scale compares: a counted ordinal (the third ferret, her second novel) and the
      first to V have the class as their ordering, and the guard keeps them out. Two texts that rank in
      the same comparison class compare — "the second largest town in the valley" and "the third largest
      town in the valley" give the same term.
  - id: most_rank_one
    meaning: the most ADJ member of a class is first on that scale in that class
    premises: ["(Most $s $x $c)"]
    conclusion: "(Ordinal $x 1 $s $c)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [superlative]
  - id: most_bounds
    meaning: no member of a class exceeds its most ADJ member on the scale
    premises: ["(Most $s $x $c)", "(Member $y $c)"]
    conclusion: "(Not (More $s $y $x))"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [superlative, comparative]
    notes: >-
      "Lamine is the oldest glazier" with "Bob is a glazier": (Not (More old sk_bob_1 sk_lamine_1))
      — the chainer answers the positive query at strength 0, which a band query reads as no. The
      instance y = x is harmless: nothing exceeds itself.

  # Counterfactuals: the antecedent of a subjunctive conditional is presupposed false; the rule
  # derives it from the sealed term (the chainer projects the term's conjuncts, denied).
  - id: counterfactual_antecedent_false
    meaning: a counterfactual's antecedent did not happen
    requires: sealed-term-projection
    premises: ["(Counterfactual $p $q)"]
    conclusion: "(Not $p)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [counterfactual]
    notes: >-
      "If Lamine had sung, Yusra would have left" seals both clauses; the form presupposes that
      Lamine did not sing, which this rule states as the denial of the antecedent's conjuncts.

  # Felt and complemented states: a state eventuality with an experiencer yields the bearer's bare
  # property only for the adjectives the Transparent lexicon lists (feeling tired is being tired;
  # afraid of the ferret is afraid), never for guilty, fond or good.
  - id: felt_state_holds
    meaning: a transparent felt or complemented state yields the bearer's bare property
    premises: ["(Member $s $p)", "(Experiencer $s $x)", "(Transparent $p)"]
    conclusion: "(Member $x $p)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [sensation, adjective-complement]
    notes: >-
      "Yusra feels tired" gives (Member sk_yusra_1 tired) and "Teodor is afraid of the ferret"
      (Member sk_teodor_1 afraid), at the generalization confidence 0.9; "Lamine feels guilty"
      and "Teodor is good at chess" yield nothing, since guilty and good are not listed. A
      copular state minted on demand carries no Experiencer, so the rule never reads it; the
      flat atom beside it is the property.

  # Parts and wholes: a part of a part is a part of the whole, and a part is where its whole is.
  - id: subset_is_part
    meaning: a quantified portion of a group is a part of it
    premises: ["(SubsetOf $s $g)"]
    conclusion: "(PartOf $s $g)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [portion]
    notes: >-
      "Three of the ferrets" is a subset group of the ferrets; as a part of the group its
      members are members of the group through partof_trans, and it is where the group is.
  - id: partof_trans
    meaning: a part of a part is a part of the whole
    premises: ["(PartOf $x $y)", "(PartOf $y $z)"]
    conclusion: "(PartOf $x $z)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [part-whole]
    notes: >-
      "The wick is part of the lantern" and "the lantern is part of the lamp" give the wick as a
      part of the lamp. Membership is carried the same way (a member of a guild that is part of
      a federation), at the generalization confidence rather than a definitional one.
  - id: part_located
    meaning: a part is where its whole is
    premises: ["(PartOf $p $w)", "(LocatedIn $w $l)"]
    conclusion: "(LocatedIn $p $l)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [part-whole, locative]
    notes: >-
      "The lid is part of the box" with "the box is in the shed" places the lid in the shed.

  # Stative relations need no symmetry rule: a relation that holds the other way round by its
  # meaning (married, similar, cousin) is one state with two bearers, both Bearer; the
  # stative-relation template's lexicon decides the roles and a question names the other bearer.

  # Appearances: what looks, sounds, feels, smells, tastes or seems so may be taken to be so —
  # a defeasible default at the catalog's weakest claim kind (0.9 at 0.7), so that any direct
  # statement overrides it on revision and a band query tells the derived claim from a stated
  # one. Nothing follows from a negated evidential, and nothing runs the other way.
  - id: look_holds
    meaning: what looks so is taken to be so
    requires: sealed-term-projection
    premises: ["(Look $p)"]
    conclusion: "$p"
    truth: {strength: 0.9, confidence: 0.7}
    semantics: deductive
    reads: [evidential]
