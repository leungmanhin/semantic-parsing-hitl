# Lexicon facts: background atoms with no variables, loaded beside the rules. A group names its
# head and its entries (one argument list per atom); each entry becomes a statement named by the
# group id and the entry's symbols — (: pole_short_tall (ScaleOpposite short tall) (STV 1.0 0.99)).
# Never parser output: the parse keeps the surface pole, the stated unit and the dimension word.
facts:
  - id: pole
    meaning: the two adjectives of one gradable dimension, the lower pole first (so_sym gives the reverse pair)
    head: ScaleOpposite
    truth: {strength: 1.0, confidence: 0.99}
    reads: [comparative]
    notes: >-
      One pair per dimension. A word with two dimensions (short: height and length; hard:
      hardness and difficulty) is listed once, on the dimension of its commonest comparative,
      since the scale symbol carries no sense and a pair applies wherever the word is used — the
      price of keeping the surface word as the scale.
    entries:
      - [short, tall]
      - [weak, strong]
      - [slow, fast]
      - [cheap, expensive]
      - [light, heavy]
      - [narrow, wide]
      - [shallow, deep]
      - [low, high]
      - [young, old]
      - [cold, hot]
      - [cool, warm]
      - [dim, bright]
      - [quiet, loud]
      - [small, large]
      - [small, big]
      - [thin, thick]
      - [few, many]
      - [little, much]
      - [poor, rich]
      - [empty, full]
      - [early, late]
      - [soft, hard]
      - [bad, good]
      - [near, far]
      - [simple, complex]
      - [easy, difficult]
      - [rare, common]
      - [sad, happy]
      - [ugly, beautiful]
  - id: unit
    meaning: a magnitude in the unit times the factor is the magnitude in the canonical unit (metre, kilogram, second, litre); a spelling variant has the factor 1
    head: UnitFactor
    truth: {strength: 1.0, confidence: 0.99}
    reads: [measure, comparative]
    notes: >-
      Linear factors only: a temperature scale is affine and has none, a currency has no fixed
      one. Calendar units take their average length (a month 2629800 seconds, a year 31557600).
      The factors are the legacy lexicon's; the spelling variants (meter, liter) convert at 1 so
      that both spellings of a unit meet in the canonical one.
    entries:
      - [meter, metre, 1]
      - [centimetre, metre, 0.01]
      - [centimeter, metre, 0.01]
      - [millimetre, metre, 0.001]
