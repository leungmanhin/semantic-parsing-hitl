  - id: coref_stimulus
    meaning: a mention's Stimulus role holds of its antecedent
    premises: ["(Coref $m $a)", "(Stimulus $e $m)"]
    conclusion: "(Stimulus $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_holder
    meaning: a mention's Holder role holds of its antecedent
    premises: ["(Coref $m $a)", "(Holder $e $m)"]
    conclusion: "(Holder $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_goal
    meaning: a mention's Goal role holds of its antecedent
    premises: ["(Coref $m $a)", "(Goal $e $m)"]
    conclusion: "(Goal $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_source
    meaning: a mention's Source role holds of its antecedent
    premises: ["(Coref $m $a)", "(Source $e $m)"]
