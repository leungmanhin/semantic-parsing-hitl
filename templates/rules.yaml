    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_member
    meaning: a mention's kind or property holds of its antecedent
    premises: ["(Coref $m $a)", "(Member $m $k)"]
    conclusion: "(Member $a $k)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_possession
    meaning: what a mention possesses, its antecedent possesses
    premises: ["(Coref $m $a)", "(Possession $x $m)"]
