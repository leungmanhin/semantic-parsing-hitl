  # Dates: a deictic time is an offset from the text's reference time (the anchor), and the anchor
  # carries calendar fields when the caller states the date. Within one month the day number
  # follows by arithmetic; month and year are carried at 0.9. No boundary handling yet: a time n
  # days before the 1st needs a days-in-month table and a previous-month rule, and weekdays need
  # modular arithmetic.
  - id: days_before_day
    meaning: a time n days before an anchor has the anchor's day number minus n
    premises: ["(BeforeBy $t $a $n day)", "(Day $a $d)"]
    computations: [{result: "$e", op: "-", args: ["$d", "$n"]}]
    conclusion: "(Day $t $e)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_after_day
    meaning: a time n days after an anchor has the anchor's day number plus n
    premises: ["(BeforeBy $a $t $n day)", "(Day $a $d)"]
    computations: [{result: "$e", op: "+", args: ["$d", "$n"]}]
    conclusion: "(Day $t $e)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_before_month
    meaning: a time some days before an anchor is in the anchor's month
    premises: ["(BeforeBy $t $a $n day)", "(Month $a $m)"]
    conclusion: "(Month $t $m)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_before_year
    meaning: a time some days before an anchor is in the anchor's year
    premises: ["(BeforeBy $t $a $n day)", "(Year $a $y)"]
    conclusion: "(Year $t $y)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_after_month
    meaning: a time some days after an anchor is in the anchor's month
    premises: ["(BeforeBy $a $t $n day)", "(Month $a $m)"]
