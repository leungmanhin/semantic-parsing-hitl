    semantics: deductive
    reads: [coref]

  # Dates: a deictic time is an offset from the text's reference time (the anchor), and the anchor
  # carries calendar fields when the caller states the date. Within one month the day number
  # follows by arithmetic; month and year are carried at 0.9. No boundary handling yet: a time n
  # days before the 1st needs a days-in-month table and a previous-month rule, and weekdays need
  # modular arithmetic.
  - id: days_before_day
    meaning: a time n days before an anchor has the anchor's day number minus n
    premises: ["(BeforeBy $t $a $n day)", "(Day $a $d)"]
    computations: [{result: "$e", op: "-", args: ["$d", "$n"]}]
    conclusion: "(Day $t $e)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_after_day
    meaning: a time n days after an anchor has the anchor's day number plus n
    premises: ["(BeforeBy $a $t $n day)", "(Day $a $d)"]
    computations: [{result: "$e", op: "+", args: ["$d", "$n"]}]
    conclusion: "(Day $t $e)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_before_month
    meaning: a time some days before an anchor is in the anchor's month
    premises: ["(BeforeBy $t $a $n day)", "(Month $a $m)"]
    conclusion: "(Month $t $m)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_before_year
    meaning: a time some days before an anchor is in the anchor's year
    premises: ["(BeforeBy $t $a $n day)", "(Year $a $y)"]
    conclusion: "(Year $t $y)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_after_month
    meaning: a time some days after an anchor is in the anchor's month
    premises: ["(BeforeBy $a $t $n day)", "(Month $a $m)"]
    conclusion: "(Month $t $m)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_after_year
    meaning: a time some days after an anchor is in the anchor's year
    premises: ["(BeforeBy $a $t $n day)", "(Year $a $y)"]
    conclusion: "(Year $t $y)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]

  # Non-finite complements: a control, causative or aspectual verb seals its complement as its
  # Theme and the parse marks what the verb implies — (Entails e): the complement holds;
  # (Precludes e): it does not. These rules derive the complement, or its negation, with the
  # matrix event's tense carried onto the complement's event (the `clause-event` computation names
  # it: the event of the clause's first atom). They conclude a bound term's conjuncts, which the
  # chainer cannot do yet: writing them out per clause size instead (a variable per conjunct) makes
  # its backward search try every rule for every goal — measured at seconds to minutes per query —
  # so they wait for the chainer's sealed-term projection and are not lowered until then.
  - id: theme_entailed
    meaning: an entailing event's sealed Theme holds, at the event's tense
    requires: sealed-term-projection
    expand: {tenses: [none, past, future], event: "$o", matrix: "$m"}
    premises: ["(Entails $m)", "(Theme $m $c)", "{tense}"]
    computations: [{result: "$o", op: clause-event, args: ["$c"]}]
    conclusion: "{tensed}"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [control, causative, aspectual]
    notes: >-
      "Lamine managed to open the shed" seals the opening under the managing's Theme and marks
      the managing (Entails sk_manage_1); with (Past sk_manage_1) this rule derives the opening's
      atoms and (Past sk_open_1). Under a negation or a modal the marker is inside the bundle, so
      nothing is derived: an implication is an entailment of the asserted clause, not a
      presupposition.
  - id: theme_precluded
    meaning: a precluding event's sealed Theme does not hold, at the event's tense
    requires: sealed-term-projection
    expand: {tenses: [none, past, future], event: "$o", matrix: "$m"}
    premises: ["(Precludes $m)", "(Theme $m $c)", "{tense}"]
    computations: [{result: "$o", op: clause-event, args: ["$c"]}]
    conclusion: "(Not {tensed})"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [control, causative]
    notes: >-
      "Teodor failed to arrive" marks the failing (Precludes sk_fail_1); the rule derives
      (Not (And (Member sk_arrive_1 arrive) (Agent sk_arrive_1 sk_teodor_1) (Past sk_arrive_1))),
      the catalog's own form for a denied past clause.
