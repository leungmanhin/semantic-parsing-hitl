# Background rules of the catalog, stated once in a consumer-neutral form.
#
# A rule says what the parse deliberately leaves out: an inference the text licenses but does not
# state. Its premises and conclusion are atom patterns over the substrate's heads with `$`
# variables; `computations` are the arithmetic steps a conclusion needs; `truth` is how reliable
# the inference is (0.99 for a congruence or an arithmetic rule, 0.9 for a generalization a later
# fact can revise); `semantics: deductive` means the conclusion follows from the premises and
# nothing follows from their absence, forward only. Nothing here names a consumer: `python -m
# tmpl.rules` validates the rules and lowers them for one (generated/seeded_rules.metta for the
# chainer, where the deductive semantics becomes an explicit conditional truth value).

rules:
  - id: result_holds
    meaning: a change's named result holds afterwards
    premises: ["(Result $e (Member $x $s))"]
    conclusion: "(Member $x $s)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [change-of-state]
    notes: >-
      Reads the sealed Result term a change-of-state instance emits (became a locksmith, got wet)
      and binds x and s inside it. "Became" says what the change was into; that it still holds is
      this rule's claim, revisable by a later change.

  # Coreference: a stated link (Coref mention antecedent) carries the mention's facts to the
  # antecedent at the link's strength (its probability of identity), and back.
  - id: coref_sym
    meaning: a coreference link holds in both directions
    premises: ["(Coref $a $b)"]
    conclusion: "(Coref $b $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_agent
    meaning: a mention's Agent role holds of its antecedent
    premises: ["(Coref $m $a)", "(Agent $e $m)"]
    conclusion: "(Agent $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_patient
    meaning: a mention's Patient role holds of its antecedent
    premises: ["(Coref $m $a)", "(Patient $e $m)"]
    conclusion: "(Patient $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_theme
    meaning: a mention's Theme role holds of its antecedent
    premises: ["(Coref $m $a)", "(Theme $e $m)"]
    conclusion: "(Theme $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_recipient
    meaning: a mention's Recipient role holds of its antecedent
    premises: ["(Coref $m $a)", "(Recipient $e $m)"]
    conclusion: "(Recipient $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_experiencer
    meaning: a mention's Experiencer role holds of its antecedent
    premises: ["(Coref $m $a)", "(Experiencer $e $m)"]
    conclusion: "(Experiencer $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_stimulus
    meaning: a mention's Stimulus role holds of its antecedent
    premises: ["(Coref $m $a)", "(Stimulus $e $m)"]
    conclusion: "(Stimulus $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_holder
    meaning: a mention's Holder role holds of its antecedent
    premises: ["(Coref $m $a)", "(Holder $e $m)"]
    conclusion: "(Holder $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_goal
    meaning: a mention's Goal role holds of its antecedent
    premises: ["(Coref $m $a)", "(Goal $e $m)"]
    conclusion: "(Goal $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_source
    meaning: a mention's Source role holds of its antecedent
    premises: ["(Coref $m $a)", "(Source $e $m)"]
    conclusion: "(Source $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_location
    meaning: a mention's Location role holds of its antecedent
    premises: ["(Coref $m $a)", "(Location $e $m)"]
    conclusion: "(Location $e $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_member
    meaning: a mention's class or property holds of its antecedent
    premises: ["(Coref $m $a)", "(Member $m $k)"]
    conclusion: "(Member $a $k)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_possession
    meaning: what a mention possesses, its antecedent possesses
    premises: ["(Coref $m $a)", "(Possession $x $m)"]
    conclusion: "(Possession $x $a)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]
  - id: coref_locatedin
    meaning: where a mention is, its antecedent is
    premises: ["(Coref $m $a)", "(LocatedIn $m $p)"]
    conclusion: "(LocatedIn $a $p)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [coref]

  # Dates: a deictic time is an offset from the text's reference time (the anchor), and the anchor
  # carries calendar fields when the caller states the date. Within one month the day number
  # follows by arithmetic; month and year are carried at 0.9. No boundary handling yet: a time n
  # days before the 1st needs a days-in-month table and a previous-month rule, and weekdays need
  # modular arithmetic.
  - id: days_before_day
    meaning: a time n days before an anchor has the anchor's day number minus n
    premises: ["(BeforeBy $t $a $n day)", "(Day $a $d)"]
    computations: [{result: "$e", op: "-", args: ["$d", "$n"]}]
    conclusion: "(Day $t $e)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_after_day
    meaning: a time n days after an anchor has the anchor's day number plus n
    premises: ["(BeforeBy $a $t $n day)", "(Day $a $d)"]
    computations: [{result: "$e", op: "+", args: ["$d", "$n"]}]
    conclusion: "(Day $t $e)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_before_month
    meaning: a time some days before an anchor is in the anchor's month
    premises: ["(BeforeBy $t $a $n day)", "(Month $a $m)"]
    conclusion: "(Month $t $m)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_before_year
    meaning: a time some days before an anchor is in the anchor's year
    premises: ["(BeforeBy $t $a $n day)", "(Year $a $y)"]
    conclusion: "(Year $t $y)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_after_month
    meaning: a time some days after an anchor is in the anchor's month
    premises: ["(BeforeBy $a $t $n day)", "(Month $a $m)"]
    conclusion: "(Month $t $m)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]
  - id: days_after_year
    meaning: a time some days after an anchor is in the anchor's year
    premises: ["(BeforeBy $a $t $n day)", "(Year $a $y)"]
    conclusion: "(Year $t $y)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [time, reference-time]

  # Occasions: a frequency rule quantifies over a class of times — (Member $t day), (Member $t
  # sunday). A time instance states its granularity itself ((Member t day) from the time
  # template); these rules add the weekday's and the month's own classes from the fields, so a
  # rule over the Sundays instantiates at a stated Sunday.
  - id: weekday_class
    meaning: a time instance with a weekday field is a member of that weekday's class
    premises: ["(Weekday $t $w)"]
    conclusion: "(Member $t $w)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [time]
    notes: >-
      "Ottoline swims on Sundays" is a rule over (Member $t sunday); a stated Sunday carries
      (Weekday sk_time_9 sunday) and joins the rule through this congruence.
  - id: month_class
    meaning: a time instance with a month field is a member of that month's class
    premises: ["(Month $t $m)"]
    conclusion: "(Member $t $m)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [time]
  # Comparison: the parse emits the most specific atom (More, MoreBy, SameDegree, TimesAs) on the
  # surface pole; these derive the rest. A pole lexicon (ScaleOpposite: short / tall) would let a
  # consumer chain across poles — background facts, not rules; not seeded yet.
  - id: more_trans
    meaning: exceeding is transitive on a scale
    premises: ["(More $s $x $y)", "(More $s $y $z)"]
    conclusion: "(More $s $x $z)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]
  - id: samedegree_sym
    meaning: an equative holds in both directions
    premises: ["(SameDegree $s $x $y)"]
    conclusion: "(SameDegree $s $y $x)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]
  - id: morebydiff
    meaning: a measured gap entails the plain ordering
    premises: ["(MoreBy $s $x $y $n $u)"]
    conclusion: "(More $s $x $y)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]
  - id: morebydiff_trans
    meaning: measured gaps add along a chain in one unit
    premises: ["(MoreBy $s $x $y $a $u)", "(MoreBy $s $y $z $b $u)"]
    computations: [{result: "$c", op: "+", args: ["$a", "$b"]}]
    conclusion: "(MoreBy $s $x $z $c $u)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]

  - id: ratio_more_gt
    meaning: a factor above one entails the plain ordering
    premises: ["(TimesAs $s $x $y $f)"]
    computations: [{result: true, op: ">", args: ["$f", 1]}]
    conclusion: "(More $s $x $y)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]
  - id: ratio_more_lt
    meaning: a factor below one entails the reverse ordering
    premises: ["(TimesAs $s $x $y $f)"]
    computations: [{result: true, op: "<", args: ["$f", 1]}]
    conclusion: "(More $s $y $x)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [comparative]

  # Superlatives: the top of a class exceeds every other member, and no member exceeds the top. The
  # second rule concludes a negation, which the chainer answers as the positive at strength 0 — so
  # "is Bob older than Lamine?" gets a no, not an unknown.
  - id: most_exceeds
    meaning: the most ADJ member of a class exceeds every other member on the scale
    premises: ["(Most $s $x $c)", "(Member $y $c)"]
    computations: [{result: true, op: "!=", args: ["$x", "$y"]}]
    conclusion: "(More $s $x $y)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [superlative, comparative]
  - id: most_bounds
    meaning: no member of a class exceeds its most ADJ member on the scale
    premises: ["(Most $s $x $c)", "(Member $y $c)"]
    conclusion: "(Not (More $s $y $x))"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [superlative, comparative]
    notes: >-
      "Lamine is the oldest glazier" with "Bob is a glazier": (Not (More old sk_bob_1 sk_lamine_1))
      — the chainer answers the positive query at strength 0, which a band query reads as no. The
      instance y = x is harmless: nothing exceeds itself.

  # Counterfactuals: the antecedent of a subjunctive conditional is presupposed false; the rule
  # derives it from the sealed term (the chainer projects the term's conjuncts, denied).
  - id: counterfactual_antecedent_false
    meaning: a counterfactual's antecedent did not happen
    requires: sealed-term-projection
    premises: ["(Counterfactual $p $q)"]
    conclusion: "(Not $p)"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [counterfactual]
    notes: >-
      "If Lamine had sung, Yusra would have left" seals both clauses; the form presupposes that
      Lamine did not sing, which this rule states as the denial of the antecedent's conjuncts.

  # Norms: an obligation implies a permission. The parse states only what the text says; a
  # prohibition and an exemption are denials (Not (Permitted P)) / (Not (Obligated P)) and need
  # no rule to be queried at strength 0.
  - id: obligation_permits
    meaning: what is obligatory is permitted
    requires: sealed-term-projection
    premises: ["(Obligated $p)"]
    conclusion: "(Permitted $p)"
    truth: {strength: 1.0, confidence: 0.99}
    semantics: deductive
    reads: [norm]
    notes: >-
      "Lamine must lock the shed" answers "may Lamine lock the shed?": the permission follows from
      the obligation over the same sealed clause. A weak obligation (should, 0.7) permits at the
      same strength.

  # Non-finite complements: a control, causative or aspectual verb seals its complement as its
  # Theme and the parse marks what the verb implies — (Entails e): the complement holds;
  # (Precludes e): it does not. These rules derive the complement, or its negation, with the
  # matrix event's tense carried onto the complement's event (the `clause-event` computation names
  # it: the event of the clause's first atom). They conclude a bound term's conjuncts, which the
  # chainer cannot do yet: writing them out per clause size instead (a variable per conjunct) makes
  # its backward search try every rule for every goal — measured at seconds to minutes per query —
  # so they wait for the chainer's sealed-term projection and are not lowered until then.
  - id: theme_entailed
    meaning: an entailing event's sealed Theme holds, at the event's tense
    requires: sealed-term-projection
    expand: {tenses: [none, past, future], event: "$o", matrix: "$m"}
    premises: ["(Entails $m)", "(Theme $m $c)", "{tense}"]
    computations: [{result: "$o", op: clause-event, args: ["$c"]}]
    conclusion: "{tensed}"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [control, causative, aspectual]
    notes: >-
      "Lamine managed to open the shed" seals the opening under the managing's Theme and marks
      the managing (Entails sk_manage_1); with (Past sk_manage_1) this rule derives the opening's
      atoms and (Past sk_open_1). Under a negation or a modal the marker is inside the bundle, so
      nothing is derived: an implication is an entailment of the asserted clause, not a
      presupposition.
  - id: theme_precluded
    meaning: a precluding event's sealed Theme does not hold, at the event's tense
    requires: sealed-term-projection
    expand: {tenses: [none, past, future], event: "$o", matrix: "$m"}
    premises: ["(Precludes $m)", "(Theme $m $c)", "{tense}"]
    computations: [{result: "$o", op: clause-event, args: ["$c"]}]
    conclusion: "(Not {tensed})"
    truth: {strength: 1.0, confidence: 0.9}
    semantics: deductive
    reads: [control, causative]
    notes: >-
      "Teodor failed to arrive" marks the failing (Precludes sk_fail_1); the rule derives
      (Not (And (Member sk_arrive_1 arrive) (Agent sk_arrive_1 sk_teodor_1) (Past sk_arrive_1))),
      the catalog's own form for a denied past clause.
